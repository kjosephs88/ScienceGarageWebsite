<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woo Me Wednesday!</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }

        .text {
            color: white;
            font-size: 9vw;
            font-weight: bold;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
            opacity: 0;
            transform: scale(0);
            animation: zoomIn 2s ease-out forwards, pulse 1.5s infinite 2s;
            perspective: 500px;
        }

        .line {
            display: block;
            text-shadow: 
                2px 2px 0px #ff0000, 
                4px 4px 0px #00ff00, 
                6px 6px 0px #0000ff, 
                8px 8px 10px rgba(255, 255, 255, 0.8);
        }

        @keyframes zoomIn {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="fireworks"></canvas>
    
    <div class="text">
        <span class="line">Woo Hoo! It's</span>
        <span class="line">Woo Me</span>
        <span class="line">Wednesday!</span>
    </div>

    <script>
        const canvas = document.getElementById("fireworks");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let fireworks = [];

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        class Firework {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.particles = [];

                for (let i = 0; i < 40; i++) { // Increased particles
                    this.particles.push(new Particle(this.x, this.y));
                }
            }

            update() {
                this.particles.forEach((particle, index) => {
                    particle.update();
                    if (particle.alpha <= 0) {
                        this.particles.splice(index, 1);
                    }
                });
            }

            draw() {
                this.particles.forEach(particle => particle.draw());
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = random(2, 4);
                this.color = `hsl(${random(0, 360)}, 100%, 50%)`;
                this.speedX = random(-3, 3);
                this.speedY = random(-3, 3);
                this.alpha = 1;
                this.gravity = 0.02;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += this.gravity;
                this.alpha -= 0.02;
            }

            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createFirework() {
            fireworks.push(new Firework(random(50, canvas.width - 50), random(50, canvas.height - 50)));
        }

        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            fireworks.forEach((firework, index) => {
                firework.update();
                firework.draw();
                if (firework.particles.length === 0) {
                    fireworks.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        setInterval(createFirework, 500); // Increased frequency
        animate();

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>

</body>
</html>

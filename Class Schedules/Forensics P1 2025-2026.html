<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #000;
}

/* Wrapper: centered horizontally, top-aligned vertically */
.iframe-wrapper {
    display: flex;
    justify-content: center;   /* center horizontally */
    align-items: flex-start;   /* stick to top */
    width: 100%;
    height: 100vh;
    background: #000;
}

/* Container that scales */
.scaled-container {
    transform-origin: top center; /* scale from top center */
    transition: transform 0.25s ease;
}

/* Iframe dimensions — adjust these as your “base size” */
iframe {
    border: none;
    width: 1100px;   /* <-- adjust base width */
    height: 700px;   /* <-- adjust base height */
    display: block;
}
</style>
</head>
<body>
<div class="iframe-wrapper">
    <div class="scaled-container" id="scaled-container">
        <iframe 
            src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQVRGMhpAmz2hUO9elMfWVbEjJnArQQyfTwaQr_bb7HhDOgyFL1wgvb7CVIskEypYz_wtha1KUJn9Dy/pubhtml?gridlines=false&widget=false&output=html&headers=false&single=true&gid=1053921241&chrome=false&range=A1:H30" 
            allowfullscreen>
        </iframe>
    </div>
</div>

<script>
function scaleIframe() {
    const baseWidth = 1100;   // same as iframe width
    const baseHeight = 700;   // same as iframe height
    const wrapper = document.querySelector('.iframe-wrapper');
    const container = document.getElementById('scaled-container');

    const availableWidth = wrapper.clientWidth;
    const availableHeight = wrapper.clientHeight;

    // Compute uniform scale to fit both dimensions
    const scale = Math.min(availableWidth / baseWidth, availableHeight / baseHeight);

    // Apply scaling (no translation needed because top-center origin)
    container.style.transform = `scale(${scale})`;
}

window.addEventListener('resize', scaleIframe);
window.addEventListener('load', scaleIframe);
</script>
</body>
</html>

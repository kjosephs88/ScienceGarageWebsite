<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Single Proportional Responsive Timer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f5f5f5; 
      font-family: Arial, sans-serif;
      overflow: hidden; /* Prevents any accidental scrollbars */
    }

    .timer-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 5vmin;
    }

    .timer {
      /* vmin ensures text scales based on the smaller screen dimension (width or height) */
      font-size: 22vmin; 
      font-weight: bold;
      color: black;
      margin-bottom: 6vmin;
      font-variant-numeric: tabular-nums; /* Prevents shifting digits */
      text-align: center;
    }

    .buttons-container {
      display: flex;
      gap: 4vmin;
      width: 90%;
      max-width: 85vmin; /* Keeps buttons in a readable aspect ratio */
      justify-content: center;
    }

    .btn {
      background: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 4.5vmin; /* Fully scalable button text */
      font-weight: bold;
      padding: 3vmin 4vmin;
      border-radius: 2.5vmin;
      cursor: pointer;
      user-select: none;
      flex: 1; /* Keeps buttons completely equal in size */
      text-align: center;
      touch-action: manipulation; /* Optimizes for mobile response and disables zoom delay */
      box-shadow: 0 0.8vmin 1.2vmin rgba(0,0,0,0.1);
      transition: background 0.1s, transform 0.1s;
    }

    .btn:active {
      background: #c0c0c0;
      transform: translateY(0.4vmin); 
      box-shadow: 0 0.4vmin 0.6vmin rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="timer-container">
    <div class="timer" id="display1">0.00 s</div>
    <div class="buttons-container">
      <div class="btn" id="startStop1">START / STOP</div>
      <div class="btn" id="clear1">CLEAR</div>
    </div>
  </div>

  <script>
    class Stopwatch {
      constructor(displayId, startStopId, clearId) {
        this.display = document.getElementById(displayId);
        this.startStopBtn = document.getElementById(startStopId);
        this.clearBtn = document.getElementById(clearId);
        
        this.startTime = 0;
        this.elapsedTime = 0;
        this.animationFrameId = null;
        this.isRunning = false;
        
        this.startStopBtn.addEventListener('click', () => this.toggleStartStop());
        this.clearBtn.addEventListener('click', () => this.clearTimer());
      }
      
      formatTime(ms) {
        const totalSec = Math.floor(ms / 1000);
        const centi = Math.floor((ms % 1000) / 10);
        const formattedCenti = centi < 10 ? '0' + centi : centi;
        return `${totalSec}.${formattedCenti} s`;
      }
      
      updateDisplay() {
        const now = Date.now();
        const currentMs = this.isRunning ? (this.elapsedTime + (now - this.startTime)) : this.elapsedTime;
        this.display.textContent = this.formatTime(currentMs);
      }
      
      tick = () => {
        if (this.isRunning) {
          this.updateDisplay();
          this.animationFrameId = requestAnimationFrame(this.tick);
        }
      }
      
      toggleStartStop() {
        if (this.isRunning) {
          this.elapsedTime += Date.now() - this.startTime;
          cancelAnimationFrame(this.animationFrameId);
          this.isRunning = false;
        } else {
          this.startTime = Date.now();
          this.isRunning = true;
          this.animationFrameId = requestAnimationFrame(this.tick);
        }
      }
      
      clearTimer() {
        if (this.isRunning) {
          this.elapsedTime = 0;
          this.startTime = Date.now();
        } else {
          this.elapsedTime = 0;
          this.updateDisplay();
        }
      }
    }

    // Instantiating only the single required stopwatch instance
    const timer1 = new Stopwatch('display1', 'startStop1', 'clear1');
  </script>
</body>
</html>

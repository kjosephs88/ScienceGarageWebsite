<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Classic Cat Jigsaw Puzzle</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #1e272e; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 10px;
            overflow: hidden; 
        }

        h1 {
            color: #fff;
            margin: 5px 0;
            font-size: 1.5rem;
        }

        #message {
            height: 24px;
            color: #0be881;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .canvas-container {
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            background: #f0f4f8; 
            max-width: 95vw;
            max-height: 80vh; 
        }

        canvas {
            border-radius: 4px;
            touch-action: none; 
        }
    </style>
</head>
<body>

    <h1>Classic Cat Jigsaw</h1>
    <div id="message">Loading Puzzle...</div>

    <img id="source-image" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20400%20400%22%3E%3Crect%20width%3D%22400%22%20height%3D%22400%22%20fill%3D%22%2381ecec%22%2F%3E%3Cpath%20d%3D%22M100%20300%20C100%20150%2C%20300%20150%2C%20300%20300%20Z%22%20fill%3D%22%232d3436%22%2F%3E%3Cpolygon%20points%3D%22110%2C180%2090%2C80%20170%2C140%22%20fill%3D%22%232d3436%22%2F%3E%3Cpolygon%20points%3D%22290%2C180%20310%2C80%20230%2C140%22%20fill%3D%22%232d3436%22%2F%3E%3Cpolygon%20points%3D%22115%2C165%20100%2C100%20155%2C145%22%20fill%3D%22%23fd79a8%22%2F%3E%3Cpolygon%20points%3D%22285%2C165%20300%2C100%20245%2C145%22%20fill%3D%22%23fd79a8%22%2F%3E%3Ccircle%20cx%3D%22160%22%20cy%3D%22200%22%20r%3D%2225%22%20fill%3D%22%23ffeaa7%22%2F%3E%3Ccircle%20cx%3D%22240%22%20cy%3D%22200%22%20r%3D%2225%22%20fill%3D%22%23ffeaa7%22%2F%3E%3Ccircle%20cx%3D%22160%22%20cy%3D%22200%22%20r%3D%2210%22%20fill%3D%22%23000%22%2F%3E%3Ccircle%20cx%3D%22240%22%20cy%3D%22200%22%20r%3D%2210%22%20fill%3D%22%23000%22%2F%3E%3Cpolygon%20points%3D%22190%2C230%20210%2C230%20200%2C245%22%20fill%3D%22%23fd79a8%22%2F%3E%3Cpath%20d%3D%22M170%20230%20L100%20220%20M170%20240%20L100%20240%20M170%20250%20L100%20260%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223%22%2F%3E%3Cpath%20d%3D%22M230%20230%20L300%20220%20M230%20240%20L300%20240%20M230%20250%20L300%20260%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223%22%2F%3E%3C%2Fsvg%3E" style="display: none;">

    <div class="canvas-container">
        <canvas id="puzzleCanvas" width="800" height="800"></canvas>
    </div>

    <script>
        const playFieldSize = 800; 
        const canvasSize = 400; 
        const rows = 3;
        const cols = 3;
        const snapThreshold = 30; 

        const solveOffsetX = (playFieldSize - canvasSize) / 2;
        const solveOffsetY = (playFieldSize - canvasSize) / 2;

        const canvas = new fabric.Canvas('puzzleCanvas');
        const message = document.getElementById('message');
        let piecesArray = [];
        let numSnapped = 0;

        const tabSize = 28; 
        const L = (canvasSize / cols) - (tabSize / 2); 

        const curveStub = "c 0 -15, 10 -28, 28 -28 s 28 10, 28 28";
        const reverseCurveStub = "c 0 15, 10 28, 28 28 s 28 -10, 28 -28";

        const paths = {
            rightMale:   `l ${L} 0 ${curveStub} l ${L} 0`,
            rightFemale: `l ${L} 0 ${reverseCurveStub} l ${L} 0`,
            downMale:    `l 0 ${L} ${reverseCurveStub} l 0 ${L}`,
            downFemale:  `l 0 ${L} ${curveStub} l 0 ${L}`,
            topMale:    `l ${-L} 0 ${curveStub} l ${-L} 0`,
            topFemale:  `l ${-L} 0 ${reverseCurveStub} l ${-L} 0`,
            leftMale:   `l 0 ${-L} ${reverseCurveStub} l 0 ${-L}`,
            leftFemale: `l 0 ${-L} ${curveStub} l 0 ${-L}`,
            S_h: `l ${canvasSize/cols} 0`,
            S_v: `l 0 ${canvasSize/rows}`,
            S_h_rev: `l ${-canvasSize/cols} 0`,
            S_v_rev: `l 0 ${-canvasSize/rows}`,
        };

        const edgeTypes = [
            ['S', 'T', 'T', 'S'], 
            ['S', 'F', 'T', 'F'], 
            ['S', 'S', 'F', 'T'],
            ['F', 'F', 'F', 'S'],
            ['T', 'T', 'T', 'T'],
            ['F', 'S', 'S', 'F'],
            ['T', 'T', 'S', 'S'],
            ['F', 'F', 'S', 'T'],
            ['T', 'S', 'S', 'F'],
        ];

        function getPiecePath(col, row) {
            const index = row * cols + col;
            const edges = edgeTypes[index];
            const p = paths;

            let pathString = `M 0 0 `; 

            pathString += (row === 0) ? p.S_h : (edges[0] === 'T' ? p.topMale : p.topFemale);
            pathString += (col === cols - 1) ? p.S_v : (edges[1] === 'T' ? p.rightMale : p.rightFemale);
            pathString += (row === rows - 1) ? p.S_h_rev : (edges[2] === 'F' ? p.downFemale : p.downMale);
            pathString += (col === 0) ? p.S_v_rev : (edges[3] === 'T' ? p.leftMale : p.leftFemale);

            pathString += " z"; 
            return pathString;
        }

        // Initialize immediately once the DOM is ready
        window.addEventListener('DOMContentLoaded', function() {
            const imgElement = document.getElementById('source-image');
            
            const img = new fabric.Image(imgElement);
            img.scaleToWidth(canvasSize);
            img.scaleToHeight(canvasSize);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const id = r * cols + c;
                    const pathData = getPiecePath(c, r);
                    
                    const shapePath = new fabric.Path(pathData, {
                        fill: 'white', 
                        stroke: '#999',
                        strokeWidth: 1,
                        objectCaching: false
                    });

                    img.clone(function(pieceImg) {
                        pieceImg.set({
                            left: -c * (canvasSize/cols), 
                            top: -r * (canvasSize/rows)
                        });

                        const pieceGroup = new fabric.Group([shapePath, pieceImg], {
                            left: 0, 
                            top: 0,
                            id: id,
                            hasControls: false, 
                            hasBorders: false,
                            solveX: c * (canvasSize/cols) + solveOffsetX, 
                            solveY: r * (canvasSize/rows) + solveOffsetY,
                            isSnapped: false
                        });

                        const maskPath = new fabric.Path(pathData, { absolutePositioned: true });
                        pieceGroup.clipPath = maskPath;

                        piecesArray.push(pieceGroup);

                        if (piecesArray.length === rows * cols) {
                            scatterPieces();
                        }
                    });
                }
            }
        });

        function scatterPieces() {
            canvas.clear(); 
            message.innerText = 'Drag the pieces to the center!';

            piecesArray.forEach(p => {
                const randomX = Math.random() * (playFieldSize - 200) + 50; 
                const randomY = Math.random() * (playFieldSize - 200) + 50;

                p.set({ left: randomX, top: randomY, isSnapped: false });
                canvas.add(p);
            });

            canvas.renderAll();
        }

        canvas.on('object:moving', function(e) {
            const piece = e.target;
            if (piece.isSnapped) return; 

            const distX = Math.abs(piece.left - piece.solveX);
            const distY = Math.abs(piece.top - piece.solveY);

            if (distX < snapThreshold && distY < snapThreshold) {
                piece.set({
                    left: piece.solveX,
                    top: piece.solveY,
                    isSnapped: true,
                    selectable: false, 
                    evented: false, 
                    opacity: 1
                });
                
                numSnapped++;
                piece.sendToBack(); 
                canvas.renderAll();
                checkWin();
            } else if (distX < snapThreshold + 15 || distY < snapThreshold + 15) {
                piece.set({ opacity: 0.7 });
            } else {
                piece.set({ opacity: 1 });
            }
        });

        function checkWin() {
            if (numSnapped === rows * cols) {
                message.innerText = '🐈 Meow! You fixed the Cat! 🐈';
            }
        }

    </script>
</body>
</html>

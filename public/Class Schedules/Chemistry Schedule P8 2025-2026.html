<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Class Schedule</title>
    
    <link rel="stylesheet" href="schedulerSTUDENT.css">
</head>
<body>

    <div id="scale-wrapper">
        <div id="scaled-content">
            <h1 class="page-title" id="calendar-title">Loading Class Data...</h1>

            <div class="toolbar">
                <div class="view-controls">
                    <select id="week-view-select" onchange="renderCalendar()">
                        <option value="1" selected>1 Week</option>
                        <option value="2">2 Weeks</option>
                        <option value="3">3 Weeks</option>
                    </select>
                </div>
                
                <div class="week-nav">
                    <button onclick="changeWeek(-1)">&lt; Prev</button>
                    <h2 id="date-range-display">Loading...</h2>
                    <button onclick="changeWeek(1)">Next &gt;</button>
                </div>
                
                <div></div>
            </div>
            
            <div id="calendar-container"></div>
        </div>
    </div>

    <script>
        window.STUDENT_CONFIG = {
            period: "P8",
            subject: "Chemistry", 
            title: "Chemistry P8 2025-2026"
        };
    </script>

    <script type="module" src="schedulerSTUDENT.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Login</title>
    
    <script src="/__/firebase/12.12.0/firebase-app-compat.js"></script>
    <script src="/__/firebase/12.12.0/firebase-auth-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
    <script src="guard.js"></script>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            display: none; /* Hidden until guard.js permits or redirects */
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-top: 8px solid #A33DE1;
        }

        button {
            background-color: #A33DE1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
        }

        button:hover {
            background-color: #8a2ebf;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Faculty Access</h1>
        <p>Please sign in with your approved Google account.</p>
        <button onclick="signIn()">Sign in with Google</button>
    </div>

    <script>
        // Force display block for login page so users can actually see the button
        document.body.style.display = "flex"; 
        
        function signIn() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider)
                .then(() => { window.location.href = 'index.html'; })
                .catch((error) => { alert(error.message); });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChemManager Pro | SciGarage</title>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
    
    /* Login Screen */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .btn-google { background-color: #4285F4; color: white; padding: 15px 30px; font-size: 1.2em; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    
    /* Main App Layout */
    #app-container { display: none; height: 100vh; display: flex; flex-direction: column; }
    
    /* Top Navbar */
    #navbar { background-color: #333; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    #navbar h2 { margin: 0; font-size: 1.5em; }
    #user-display { font-size: 0.9em; color: #ccc; }

    /* 3-Pane Layout */
    #workspace { display: flex; flex-grow: 1; overflow: hidden; }
    
    /* Sidebar (Search & List) */
    #sidebar { width: 300px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; flex-shrink: 0; }
    #search-box { padding: 15px; border-bottom: 1px solid #ddd; background: #fafafa; }
    #search-input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 1em; box-sizing: border-box; }
    #item-list { flex-grow: 1; overflow-y: auto; padding: 0; margin: 0; list-style: none; }
    .list-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
    .list-item:hover { background: #f0f8ff; }
    .list-item.active { background: #007aff; color: white; }
    .list-item .item-title { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; }
    .list-item .item-sub { font-size: 0.85em; opacity: 0.8; }

    /* Middle Pane (Image) */
    #image-pane { width: 40%; background: #eaeaea; display: flex; justify-content: center; align-items: center; padding: 20px; flex-shrink: 0; border-right: 1px solid #ddd; }
    #item-image { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: none; }
    #no-image-text { color: #888; font-size: 1.2em; font-weight: bold; display: none; }

    /* Right Pane (Form Data) */
    #details-pane { flex-grow: 1; padding: 25px; overflow-y: auto; background: white; }
    .form-group { margin-bottom: 15px; } 
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 0.9em; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; font-size: 1em; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .form-group input[readonly] { background-color: #e9ecef; font-weight: bold; color: #555; }
    .grid-2-col { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .mass-container { display: flex; gap: 10px; align-items: center; }
    .btn-history { padding: 10px 15px; background-color: #17a2b8; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn-history:hover { background-color: #138496; }
    
    .btn-save { padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn-save:hover { background-color: #218838; }

    #welcome-msg { text-align: center; color: #777; margin-top: 50px; font-size: 1.2em; }
    #editor-form { display: none; }

    /* Modal Styles */
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
    .modal-content { background-color: #fff; padding: 25px; border-radius: 10px; width: 400px; max-width: 90%; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px; }
    .modal-header h3 { margin: 0; }
    .close-btn { font-size: 1.5em; font-weight: bold; cursor: pointer; color: #888; }
    .close-btn:hover { color: #333; }
    
    .history-list { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    .history-item:nth-child(even) { background-color: #f9f9f9; }
    .del-btn { background: none; border: none; color: #dc3545; font-size: 1.2em; cursor: pointer; font-weight: bold; padding: 0 5px; }
    .del-btn:hover { color: #a71d2a; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <h2>🧪 SciGarage ChemManager Pro</h2>
    <p>Restricted Access. Please authenticate.</p>
    <button class="btn-google" id="btn-login">Sign in with Google</button>
    <div id="auth-error" style="color:red; margin-top:15px; font-weight:bold;"></div>
  </div>

  <!-- Main Application -->
  <div id="app-container" style="display:none;">
    
    <!-- Top Nav -->
    <div id="navbar">
      <h2>ChemManager Pro</h2>
      <div id="user-display"></div>
    </div>

    <!-- Workspace -->
    <div id="workspace">
      
      <!-- Left Pane: List & Search -->
      <div id="sidebar">
        <div id="search-box">
          <input type="text" id="search-input" placeholder="Search by name, CAS, or ID...">
        </div>
        <ul id="item-list"></ul>
      </div>

      <!-- Middle Pane: Image Viewer -->
      <div id="image-pane">
        <img id="item-image" src="" alt="Chemical Image">
        <div id="no-image-text">No Image Available</div>
      </div>

      <!-- Right Pane: Data Editor -->
      <div id="details-pane">
        <div id="welcome-msg">Select an item from the list to view and edit its details.</div>
        
        <div id="editor-form">
          <div class="grid-2-col">
            <div class="form-group">
              <label>OHS Inventory No.</label>
              <input type="text" id="f-invNum" readonly>
            </div>
            <div class="form-group">
              <label>CAS No.</label>
              <input type="text" id="f-casNo">
            </div>
          </div>

          <div class="form-group">
            <label>Chemical Name</label>
            <input type="text" id="f-chemName">
          </div>

          <div class="grid-2-col">
            <div class="form-group">
              <label>Manufacturer</label>
              <input type="text" id="f-mfg">
            </div>
            <div class="form-group">
              <label>Container Origin</label>
              <select id="f-origin">
                <option value="Manufacturer">Manufacturer Original</option>
                <option value="Teacher-Prepared">Teacher-Prepared / Mixed</option>
              </select>
            </div>
          </div>

          <div class="grid-2-col">
            <div class="form-group">
              <label>Receipt Date</label>
              <input type="date" id="f-receipt">
            </div>
            <div class="form-group">
              <label>Expiration Date</label>
              <input type="date" id="f-exp">
            </div>
          </div>

          <div class="grid-2-col">
            <div class="form-group">
              <label>Container Material</label>
              <input type="text" id="f-container">
            </div>
            <div class="form-group">
              <label>Form</label>
              <input type="text" id="f-form">
            </div>
          </div>

          <div class="grid-2-col">
            <div class="form-group">
              <label>Amount Remaining</label>
              <select id="f-amount">
                <option value="full">Full</option>
                <option value="3/4 full">3/4 Full</option>
                <option value="1/2 full">1/2 Full</option>
                <option value="1/4 full">1/4 Full</option>
              </select>
            </div>
            <div class="form-group">
              <label>Current Mass (g)</label>
              <div class="mass-container">
                <input type="number" step="0.1" id="f-mass" inputmode="decimal">
                <button class="btn-history" onclick="openMassHistory()">View History</button>
              </div>
            </div>
          </div>

          <div class="grid-2-col">
            <div class="form-group">
              <label>Container Size</label>
              <input type="text" id="f-size">
            </div>
            <div class="form-group">
              <label>Shelf #</label>
              <input type="text" id="f-shelf">
            </div>
          </div>

          <div class="grid-2-col">
            <div class="form-group">
              <label>Flinn Category</label>
              <input type="text" id="f-flinn">
            </div>
            <div class="form-group">
              <label>GHS Hazards</label>
              <input type="text" id="f-ghs">
            </div>
          </div>

          <div class="form-group">
            <label>Notes</label>
            <textarea id="f-notes" rows="3"></textarea>
          </div>

          <button class="btn-save" id="btn-save" onclick="saveItemChanges()">Save Changes</button>
          <div id="save-status" style="margin-top:10px; text-align:center; font-weight:bold; color:#28a745;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mass History Modal -->
  <div id="massModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Mass History</h3>
        <span class="close-btn" onclick="closeMassHistory()">&times;</span>
      </div>
      <ul class="history-list" id="history-list-container">
        <!-- JS Injected Items -->
      </ul>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref as dbRef, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCcpjuH1qv9IUDJJQR_5ms18TBRS8UFaV8",
      authDomain: "scigarage.firebaseapp.com",
      databaseURL: "https://scigarage-default-rtdb.firebaseio.com",
      projectId: "scigarage",
      storageBucket: "scigarage.firebasestorage.app",
      messagingSenderId: "768658065204",
      appId: "1:768658065204:web:31e0386ee9c9edfe3ac761"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const allowedEmails = ['pianodemon88@gmail.com', 'kjosephs@ocsdny.org'];

    // Global State
    let inventoryData = {};
    let currentSelectedItem = null; // Holds the ID (e.g. "00001")

    // --- Authentication ---
    document.getElementById('btn-login').addEventListener('click', () => {
      signInWithPopup(auth, new GoogleAuthProvider()).catch(err => {
        document.getElementById('auth-error').innerText = err.message;
      });
    });

    onAuthStateChanged(auth, (user) => {
      if (user && allowedEmails.includes(user.email)) {
        document.getElementById('login-screen').style.display = "none";
        document.getElementById('app-container').style.display = "flex";
        document.getElementById('user-display').innerText = `Logged in as: ${user.email}`;
        initApp(); 
      } else if (user) {
        document.getElementById('auth-error').innerText = `Access Denied.`;
        auth.signOut();
      } else {
        document.getElementById('login-screen').style.display = "flex";
        document.getElementById('app-container').style.display = "none";
      }
    });

    // --- Application Initialization ---
    function initApp() {
      const invRef = dbRef(db, 'chemInventory');
      
      // Listen for realtime database changes
      onValue(invRef, (snapshot) => {
        if (snapshot.exists()) {
          inventoryData = snapshot.val();
          renderSidebarList();
          
          // Refresh the editor if an item is currently being viewed
          if (currentSelectedItem && inventoryData[currentSelectedItem]) {
            populateEditor(currentSelectedItem);
          }
        } else {
          inventoryData = {};
          renderSidebarList();
        }
      });

      // Attach search listener
      document.getElementById('search-input').addEventListener('input', renderSidebarList);
    }

    // --- UI Rendering ---
    function renderSidebarList() {
      const searchStr = document.getElementById('search-input').value.toLowerCase();
      const listContainer = document.getElementById('item-list');
      listContainer.innerHTML = '';

      // Extract, filter, and sort entries
      const entries = Object.entries(inventoryData).filter(([id, data]) => {
        const name = (data.chemName || "").toLowerCase();
        const cas = (data.casNo || "").toLowerCase();
        return id.includes(searchStr) || name.includes(searchStr) || cas.includes(searchStr);
      }).sort((a, b) => a[0].localeCompare(b[0]));

      entries.forEach(([id, data]) => {
        const li = document.createElement('li');
        li.className = `list-item ${id === currentSelectedItem ? 'active' : ''}`;
        li.innerHTML = `
          <div class="item-title">${id} - ${data.chemName || 'Unknown Chemical'}</div>
          <div class="item-sub">CAS: ${data.casNo || 'N/A'} | Mass: ${data.mass || 'N/A'}g</div>
        `;
        li.onclick = () => selectItem(id);
        listContainer.appendChild(li);
      });
    }

    function selectItem(id) {
      currentSelectedItem = id;
      renderSidebarList(); // Re-render to show active state
      populateEditor(id);
    }

    function populateEditor(id) {
      const data = inventoryData[id];
      if (!data) return;

      document.getElementById('welcome-msg').style.display = "none";
      document.getElementById('editor-form').style.display = "block";
      document.getElementById('save-status').innerText = "";

      // Handle Image Left Pane
      const imgElement = document.getElementById('item-image');
      const noImgElement = document.getElementById('no-image-text');
      if (data.imageUrl && data.imageUrl.trim() !== "") {
        imgElement.src = data.imageUrl;
        imgElement.style.display = "block";
        noImgElement.style.display = "none";
      } else {
        imgElement.style.display = "none";
        imgElement.src = "";
        noImgElement.style.display = "block";
      }

      // Populate Form Fields
      document.getElementById('f-invNum').value = id;
      document.getElementById('f-chemName').value = data.chemName || "";
      document.getElementById('f-casNo').value = data.casNo || "";
      document.getElementById('f-mfg').value = data.manufacturer || "";
      document.getElementById('f-origin').value = data.containerOrigin || "Manufacturer";
      document.getElementById('f-receipt').value = data.receiptDate || "";
      document.getElementById('f-exp').value = data.expDate || "";
      document.getElementById('f-container').value = data.containerType || "";
      document.getElementById('f-form').value = data.form || "";
      document.getElementById('f-amount').value = data.amount || "full";
      document.getElementById('f-mass').value = data.mass || "";
      document.getElementById('f-size').value = data.containerSize || "";
      document.getElementById('f-shelf').value = data.shelf || "";
      document.getElementById('f-flinn').value = data.flinnCat || "";
      document.getElementById('f-ghs').value = data.ghs || "";
      document.getElementById('f-notes').value = data.notes || "";
    }

    // --- Save Data ---
    window.saveItemChanges = async function() {
      if (!currentSelectedItem) return;
      
      const btn = document.getElementById('btn-save');
      const statusDiv = document.getElementById('save-status');
      btn.disabled = true;
      btn.innerText = "Saving...";

      const data = inventoryData[currentSelectedItem];
      const newMass = parseFloat(document.getElementById('f-mass').value);
      
      // Handle Mass History logic exactly as in scanner
      let updatedMassHistory = data.massHistory ? [...data.massHistory] : [];
      let currentMassVal = newMass || "";

      if (!isNaN(newMass)) {
        let lastRecordedMass = updatedMassHistory.length > 0 ? updatedMassHistory[updatedMassHistory.length - 1].mass : null;
        if (lastRecordedMass !== newMass) {
          updatedMassHistory.push({
            mass: newMass,
            date: new Date().toISOString()
          });
        }
      }

      // Build payload matching your JSON structure (excluding imageUrl so it's not overwritten)
      const payload = {
        chemName: document.getElementById('f-chemName').value,
        casNo: document.getElementById('f-casNo').value,
        manufacturer: document.getElementById('f-mfg').value,
        containerOrigin: document.getElementById('f-origin').value,
        receiptDate: document.getElementById('f-receipt').value,
        expDate: document.getElementById('f-exp').value,
        containerType: document.getElementById('f-container').value,
        form: document.getElementById('f-form').value,
        amount: document.getElementById('f-amount').value,
        mass: currentMassVal,
        massHistory: updatedMassHistory,
        containerSize: document.getElementById('f-size').value,
        shelf: document.getElementById('f-shelf').value,
        flinnCat: document.getElementById('f-flinn').value,
        ghs: document.getElementById('f-ghs').value,
        notes: document.getElementById('f-notes').value
      };

      try {
        await update(dbRef(db, `chemInventory/${currentSelectedItem}`), payload);
        btn.innerText = "Save Changes";
        btn.disabled = false;
        statusDiv.innerText = "Modifications saved successfully!";
        setTimeout(() => statusDiv.innerText = "", 3000);
      } catch(error) {
        console.error(error);
        btn.innerText = "Save Changes";
        btn.disabled = false;
        statusDiv.style.color = "red";
        statusDiv.innerText = "Error saving changes. Check console.";
      }
    };

    // --- Mass History Modal Logic ---
    window.openMassHistory = function() {
      if (!currentSelectedItem) return;
      const data = inventoryData[currentSelectedItem];
      const historyArr = data.massHistory || [];
      const listContainer = document.getElementById('history-list-container');
      
      listContainer.innerHTML = "";

      if (historyArr.length === 0) {
        listContainer.innerHTML = "<p style='text-align:center; color:#888;'>No mass history recorded.</p>";
      } else {
        historyArr.forEach((entry, index) => {
          const d = new Date(entry.date);
          const formattedDate = `${d.toLocaleDateString()} at ${d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
          
          const li = document.createElement('li');
          li.className = "history-item";
          li.innerHTML = `
            <span><strong>${entry.mass} g</strong> <br><small style="color:#666;">${formattedDate}</small></span>
            <button class="del-btn" title="Delete Entry" onclick="deleteHistoryEntry(${index})">✖</button>
          `;
          listContainer.appendChild(li);
        });
      }
      
      document.getElementById('massModal').style.display = "flex";
    };

    window.closeMassHistory = function() {
      document.getElementById('massModal').style.display = "none";
    };

    window.deleteHistoryEntry = async function(index) {
      if (!confirm("Are you sure you want to delete this mass entry?")) return;
      
      let data = inventoryData[currentSelectedItem];
      let historyCopy = [...(data.massHistory || [])];
      
      historyCopy.splice(index, 1); // Remove item
      
      // Determine the new "current" top level mass
      let newCurrentMass = "";
      if (historyCopy.length > 0) {
        newCurrentMass = historyCopy[historyCopy.length - 1].mass;
      }

      try {
        await update(dbRef(db, `chemInventory/${currentSelectedItem}`), {
          massHistory: historyCopy,
          mass: newCurrentMass
        });
        
        // Re-render modal to reflect changes
        openMassHistory();
      } catch(error) {
        console.error("Error deleting history entry", error);
        alert("Failed to delete entry.");
      }
    };

    // Close modal if clicked outside of content
    window.onclick = function(event) {
      const modal = document.getElementById('massModal');
      if (event.target == modal) {
        closeMassHistory();
      }
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemical Explorer Dashboard</title>
  
  <style>
    body { font-family: -apple-system, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
    
    /* Login Screen */
    #login-screen { margin-top: 100px; text-align: center; }
    .btn-google { background-color: #4285F4; color: white; padding: 15px 30px; font-size: 1.2em; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    #auth-error { color: red; margin-top: 15px; font-weight: bold; }
    
    /* App Layout */
    #app-container { display: none; height: 100vh; display: flex; flex-direction: column; }
    header { background-color: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h2 { margin: 0; font-size: 1.5em; }
    .user-info { font-size: 0.9em; color: #adb5bd; }

    /* 3-Pane Grid Layout */
    .dashboard-grid { display: grid; grid-template-columns: 300px 1fr 400px; height: calc(100vh - 60px); }
    
    /* Pane 1: Sidebar List */
    .sidebar { background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; overflow: hidden; }
    .search-box { padding: 15px; border-bottom: 1px solid #ddd; background: #f8f9fa; }
    .search-box input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1em; }
    .item-list { flex-grow: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
    .item-list li { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
    .item-list li:hover { background: #e9ecef; }
    .item-list li.active { background: #007aff; color: white; }
    .item-list li.active .sub-text { color: #d1e7ff; }
    .item-title { font-weight: bold; font-size: 1.1em; margin-bottom: 4px; }
    .sub-text { font-size: 0.85em; color: #6c757d; }

    /* Pane 2: Large Image */
    .image-pane { display: flex; justify-content: center; align-items: center; background: #e9ecef; padding: 20px; }
    .image-pane img { max-width: 100%; max-height: 90%; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: none; }
    .no-image-text { color: #adb5bd; font-size: 1.2em; font-weight: bold; }

    /* Pane 3: Details & Form */
    .details-pane { background: white; padding: 20px; overflow-y: auto; border-left: 1px solid #ddd; }
    .details-pane h3 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; color: #333; }
    .form-group { margin-bottom: 12px; } 
    .form-group label { display: block; font-weight: bold; margin-bottom: 4px; color: #555; font-size: 0.85em; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; font-size: 0.95em; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .form-group input[readonly] { background-color: #e9ecef; font-weight: bold; color: #495057; }
    .grid-2-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn { padding: 12px; border: none; border-radius: 6px; font-size: 1em; font-weight: bold; cursor: pointer; flex: 1; text-align: center; }
    .btn-submit { background-color: #28a745; color: white; }
    .btn-submit:hover { background-color: #218838; }
    .btn-history { background-color: #17a2b8; color: white; }
    .btn-history:hover { background-color: #138496; }

    /* Modal for Mass History */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 25px; border-radius: 12px; width: 400px; max-height: 80vh; overflow-y: auto; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
    .modal-header h3 { margin: 0; }
    .close-btn { background: none; border: none; font-size: 1.5em; cursor: pointer; color: #aaa; }
    .close-btn:hover { color: #333; }
    .history-list { list-style: none; padding: 0; margin: 0; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f1f1f1; }
    .history-item:hover { background: #f8f9fa; }
    .history-mass { font-weight: bold; font-size: 1.1em; color: #007aff; }
    .history-date { font-size: 0.85em; color: #666; }
    .delete-history-btn { background: #dc3545; color: white; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; font-weight: bold; }
    .delete-history-btn:hover { background: #c82333; }

    /* Empty state */
    #empty-state { text-align: center; margin-top: 50px; color: #adb5bd; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <h2>🧪 Science Garage Explorer</h2>
    <p>Restricted Access. Please authenticate.</p>
    <button class="btn-google" id="btn-login">Sign in with Google</button>
    <div id="auth-error"></div>
  </div>

  <!-- Main Application -->
  <div id="app-container" style="display:none;">
    <header>
      <h2>Inventory Explorer</h2>
      <div class="user-info" id="user-display"></div>
    </header>

    <div class="dashboard-grid">
      
      <!-- Pane 1: Sidebar -->
      <div class="sidebar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search by Name, CAS, ID..." onkeyup="filterList()">
        </div>
        <ul class="item-list" id="itemList">
          <!-- Items populated by JS -->
        </ul>
      </div>

      <!-- Pane 2: Image Viewer -->
      <div class="image-pane">
        <div id="no-image-msg" class="no-image-text">Select an item to view</div>
        <img id="detail-image" src="" alt="Chemical Image">
      </div>

      <!-- Pane 3: Editable Form -->
      <div class="details-pane" id="details-pane">
        <div id="empty-state">
          <h3>No Item Selected</h3>
          <p>Please select an item from the list on the left to view and edit its details.</p>
        </div>

        <div id="form-content" style="display:none;">
          <h3 id="form-title">Item Details</h3>
          
          <div class="grid-2-col">
            <div class="form-group"><label>Inventory ID</label><input type="text" id="f-id" readonly></div>
            <div class="form-group"><label>CAS No.</label><input type="text" id="f-casNo"></div>
          </div>
          
          <div class="form-group"><label>Chemical Name</label><input type="text" id="f-chemName"></div>
          <div class="form-group"><label>Manufacturer</label><input type="text" id="f-mfg"></div>

          <div class="grid-2-col">
            <div class="form-group"><label>Amount Remaining</label>
              <select id="f-amount">
                <option value="full">Full</option><option value="3/4 full">3/4 Full</option><option value="1/2 full">1/2 Full</option><option value="1/4 full">1/4 Full</option>
              </select>
            </div>
            <div class="form-group">
                <label>Current Mass (g)</label>
                <input type="number" step="0.1" id="f-mass">
            </div>
          </div>

          <div class="grid-2-col">
            <div class="form-group"><label>Container Size</label><input type="text" id="f-size"></div>
            <div class="form-group"><label>Container Type</label><input type="text" id="f-container"></div>
          </div>
          
          <div class="grid-2-col">
            <div class="form-group"><label>Form</label><input type="text" id="f-form"></div>
            <div class="form-group">
                <label>Container Origin</label>
                <select id="f-origin">
                    <option value="Manufacturer">Manufacturer Original</option>
                    <option value="Teacher-Prepared">Teacher-Prepared / Mixed</option>
                </select>
            </div>
          </div>

          <div class="grid-2-col">
            <div class="form-group"><label>Receipt Date</label><input type="date" id="f-receipt"></div>
            <div class="form-group"><label>Expiration Date</label><input type="date" id="f-exp"></div>
          </div>

          <div class="grid-2-col">
            <div class="form-group"><label>Shelf</label><input type="text" id="f-shelf"></div>
            <div class="form-group"><label>Flinn Cat.</label><input type="text" id="f-flinn"></div>
          </div>

          <div class="form-group"><label>GHS Hazards</label><input type="text" id="f-ghs"></div>
          <div class="form-group"><label>Notes</label><textarea id="f-notes" rows="3"></textarea></div>

          <div class="btn-group">
            <button class="btn btn-history" onclick="openMassHistory()">View Mass History</button>
            <button class="btn btn-submit" id="btn-save" onclick="saveItem()">Save Changes</button>
          </div>
          <div id="save-status" style="margin-top: 10px; font-weight: bold; text-align: center; color: #28a745;"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- Mass History Modal -->
  <div class="modal-overlay" id="history-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Mass History Tracker</h3>
        <button class="close-btn" onclick="closeMassHistory()">&times;</button>
      </div>
      <ul class="history-list" id="history-list-container">
        <!-- History entries generated by JS -->
      </ul>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref as dbRef, get, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCcpjuH1qv9IUDJJQR_5ms18TBRS8UFaV8",
      authDomain: "scigarage.firebaseapp.com",
      databaseURL: "https://scigarage-default-rtdb.firebaseio.com",
      projectId: "scigarage",
      storageBucket: "scigarage.firebasestorage.app",
      messagingSenderId: "768658065204",
      appId: "1:768658065204:web:31e0386ee9c9edfe3ac761"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const allowedEmails = ['pianodemon88@gmail.com', 'kjosephs@ocsdny.org'];

    // State
    let inventoryData = {};
    let currentSelectedId = null;

    // --- Authentication ---
    document.getElementById('btn-login').addEventListener('click', () => {
      signInWithPopup(auth, new GoogleAuthProvider()).catch(err => {
        document.getElementById('auth-error').innerText = err.message;
      });
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (allowedEmails.includes(user.email)) {
          document.getElementById('login-screen').style.display = "none";
          document.getElementById('app-container').style.display = "flex";
          document.getElementById('user-display').innerText = `Logged in: ${user.email}`;
          fetchInventory(); 
        } else {
          document.getElementById('auth-error').innerText = `Access Denied.`;
          auth.signOut();
        }
      } else {
        document.getElementById('login-screen').style.display = "block";
        document.getElementById('app-container').style.display = "none";
      }
    });

    // --- Data Fetching & Rendering ---
    async function fetchInventory() {
      try {
        const snapshot = await get(dbRef(db, 'chemInventory'));
        if (snapshot.exists()) {
          inventoryData = snapshot.val();
          renderList();
        }
      } catch (e) {
        console.error("Error fetching data: ", e);
        alert("Failed to load inventory from database.");
      }
    }

    window.filterList = function() {
      renderList(document.getElementById('searchInput').value.toLowerCase());
    }

    function renderList(filter = "") {
      const listContainer = document.getElementById('itemList');
      listContainer.innerHTML = "";

      // Convert object to array for sorting and filtering
      let itemsArray = Object.keys(inventoryData).map(key => ({
        id: key,
        ...inventoryData[key]
      }));

      // Sort alphabetically by chemical name
      itemsArray.sort((a, b) => (a.chemName || "").localeCompare(b.chemName || ""));

      itemsArray.forEach(item => {
        const searchString = `${item.id} ${item.chemName} ${item.casNo} ${item.manufacturer}`.toLowerCase();
        
        if (filter === "" || searchString.includes(filter)) {
          const li = document.createElement('li');
          if (item.id === currentSelectedId) li.classList.add('active');
          
          li.innerHTML = `
            <div class="item-title">${item.chemName || "Unknown Chemical"}</div>
            <div class="sub-text">ID: ${item.id} | CAS: ${item.casNo || "N/A"}</div>
          `;
          li.onclick = () => selectItem(item.id);
          listContainer.appendChild(li);
        }
      });
    }

    window.selectItem = function(id) {
      currentSelectedId = id;
      const data = inventoryData[id];
      renderList(document.getElementById('searchInput').value.toLowerCase()); // Refresh list to show active state

      // Handle UI Panes
      document.getElementById('empty-state').style.display = "none";
      document.getElementById('form-content').style.display = "block";
      document.getElementById('save-status').innerText = "";
      
      const imgPreview = document.getElementById('detail-image');
      const noImageMsg = document.getElementById('no-image-msg');
      if (data.imageUrl) {
        imgPreview.src = data.imageUrl;
        imgPreview.style.display = "block";
        noImageMsg.style.display = "none";
      } else {
        imgPreview.src = "";
        imgPreview.style.display = "none";
        noImageMsg.style.display = "block";
      }

      // Handle Current Mass logic (Get most recent from history if available)
      let latestMass = data.mass || "";
      if (data.massHistory && data.massHistory.length > 0) {
          let sortedHistory = [...data.massHistory].sort((a, b) => new Date(b.date) - new Date(a.date));
          latestMass = sortedHistory[0].mass;
      }

      // Populate Form Fields
      document.getElementById('f-id').value = id;
      document.getElementById('f-casNo').value = data.casNo || "";
      document.getElementById('f-chemName').value = data.chemName || "";
      document.getElementById('f-mfg').value = data.manufacturer || "";
      document.getElementById('f-amount').value = data.amount || "full";
      document.getElementById('f-mass').value = latestMass; 
      document.getElementById('f-size').value = data.containerSize || "";
      document.getElementById('f-container').value = data.containerType || "";
      document.getElementById('f-form').value = data.form || "";
      document.getElementById('f-origin').value = data.containerOrigin || "Manufacturer";
      document.getElementById('f-receipt').value = data.receiptDate || "";
      document.getElementById('f-exp').value = data.expDate || "";
      document.getElementById('f-shelf').value = data.shelf || "";
      document.getElementById('f-flinn').value = data.flinnCat || "";
      document.getElementById('f-ghs').value = data.ghs || "";
      document.getElementById('f-notes').value = data.notes || "";
    }

    // --- Save Data Logic ---
    window.saveItem = async function() {
      if (!currentSelectedId) return;

      const btn = document.getElementById('btn-save');
      const statusText = document.getElementById('save-status');
      btn.innerText = "Saving...";
      btn.disabled = true;

      let item = inventoryData[currentSelectedId];
      let newMass = parseFloat(document.getElementById('f-mass').value);
      
      // Determine what the current recorded latest mass is
      let latestRecordedMass = null;
      if (item.massHistory && item.massHistory.length > 0) {
          let sortedHistory = [...item.massHistory].sort((a, b) => new Date(b.date) - new Date(a.date));
          latestRecordedMass = sortedHistory[0].mass;
      } else if (item.mass) {
          latestRecordedMass = item.mass;
      }

      let updatedMassHistory = item.massHistory ? [...item.massHistory] : [];

      // If the user typed a new mass that is a valid number and different from the latest
      if (!isNaN(newMass) && newMass !== latestRecordedMass) {
          updatedMassHistory.push({
              date: new Date().toISOString(),
              mass: newMass
          });
      }

      const updatedData = {
          chemName: document.getElementById('f-chemName').value,
          casNo: document.getElementById('f-casNo').value,
          manufacturer: document.getElementById('f-mfg').value,
          amount: document.getElementById('f-amount').value,
          mass: isNaN(newMass) ? "" : newMass, // Top level mass sync
          massHistory: updatedMassHistory,
          containerSize: document.getElementById('f-size').value,
          containerType: document.getElementById('f-container').value,
          form: document.getElementById('f-form').value,
          containerOrigin: document.getElementById('f-origin').value,
          receiptDate: document.getElementById('f-receipt').value,
          expDate: document.getElementById('f-exp').value,
          shelf: document.getElementById('f-shelf').value,
          flinnCat: document.getElementById('f-flinn').value,
          ghs: document.getElementById('f-ghs').value,
          notes: document.getElementById('f-notes').value,
          lastVerified: new Date().toISOString()
      };

      try {
        await update(dbRef(db, `chemInventory/${currentSelectedId}`), updatedData);
        
        // Update local state cache
        inventoryData[currentSelectedId] = { ...inventoryData[currentSelectedId], ...updatedData };
        
        statusText.innerText = "✅ Changes saved successfully!";
        setTimeout(() => { statusText.innerText = ""; }, 3000);
      } catch(e) {
        console.error("Save failed:", e);
        statusText.style.color = "red";
        statusText.innerText = "❌ Failed to save changes.";
      }

      btn.innerText = "Save Changes";
      btn.disabled = false;
    }

    // --- Mass History Modal Logic ---
    window.openMassHistory = function() {
      if (!currentSelectedId) return;
      document.getElementById('history-modal').style.display = "flex";
      renderMassHistory();
    }

    window.closeMassHistory = function() {
      document.getElementById('history-modal').style.display = "none";
    }

    function renderMassHistory() {
      const listContainer = document.getElementById('history-list-container');
      listContainer.innerHTML = "";
      
      let historyArray = inventoryData[currentSelectedId].massHistory || [];
      
      if (historyArray.length === 0) {
        listContainer.innerHTML = "<li style='text-align:center; padding: 20px; color: #666;'>No mass history recorded yet.</li>";
        return;
      }

      // We need to keep track of the original index in Firebase array for deletion, 
      // so we map it into a new object array before sorting
      let sortedHistory = historyArray.map((entry, index) => ({...entry, originalIndex: index}))
                                      .sort((a, b) => new Date(b.date) - new Date(a.date));

      sortedHistory.forEach(entry => {
        const dateObj = new Date(entry.date);
        const dateString = dateObj.toLocaleDateString() + " " + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        const li = document.createElement('li');
        li.className = "history-item";
        li.innerHTML = `
          <div>
            <div class="history-mass">${entry.mass} g</div>
            <div class="history-date">${dateString}</div>
          </div>
          <button class="delete-history-btn" onclick="deleteHistoryEntry(${entry.originalIndex})">❌</button>
        `;
        listContainer.appendChild(li);
      });
    }

    window.deleteHistoryEntry = async function(originalIndex) {
      if (!confirm("Are you sure you want to delete this mass record?")) return;

      let item = inventoryData[currentSelectedId];
      let historyArray = item.massHistory ? [...item.massHistory] : [];
      
      historyArray.splice(originalIndex, 1); // Remove item

      // Determine the new top-level mass
      let newTopMass = "";
      if (historyArray.length > 0) {
          let sorted = [...historyArray].sort((a, b) => new Date(b.date) - new Date(a.date));
          newTopMass = sorted[0].mass;
      }

      try {
        await update(dbRef(db, `chemInventory/${currentSelectedId}`), {
          massHistory: historyArray,
          mass: newTopMass
        });

        // Update local cache
        item.massHistory = historyArray;
        item.mass = newTopMass;

        // Re-render UI
        renderMassHistory();
        document.getElementById('f-mass').value = newTopMass;
        
      } catch (e) {
        console.error("Failed to delete history entry:", e);
        alert("Failed to delete entry from database.");
      }
    }
  </script>
</body>
</html>

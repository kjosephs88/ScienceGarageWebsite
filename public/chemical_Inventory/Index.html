<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemical Scanner</title>
  
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  
  <style>
    body {
      font-family: -apple-system, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    
    /* Desktop Scanner Box */
    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      background: white;
      display: none; /* Hidden on mobile */
    }
    
    /* Native iOS Video Element */
    #ios-video {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      background: #000;
      display: none; /* Hidden until button is clicked */
    }

    #ios-start-btn {
      display: none; 
      padding: 15px 30px;
      font-size: 1.2em;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      margin: 40px auto;
    }
    
    #confirm-modal {
      display: none; 
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 80%;
      max-width: 300px;
    }
    .btn {
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .btn-confirm { background-color: #28a745; color: white; }
    .btn-cancel { background-color: #dc3545; color: white; }
    #status-msg { margin-top: 15px; font-weight: bold; }
    #error-log { margin-top: 10px; color: #dc3545; font-size: 0.9em; font-family: monospace; }
  </style>
</head>
<body>

  <h2>Live Scanner</h2>
  
  <button id="ios-start-btn">📷 Tap to Start Camera</button>
  <video id="ios-video" playsinline></video>
  <canvas id="ios-canvas" style="display:none;"></canvas>

  <div id="reader"></div>
  
  <div id="status-msg">Loading scanner...</div>
  <div id="error-log"></div>

  <div id="confirm-modal">
    <div class="modal-content">
      <h3>Code Detected</h3>
      <h1 id="scanned-id-display">---</h1>
      <p>Log this item?</p>
      <button class="btn btn-confirm" onclick="sendToGoogleSheets()">Confirm & Log</button>
      <button class="btn btn-cancel" onclick="resumeScanner()">Cancel</button>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwdMydJuQh4-8G7CCuqZ_8U2mfa3vyELK0opPpS6Wctlk7p1HFjxYFXRxOXz3IbFIzw/exec"; 
    
    // Globals
    let scanner; // For desktop
    let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    let currentScannedId = "";
    let isPaused = false;

    // Mobile specific globals
    const video = document.getElementById("ios-video");
    const canvasElement = document.getElementById("ios-canvas");
    const canvasContext = canvasElement.getContext("2d", { willReadFrequently: true });

    function onScanSuccess(decodedText) {
      isPaused = true;
      
      // If desktop, pause the library engine
      if (!isMobile && scanner) {
        scanner.pause();
      }
      
      currentScannedId = decodedText;
      document.getElementById('scanned-id-display').innerText = currentScannedId;
      document.getElementById('confirm-modal').style.display = "flex";
    }

    function resumeScanner() {
      document.getElementById('confirm-modal').style.display = "none";
      currentScannedId = "";
      isPaused = false;
      document.getElementById('status-msg').innerText = "Camera active. Ready to scan.";

      if (isMobile) {
        // Kickstart the iOS video loop again
        requestAnimationFrame(scanVideoFrame);
      } else {
        // Resume desktop library
        if(scanner) scanner.resume();
      }
    }

    function sendToGoogleSheets() {
      const btn = document.querySelector('.btn-confirm');
      btn.innerText = "Sending...";
      btn.disabled = true;

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ id: currentScannedId })
      })
      .then(response => response.json())
      .then(data => {
        btn.innerText = "Confirm & Log";
        btn.disabled = false;
        document.getElementById('status-msg').innerText = "Successfully logged: " + currentScannedId;
        resumeScanner();
      })
      .catch(error => {
        alert("Error sending data. Check connection.");
        btn.innerText = "Confirm & Log";
        btn.disabled = false;
      });
    }

    // --- MOBILE NATIVE SCANNING ENGINE ---
    function scanVideoFrame() {
      // Stop looping if the modal is open
      if (isPaused) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvasElement.height = video.videoHeight;
        canvasElement.width = video.videoWidth;
        
        // Draw the current video frame to the hidden canvas
        canvasContext.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
        
        // Extract the pixels and send to jsQR
        let imageData = canvasContext.getImageData(0, 0, canvasElement.width, canvasElement.height);
        let code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        // If it finds a chemical ID!
        if (code && code.data) {
          onScanSuccess(code.data);
          return; // Exit the loop
        }
      }
      // Keep checking the next frame
      requestAnimationFrame(scanVideoFrame);
    }

    window.onload = function() {
      const iosBtn = document.getElementById('ios-start-btn');
      const errorLog = document.getElementById('error-log');

      if (isMobile) {
        // --- MOBILE WORKFLOW ---
        iosBtn.style.display = "block";
        document.getElementById('status-msg').innerText = "Ready to initialize.";

        iosBtn.onclick = function() {
          iosBtn.style.display = "none"; 
          document.getElementById('status-msg').innerText = "Starting pure video feed...";

          // Pure HTML5 video request. No library middlemen.
          navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(function(stream) {
              video.srcObject = stream;
              video.setAttribute("playsinline", true); // CRITICAL for iOS
              video.play();
              
              video.style.display = "block";
              document.getElementById('status-msg').innerText = "Camera active. Ready to scan.";
              
              // Start checking the video feed for QR codes
              requestAnimationFrame(scanVideoFrame);
            })
            .catch(function(err) {
              document.getElementById('status-msg').innerText = "Native Camera Error.";
              errorLog.innerText = err;
              iosBtn.style.display = "block";
            });
        };

      } else {
        // --- DESKTOP WORKFLOW ---
        document.getElementById('reader').style.display = "block";
        document.getElementById('status-msg').innerText = "Camera active. Ready to scan.";
        
        // Let the library handle everything (including Continuity Camera)
        scanner = new Html5QrcodeScanner(
          "reader",
          { fps: 10, qrbox: {width: 250, height: 250} },
          false
        );
        scanner.render(onScanSuccess);
      }
    };
  </script>

</body>
</html>

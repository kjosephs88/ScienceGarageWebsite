<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemical Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      background: white;
      /* FIX 1: Prevent iOS from collapsing the box to 0px before the camera loads */
      min-height: 300px; 
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    /* FIX 2: Force the library's internal permission buttons to be large and visible on mobile */
    #reader button {
      padding: 12px 24px !important;
      font-size: 1.1em !important;
      background-color: #0056b3 !important;
      color: white !important;
      border: none !important;
      border-radius: 8px !important;
      cursor: pointer !important;
      margin: 10px auto !important;
    }
    /* The Confirmation Overlay */
    #confirm-modal {
      display: none; 
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 80%;
      max-width: 300px;
    }
    .btn {
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .btn-confirm { background-color: #28a745; color: white; }
    .btn-cancel { background-color: #dc3545; color: white; }
    #status-msg { margin-top: 15px; font-weight: bold; }
    .error-text { color: #dc3545; }
  </style>
</head>
<body>

  <h2>Live Scanner</h2>
  <div id="reader"></div>
  <div id="status-msg">Camera active. Ready to scan.</div>

  <div id="confirm-modal">
    <div class="modal-content">
      <h3>Code Detected</h3>
      <h1 id="scanned-id-display">---</h1>
      <p>Log this item?</p>
      <button class="btn btn-confirm" onclick="sendToGoogleSheets()">Confirm & Log</button>
      <button class="btn btn-cancel" onclick="resumeScanner()">Cancel</button>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwdMydJuQh4-8G7CCuqZ_8U2mfa3vyELK0opPpS6Wctlk7p1HFjxYFXRxOXz3IbFIzw/exec"; 
    
    let scanner;
    let currentScannedId = "";

    function onScanSuccess(decodedText, decodedResult) {
      scanner.pause();
      
      currentScannedId = decodedText;
      document.getElementById('scanned-id-display').innerText = currentScannedId;
      document.getElementById('confirm-modal').style.display = "flex";
    }

    function resumeScanner() {
      document.getElementById('confirm-modal').style.display = "none";
      currentScannedId = "";
      scanner.resume();
      document.getElementById('status-msg').innerText = "Camera active. Ready to scan.";
      document.getElementById('status-msg').className = "";
    }

    function sendToGoogleSheets() {
      const btn = document.querySelector('.btn-confirm');
      btn.innerText = "Sending...";
      btn.disabled = true;

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ id: currentScannedId })
      })
      .then(response => response.json())
      .then(data => {
        btn.innerText = "Confirm & Log";
        btn.disabled = false;
        document.getElementById('status-msg').innerText = "Successfully logged: " + currentScannedId;
        resumeScanner();
      })
      .catch(error => {
        alert("Error sending data. Check connection.");
        btn.innerText = "Confirm & Log";
        btn.disabled = false;
      });
    }

    window.onload = function() {
      scanner = new Html5QrcodeScanner(
        "reader",
        { 
          fps: 10, 
          qrbox: {width: 250, height: 250},
          // FIX 3: Tells the UI to prioritize rendering the camera button
          supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
        },
        false
      );
      
      // FIX 4: Adding the error callback. If iOS blocks the camera, it will now print why.
      scanner.render(onScanSuccess, function(errorMessage) {
        // Only log hard permission errors, ignore the constant "no qr code found" frame errors
        if (errorMessage.includes("NotAllowedError") || errorMessage.includes("Permission")) {
          document.getElementById('status-msg').innerText = "Camera blocked. Please tap 'Allow' or check Safari settings.";
          document.getElementById('status-msg').className = "error-text";
        }
      });
    };
  </script>

</body>
</html>

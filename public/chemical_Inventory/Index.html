<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemical Scanner</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      background: white;
      min-height: 300px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #ios-start-btn {
      display: none; 
      padding: 15px 30px;
      font-size: 1.2em;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    #confirm-modal {
      display: none; 
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 80%;
      max-width: 300px;
    }
    .btn {
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .btn-confirm { background-color: #28a745; color: white; }
    .btn-cancel { background-color: #dc3545; color: white; }
    #status-msg { margin-top: 15px; font-weight: bold; }
    #error-log { margin-top: 10px; color: #dc3545; font-size: 0.9em; font-family: monospace; }
  </style>
</head>
<body>

  <h2>Live Scanner</h2>
  
  <div id="reader">
    <button id="ios-start-btn">📷 Initialize Camera</button>
  </div>
  
  <div id="status-msg">Loading scanner...</div>
  <div id="error-log"></div>

  <div id="confirm-modal">
    <div class="modal-content">
      <h3>Code Detected</h3>
      <h1 id="scanned-id-display">---</h1>
      <p>Log this item?</p>
      <button class="btn btn-confirm" onclick="sendToGoogleSheets()">Confirm & Log</button>
      <button class="btn btn-cancel" onclick="resumeScanner()">Cancel</button>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwdMydJuQh4-8G7CCuqZ_8U2mfa3vyELK0opPpS6Wctlk7p1HFjxYFXRxOXz3IbFIzw/exec"; 
    
    let scanner;
    let currentScannedId = "";

    function onScanSuccess(decodedText, decodedResult) {
      scanner.pause();
      currentScannedId = decodedText;
      document.getElementById('scanned-id-display').innerText = currentScannedId;
      document.getElementById('confirm-modal').style.display = "flex";
    }

    function resumeScanner() {
      document.getElementById('confirm-modal').style.display = "none";
      currentScannedId = "";
      scanner.resume();
      document.getElementById('status-msg').innerText = "Camera active. Ready to scan.";
    }

    function sendToGoogleSheets() {
      const btn = document.querySelector('.btn-confirm');
      btn.innerText = "Sending...";
      btn.disabled = true;

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ id: currentScannedId })
      })
      .then(response => response.json())
      .then(data => {
        btn.innerText = "Confirm & Log";
        btn.disabled = false;
        document.getElementById('status-msg').innerText = "Successfully logged: " + currentScannedId;
        resumeScanner();
      })
      .catch(error => {
        alert("Error sending data. Check connection.");
        btn.innerText = "Confirm & Log";
        btn.disabled = false;
      });
    }

    window.onload = function() {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      const iosBtn = document.getElementById('ios-start-btn');
      const errorLog = document.getElementById('error-log');

      if (isMobile) {
        // --- MOBILE WORKFLOW ---
        iosBtn.style.display = "block";
        document.getElementById('status-msg').innerText = "Tap to find camera lenses...";

        iosBtn.onclick = function() {
          iosBtn.style.display = "none"; 
          document.getElementById('status-msg').innerText = "Querying Apple Hardware...";

          // STEP 1: Ask the phone for a list of specific hardware lenses
          Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) {
              
              // STEP 2: Find the main back camera, ignoring the front selfie camera
              let backCamera = devices.find(device => device.label.toLowerCase().includes('back'));
              // If it can't find the word 'back', default to the last camera on the list (usually the rear one)
              let cameraIdToUse = backCamera ? backCamera.id : devices[devices.length - 1].id;
              
              document.getElementById('status-msg').innerText = "Starting back camera...";

              // STEP 3: Start the specific lens ID
              const html5QrCode = new Html5Qrcode("reader");
              html5QrCode.start(
                cameraIdToUse, 
                { fps: 10, qrbox: {width: 250, height: 250} },
                onScanSuccess,
                (err) => {} // Ignore scan frame errors
              ).then(() => {
                scanner = html5QrCode; 
                document.getElementById('status-msg').innerText = "Camera active. Ready to scan.";
                errorLog.innerText = ""; 
              }).catch(err => {
                document.getElementById('status-msg').innerText = "Engine start failed.";
                errorLog.innerText = "START ERROR: " + err;
                iosBtn.style.display = "block";
              });

            } else {
              document.getElementById('status-msg').innerText = "No cameras detected.";
              errorLog.innerText = "DEVICES ERROR: Hardware array returned empty.";
            }
          }).catch(err => {
            document.getElementById('status-msg').innerText = "Hardware lookup failed.";
            errorLog.innerText = "GET_CAMERAS ERROR: " + err;
            iosBtn.style.display = "block";
          });
        };

      } else {
        // --- DESKTOP WORKFLOW ---
        document.getElementById('status-msg').innerText = "Camera active. Ready to scan.";
        scanner = new Html5QrcodeScanner(
          "reader",
          { fps: 10, qrbox: {width: 250, height: 250} },
          false
        );
        scanner.render(onScanSuccess);
      }
    };
  </script>

</body>
</html>

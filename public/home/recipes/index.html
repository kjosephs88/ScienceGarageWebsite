<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Recipe Box</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #f4f6f9; color: #333; padding: 15px; }
        .dashboard-container { max-width: 500px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0; background-color: #2c3e50; color: white; border-radius: 12px; margin-bottom: 20px; }
        header p { color: #bdc3c7; font-size: 0.95rem; margin-top: 5px; }
        .planner-status { background-color: #27ae60; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: none; justify-content: space-between; align-items: center; font-weight: bold; }
        .btn-generate { background-color: white; color: #27ae60; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .recipe-list { display: flex; flex-direction: column; gap: 15px; }
        .recipe-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; border: 2px solid transparent; }
        .recipe-card.selected { border-color: #27ae60; background-color: #f0fff4; }
        .card-meta { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; color: #7f8c8d; }
        .recipe-title { font-size: 1.4rem; color: #2c3e50; font-weight: 700; margin-bottom: 15px; }
        .card-actions { display: flex; gap: 10px; }
        .btn-card { flex: 2; padding: 14px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; border: none; text-align: center; text-decoration: none; cursor: pointer; }
        .btn-cook { background-color: #3498db; color: white; }
        .btn-select { flex: 1; background-color: #f1f2f6; color: #7f8c8d; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; }
        .recipe-card.selected .btn-select { background-color: #27ae60; color: white; }
        .loading { text-align: center; font-size: 1.2rem; color: #7f8c8d; padding: 4px; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>Family Recipe Box</h1>
            <p>Procurement & Kitchen Guide</p>
        </header>

        <div class="planner-status" id="plannerBar">
            <span id="plannerCount">0 Recipes Selected</span>
            <button class="btn-generate" onclick="generateList()">Build List</button>
        </div>

        <div class="recipe-list" id="recipeContainer">
            <div class="loading">Connecting to Firebase Data Engine...</div>
        </div>
    </div>

    <script>
        const DB_URL = "https://scigarage-default-rtdb.firebaseio.com/recipes.json";
        let selectedRecipes = [];

        async function loadRecipes() {
            try {
                const response = await fetch(DB_URL);
                const recipes = await response.json();
                const container = document.getElementById('recipeContainer');
                container.innerHTML = '';

                for (let key in recipes) {
                    const recipe = recipes[key];
                    const card = document.createElement('div');
                    card.className = 'recipe-card';
                    card.id = `card-${key}`;
                    card.innerHTML = `
                        <div class="card-meta"><span>${recipe.metadata}</span></div>
                        <div class="recipe-title">${recipe.title}</div>
                        <div class="card-actions">
                            <a href="recipes.html?recipe=${key}" class="btn-card btn-cook">Start Cooking</a>
                            <button class="btn-card btn-select" onclick="toggleSelect('${key}')">＋</button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            } catch (error) {
                document.getElementById('recipeContainer').innerHTML = `<div class='loading' style='color:#d63031;'>Error connecting to Firebase storage. Check your database rules configuration.</div>`;
            }
        }

        function toggleSelect(key) {
            const card = document.getElementById(`card-${key}`);
            const btn = card.querySelector('.btn-select');
            
            if (selectedRecipes.includes(key)) {
                selectedRecipes = selectedRecipes.filter(item => item !== key);
                card.classList.remove('selected');
                btn.innerText = '＋';
            } else {
                selectedRecipes.push(key);
                card.classList.add('selected');
                btn.innerText = '✓';
            }
            updatePlannerBar();
        }

        function updatePlannerBar() {
            const bar = document.getElementById('plannerBar');
            const txt = document.getElementById('plannerCount');
            if (selectedRecipes.length > 0) {
                bar.style.display = 'flex';
                txt.innerText = `${selectedRecipes.length} Selected`;
            } else {
                bar.style.display = 'none';
            }
        }

        function generateList() {
            alert(`Future feature activation target:\nParsing ingredient lists for: [${selectedRecipes.join(', ')}]\nCombining shared items into a single run list.`);
        }

        window.onload = loadRecipes;
    </script>
</body>
</html>

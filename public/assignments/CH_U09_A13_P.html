<!DOCTYPE html>
<html>
<head>
    <title>Interactive Lesson Player</title>
    <style>
        .video-box { position: relative; width: 640px; margin: auto; }
        .overlay { 
            position: absolute; top: 25%; left: 10%; right: 10%; 
            background: rgba(0,0,0,0.9); color: white; padding: 20px; 
            display: none; text-align: center; font-family: Arial, sans-serif;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="video-box">
    <div id="yt-player"></div>

    <div id="stop-overlay" class="overlay">
        <h3>Checkpoint Reached</h3>
        <p id="overlay-text">Please answer questions #7 through #10.</p>
        <button onclick="resumeVideo()">I'm Ready to Continue</button>
    </div>
</div>

<script>
var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

var player;
const stopPoints = [10, 120, 300]; 
let lastStopTriggered = -1;
let checkInterval;

// Variable to monitor the furthest point the student has reached
let maxTimeWatched = 0; 

function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', {
        height: '390',
        width: '640',
        videoId: 'qp8niUZQ5Ik', 
        playerVars: {
            'rel': 0,             // Restrict post-video suggestions to your channel
            'iv_load_policy': 3   // Turn off video annotations
        },
        events: {
            'onStateChange': onPlayerStateChange
        }
    });
}

function onPlayerStateChange(event) {
    if (event.data == YT.PlayerState.PLAYING) {
        // Scan playback every 500 milliseconds
        checkInterval = setInterval(() => {
            let currentTime = player.getCurrentTime();
            
            // --- 1. ANTI-SKIP GUARD SYSTEM ---
            // If the student jumps more than 2 seconds ahead of their max watched point:
            if (currentTime > maxTimeWatched + 2) {
                player.seekTo(maxTimeWatched, true); // Snap them back instantly
                return; 
            } else {
                // If they are watching normally, advance the checkpoint milestone.
                // If they rewound, currentTime is smaller than maxTimeWatched, so max progress stands still.
                if (currentTime > maxTimeWatched) {
                    maxTimeWatched = currentTime;
                }
            }

            // --- 2. LESSON CHECKPOINTS ---
            let currentSecond = Math.floor(currentTime);
            let matchIndex = stopPoints.indexOf(currentSecond);
            
            if (matchIndex !== -1 && matchIndex !== lastStopTriggered) {
                player.pauseVideo();
                lastStopTriggered = matchIndex;
                clearInterval(checkInterval);
                
                document.getElementById('overlay-text').textContent = 
                    `Please pause and answer questions for section ${matchIndex + 1}.`;
                document.getElementById('stop-overlay').style.display = 'block';
            }
        }, 500);
    } else {
        // Clear background intervals when paused or stopped
        clearInterval(checkInterval);
    }
}

function resumeVideo() {
    document.getElementById('stop-overlay').style.display = 'none';
    player.playVideo();
}
</script>

</body>
</html>

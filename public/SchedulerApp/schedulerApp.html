<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Scheduler Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="schedulerApp.css">
</head>

<body>
    <div class="sidebar" id="teacher-sidebar" style="display: none;">
        <div class="control-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <label style="margin-bottom: 0;">Select Class</label>
                <button id="settings-btn" class="gear-btn" title="Calendar Settings">⚙️</button>
            </div>
            <select id="class-select">
                <option value="">Loading classes...</option>
            </select>
        </div>

        <div class="control-group">
            <label>Select Topic</label>
            <select id="topic-select">
                <option value="all">All Topics</option>
            </select>
        </div>

        <hr>

        <div class="control-group" style="flex-grow: 1; display: flex; flex-direction: column; min-height: 0;">
            <label>Unscheduled Assignments</label>
            <div id="holding-tank" class="sortable-list tank-list"></div>
        </div>

        <div id="auth-status" style="font-size: 0.8rem; color: #666; margin-top: 10px;"></div>
        <button id="auth-btn" class="login-btn">Teacher Login</button>
    </div>

    <div class="main-content" id="main-view">
        <div id="scale-wrapper">
            <div id="scaled-content">
                <div class="toolbar">
                    <div class="view-controls">
                        <select id="week-view-select">
                            <option value="1" selected>1 Week</option>
                            <option value="2">2 Weeks</option>
                            <option value="3">3 Weeks</option>
                        </select>
                    </div>
                    <div class="week-nav">
                        <button id="prev-week">&lt; Prev</button>
                        <h2 id="date-range-display">Select a Class</h2>
                        <button id="next-week">Next &gt;</button>
                    </div>
                    <h1 id="calendar-title" style="margin:0; font-size: 1.2rem; text-align: right; color: #666;">Calendar</h1>
                </div>
                <div id="calendar-container"></div>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Calendar Settings - <span id="settings-period-name"></span></h3>
                <button class="close-btn" onclick="window.closeSettings()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="control-group">
                    <label>Target Date</label>
                    <input type="date" id="config-date">
                </div>
                <div class="control-group">
                    <label>Day Label (e.g. Holiday Name)</label>
                    <input type="text" id="config-name" placeholder="Leave empty for normal day">
                </div>
                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" id="config-is-day-off">
                        <label style="margin: 0;">Day Off (No Classes)</label>
                    </div>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" id="config-is-double" checked>
                        <label style="margin: 0;">Double Period</label>
                    </div>
                </div>
                <button class="save-btn" onclick="window.saveDayConfig()">Save Day Configuration</button>
                <hr>
                <label>Existing Configurations</label>
                <ul id="config-list" class="config-list"></ul>
            </div>
        </div>
    </div>

    <script type="module" src="schedulerApp.js"></script>
</body>

</html>

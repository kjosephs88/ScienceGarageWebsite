    <script>
        const zoomableSvg = document.querySelector('.zoomable-svg');
        let currentZoom = 1;
        let panning = false;
        let startX, startY;
        let translateX = 0;
        let translateY = 0;

        zoomableSvg.addEventListener('wheel', (event) => {
            if (event.ctrlKey) { // Check if Ctrl key is pressed
                event.preventDefault(); // Prevent page scrolling
                const zoomFactor = 1.1; // How much to zoom in/out

                // Get mouse position relative to SVG
                const svgRect = zoomableSvg.getBoundingClientRect();
                const mouseX = event.clientX - svgRect.left;
                const mouseY = event.clientY - svgRect.top;

                // Calculate the new zoom level
                const oldZoom = currentZoom;
                if (event.deltaY < 0) {
                    currentZoom *= zoomFactor; // Zoom in
                } else {
                    currentZoom /= zoomFactor; // Zoom out
                }

                // Limit zoom to prevent it from becoming too small or too large
                currentZoom = Math.max(0.1, Math.min(10, currentZoom)); // Example limits

                // Calculate translation to zoom around the mouse pointer
                translateX = mouseX - (mouseX * (currentZoom / oldZoom));
                translateY = mouseY - (mouseY * (currentZoom / oldZoom));

                updateTransform();
            }
        });

        // Optional: Add panning functionality (drag to move)
        zoomableSvg.addEventListener('mousedown', (event) => {
            if (event.button === 0 && currentZoom > 1) { // Left click and zoomed in
                panning = true;
                startX = event.clientX - translateX;
                startY = event.clientY - translateY;
                zoomableSvg.style.cursor = 'grab';
            }
        });

        zoomableSvg.addEventListener('mousemove', (event) => {
            if (panning) {
                translateX = event.clientX - startX;
                translateY = event.clientY - startY;
                updateTransform();
            }
        });

        zoomableSvg.addEventListener('mouseup', () => {
            panning = false;
            zoomableSvg.style.cursor = 'default';
        });

        zoomableSvg.addEventListener('mouseleave', () => {
            panning = false;
            zoomableSvg.style.cursor = 'default';
        });

        function updateTransform() {
            zoomableSvg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentZoom})`;
        }
    </script>

<!DOCTYPE html>

<style>
  /* This CSS locks the webpage to the exact height of the browser window and removes default margins */
  body {
    margin: 0;

  .container {
    height: 100%;
    text-align: center;
  }
  svg { 
    height: 100%; /* Forces the SVG to match the container's height */

  /* Text and color formatting for the schedule */

  .title { font-weight: 700; font-size: 88px; }

  .sup { font-size: 55px; baseline-shift: super; }
  .bg-white { fill: #FFFFFF; }
  .bg-blue { fill: #DCEAF7; }
  .border-black { stroke: #000000; stroke-width: 4.58; fill: none; }

</style>
</head>

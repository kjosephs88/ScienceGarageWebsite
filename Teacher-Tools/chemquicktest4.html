<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="shortcut icon" href="https://thesciencegarage.com/SGfavicon.ico">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chemistry Quick Links</title>
  <style>
    body { display:flex; margin:0; font-family:Arial, sans-serif; }
    .tabs { display:flex; flex-direction:column; width:120px; background:#333; }
    .tab { padding:10px; font-size:18px; color:white; text-align:center; cursor:pointer; border:1px solid #444; }
    .tab:hover { background:#555; }
    .tab.active { background:#777; }
    .content { flex:1; overflow:hidden; position:relative; height:800px; }
    .unit { display:none; position:absolute; top:0; left:0; width:100%; height:100%; overflow-y:auto; }
    .unit.active { display:block; }
    .unit-inner { width:800px; margin:0 auto; }
    .unit-title { font-size:40px; margin:30px 0 20px; font-weight:bold; text-align:center; }
    .unit-table { width:100%; border-collapse:collapse; }
    .unit-table th, .unit-table td { border:3px solid black; text-align:center; }
    .unit-table th { background:#7e6e6e; color:white; }
    .grid-container { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; padding:5px; }
    .grid-container a { text-decoration:none; color:black; }
    .grid-item { display:flex; align-items:center; justify-content:center; border:1px solid #ccc; padding:10px; background:#f0f0f0; cursor:pointer; }
    .grid-item:hover { background:#ddd; }
    .loading { text-align:center; padding:20px; font-size:18px; color:#555; }

    /* COPY TABLE */
    .copy-table {
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
    }
    .copy-table th, .copy-table td {
      border:3px solid black;
    }
    .copy-table th {
      background:#7e6e6e;
      color:white;
      text-align:left;
      padding:6px 8px;
    }
    .copy-table td {
      padding:4px 6px;
      background:#f8f8f8;
    }
    .copy-btn {
      width:100%;
      border:1px solid #ccc;
      background:#f0f0f0;
      padding:6px 8px;
      font-size:14px;
      text-align:left;
      cursor:pointer;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .copy-btn:hover {
      background:#ddd;
    }
  </style>
</head>
<body>
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>

<script>
const masterSheetURL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTZgAuU2ZDrAgRVQ1XY4Cma3VmvGnABV2MfUHEanSfGvQbq6aMkNgWPm_2YOwHgUmVHCET9uet78AGE/pub?output=csv";
const baseCSV =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTZgAuU2ZDrAgRVQ1XY4Cma3VmvGnABV2MfUHEanSfGvQbq6aMkNgWPm_2YOwHgUmVHCET9uet78AGE/pub?gid=";

const sheetCache = {};
const tabInfo = [];

// how many display characters to show on the button label
const DISPLAY_LIMIT = 40;

/** Robust CSV parser */
function parseCSV(text) {
  const rows = [];
  let current = [''];
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (c === '"' && inQuotes && next === '"') { current[current.length-1] += '"'; i++; }
    else if (c === '"') inQuotes = !inQuotes;
    else if (c === ',' && !inQuotes) current.push('');
    else if ((c === '\n' || c === '\r') && !inQuotes) {
      if (current.length > 1 || current[0] !== '') rows.push(current);
      current = [''];
    } else current[current.length-1] += c;
  }
  if (current.length > 1 || current[0] !== '') rows.push(current);
  return rows;
}

async function fetchCSV(url) {
  const res = await fetch(url);
  const text = await res.text();
  return parseCSV(text.trim());
}

async function buildTabs() {
  const rows = await fetchCSV(masterSheetURL);
  const tabsDiv = document.getElementById("tabs");
  const contentDiv = document.getElementById("content");

  // Read titles and GIDs
  for (let i = 1; i < rows.length; i++) {
    const title = rows[i][2];
    const gid = rows[i][3];
    if (title) tabInfo.push({ title, gid });
  }

  tabInfo.forEach((info, i) => {
    const tab = document.createElement("div");
    tab.id = "tab-" + i;
    tab.className = "tab" + (i === 0 ? " active" : "");
    tab.textContent = info.title;
    tab.onclick = () => showUnit(i);
    tabsDiv.appendChild(tab);

    const unitDiv = document.createElement("div");
    unitDiv.className = "unit" + (i === 0 ? " active" : "");
    unitDiv.id = "unit-" + i;
    unitDiv.innerHTML =
      i === 0
        ? "<div class='loading'>Loading first unit...</div>"
        : "<div class='loading'>Click tab to load</div>";
    contentDiv.appendChild(unitDiv);
  });

  if (tabInfo.length) await loadUnit(0);
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(err => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
  } catch (e) {
    console.warn("Clipboard copy failed", e);
  }
  document.body.removeChild(ta);
}

/** Escape for HTML attribute */
function escapeAttr(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/** Truncate for display */
function truncateDisplay(str) {
  if (str.length <= DISPLAY_LIMIT) return str;
  return str.slice(0, DISPLAY_LIMIT) + "…";
}

async function loadUnit(index) {
  const { gid } = tabInfo[index];
  const unitDiv = document.getElementById("unit-" + index);

  if (!gid) {
    unitDiv.innerHTML = "<div class='loading'>Content coming soon...</div>";
    return;
  }

  if (sheetCache[gid]) {
    unitDiv.innerHTML = sheetCache[gid];
    // reattach listeners for copy buttons
    unitDiv.querySelectorAll(".copy-btn").forEach(btn => {
      btn.addEventListener("click", () => copyToClipboard(btn.dataset.copy));
    });
    return;
  }

  unitDiv.innerHTML = "<div class='loading'>Loading links...</div>";

  try {
    const rows = await fetchCSV(baseCSV + gid + "&single=true&output=csv");
    if (rows.length < 3) throw new Error("Not enough rows");

    const tabName = rows[0][0];
    const unitTitle = rows[0][1];

    let html = `<div class="unit-inner">`;
    html += `<div class="unit-title">${unitTitle || tabName}</div>`;

    // --- MAIN QUICK LINKS TABLE (Rows 2-42) ---
    // Extract headers from JS index 1 (Sheet Row 2) for Columns B, C, D (Indexes 1, 2, 3)
    const validLinkHeaders = [];
    const validLinkCols = [];
    for (let c = 1; c <= 3; c++) {
      if (rows[1] && rows[1][c] && rows[1][c].trim() !== "") {
        validLinkHeaders.push(rows[1][c]);
        validLinkCols.push(c);
      }
    }
    
    // Extract data from JS indexes 2 to 41 (Sheet Rows 3 to 42)
    const linkData = rows.slice(2, 42);

    if (validLinkHeaders.length > 0) {
      html += "<table class='unit-table'><tr>";
      validLinkHeaders.forEach(h => (html += `<th>${h}</th>`));
      html += "</tr><tr>";

      validLinkCols.forEach(c => {
        html += "<td><div class='grid-container'>";
        linkData.forEach(row => {
          if (row && row.length > 0) {
            const text = row[0]; // Label in Column A
            const link = row[c];
            if (link && link.startsWith("http")) {
              html += `<a href="${link}" target="_blank"><div class="grid-item">${text}</div></a>`;
            }
          }
        });
        html += "</div></td>";
      });
      html += "</tr></table>";
    }

    // --- COPY BUTTON TABLE (Rows 44-86) ---
    // Extract headers from JS index 43 (Sheet Row 44) for Columns B, C, D (Indexes 1, 2, 3)
    const copyHeaders = [];
    const copyCols = [];
    if (rows.length > 43 && rows[43]) {
      for (let c = 1; c <= 3; c++) {
        if (rows[43][c] && rows[43][c].trim() !== "") {
          copyHeaders.push(rows[43][c]);
          copyCols.push(c);
        }
      }
    }

    // Extract data from JS indexes 44 to 85 (Sheet Rows 45 to 86)
    const copyData = rows.slice(44, 86);

    if (copyHeaders.length > 0) {
      html += `<table class="copy-table">`;
      html += `<tr>`;
      copyHeaders.forEach(h => html += `<th>${h}</th>`);
      html += `</tr>`;

      copyData.forEach(row => {
        // Only render the row if at least one column has a button
        let hasData = false;
        copyCols.forEach(c => {
          if (row[c] && row[c].trim() !== "") hasData = true;
        });

        if (hasData) {
          html += `<tr>`;
          copyCols.forEach(c => {
            const cellText = row[c] ? row[c].trim() : "";
            if (cellText) {
              const attrText = escapeAttr(cellText);
              const displayText = truncateDisplay(cellText);
              html += `<td><button class="copy-btn" data-copy="${attrText}">${displayText}</button></td>`;
            } else {
              html += `<td></td>`; // Leave cell empty if no data
            }
          });
          html += `</tr>`;
        }
      });
      html += `</table>`;
    }

    html += `</div>`; // end unit-inner

    sheetCache[gid] = html;
    unitDiv.innerHTML = html;

    // attach listeners for newly created buttons
    unitDiv.querySelectorAll(".copy-btn").forEach(btn => {
      btn.addEventListener("click", () => copyToClipboard(btn.dataset.copy));
    });

  } catch (err) {
    console.error("Error loading unit", err);
    unitDiv.innerHTML =
      "<div class='loading'>⚠️ Error loading this unit.</div>";
  }
}

function showUnit(index) {
  const tabs = document.querySelectorAll(".tab");
  const units = document.querySelectorAll(".unit");
  tabs.forEach((t, i) => t.classList.toggle("active", i === index));
  units.forEach((u, i) => u.classList.toggle("active", i === index));
  loadUnit(index);
}

buildTabs();
</script>
</body>
</html>

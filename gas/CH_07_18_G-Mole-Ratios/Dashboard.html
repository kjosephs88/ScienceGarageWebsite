<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
    .table-container { overflow-x: auto; background: white; max-width: 100%; height: 100%; }
    table { width: max-content; border-collapse: collapse; }
    th, td { border: 1px solid #e5e7eb; padding: 10px; text-align: center; font-size: 13px; }
    .score-col { width: 75px; min-width: 75px; max-width: 75px; }
    .q-col { width: 55px; min-width: 55px; max-width: 55px; }
    th { background-color: #f9fafb; font-weight: 600; color: #4b5563; position: sticky; top: 0; z-index: 10; }
    .name-column-width { width: 280px !important; min-width: 280px !important; max-width: 280px !important; }
    .student-name { position: sticky; left: 0; background-color: inherit; z-index: 15; text-align: left; padding: 0 !important; border-right: 3px solid #cbd5e1; box-shadow: 3px 0 6px -2px rgba(0,0,0,0.1); }
    th.student-name { z-index: 25; background-color: #f9fafb; padding: 10px 0 10px 16px !important; }
    .correct { color: #16a34a; font-size: 1.2em; font-weight: bold; }
    .incorrect { color: #dc2626; font-size: 1.2em; font-weight: bold; }
    .empty { color: #9ca3af; font-weight: normal; }
    .cleared-row { background-color: #bbf7d0; }
    .assigned-row { background-color: #86efac; }
    .mjx-chtml { text-align: center !important; margin: 10px 0; }
  </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

  <div class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0 z-30 shadow-sm overflow-x-auto">
    <div class="shrink-0 mr-4">
      <h1 class="text-xl font-bold text-gray-800 whitespace-nowrap" id="dash-title"><?= ASSIGNMENT_TITLE ?></h1>
      <p class="text-xs text-gray-500 font-mono mt-1" id="dash-code">NODE: <?= ASSIGNMENT_CODE ?></p>
    </div>
    <div class="flex items-center gap-3 shrink-0">
      <div class="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded px-2 py-1">
        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider hidden md:block">Period:</label>
        <select id="period-filter" onchange="handlePeriodChange()" class="bg-transparent text-sm font-medium text-gray-700 focus:outline-none cursor-pointer">
          <option value="ALL">All Periods</option>
        </select>
      </div>
      <button id="btn-return-grid" onclick="showGridView()" class="hidden bg-blue-50 text-blue-600 hover:bg-blue-100 px-4 py-2 rounded font-medium text-sm border border-blue-200 transition whitespace-nowrap">Grid View</button>
      <span id="status-indicator" class="bg-blue-50 text-blue-600 px-3 py-2 rounded-full text-xs font-bold uppercase tracking-wide flex items-center gap-2 whitespace-nowrap">Connecting...</span>
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden relative">
    <div id="sidebar-container" class="hidden name-column-width bg-white border-r border-gray-200 flex flex-col shrink-0 z-10 shadow-sm relative">
      <div id="student-list" class="flex-1 overflow-y-auto p-2"></div>
    </div>
    <div class="flex-1 overflow-y-auto bg-gray-50 p-0 md:p-6 relative">
      <div id="grid-view" class="bg-white md:rounded-lg md:shadow border-y md:border border-gray-200 h-full md:h-auto overflow-hidden">
        <div class="table-container md:rounded-lg h-full">
          <table id="dashboard-table">
            <thead id="table-head">
              </thead>
            <tbody id="table-body">
              <tr><td id="sync-msg" colspan="3" class="py-10 text-gray-500 bg-white">Syncing roster...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div id="detail-view" class="hidden max-w-3xl mx-auto p-6 md:p-0">
        <div class="mb-6 pb-4 border-b border-gray-300">
          <h2 id="detail-name" class="text-2xl font-bold text-gray-800">Student Name</h2>
          <p class="text-sm text-gray-500">Live feed of current progress</p>
        </div>
        <div id="detail-questions" class="space-y-4 pb-20"></div>
      </div>
    </div>
  </div>

  <script>
    const databaseURL = "https://scigarage-default-rtdb.firebaseio.com";
    const FIREBASE_SECRET = "<?= FIREBASE_SECRET ?>";
    const ASSIGNMENT_CODE = "<?= ASSIGNMENT_CODE ?>";
    const SECURE_ANSWER_KEY = JSON.parse('<?= ANSWER_KEY ?>');
    const IS_PRACTICE = ASSIGNMENT_CODE.endsWith("P");
    const questions = JSON.parse('<?= QUESTIONS ?>'); 

    let classRoster = [];
    let currentLiveData = {};
    let activeStudentUid = null;
    let openCommentAreas = new Set();

    function toggleTeacherCommentArea(qId) {
      const area = document.getElementById(`comment-area-q${qId}`);
      if (!area) return;
      const isVisibleNow = !area.classList.toggle('hidden');
      
      if (isVisibleNow) {
        openCommentAreas.add(qId);
        const input = document.getElementById(`teacher-comment-input-q${qId}`);
        if (input) {
          input.focus();
          const val = input.value;
          input.value = '';
          input.value = val;
        }
      } else {
        openCommentAreas.delete(qId);
        if (activeStudentUid) saveTeacherComment(activeStudentUid, qId);
      }
    }

    function handleFRQKeyDown(event, el) {
      if (event.key === 'Backspace' && el.selectionStart === el.selectionEnd) {
          const pos = el.selectionStart;
          const text = el.value;
          const prev3 = text.slice(Math.max(0, pos - 3), pos);

          if (prev3 === ' + ' || prev3 === ' → ') {
              event.preventDefault(); 
              const newVal = text.slice(0, pos - 3) + text.slice(pos);
              el.value = newVal;
              el.setSelectionRange(pos - 3, pos - 3);
              return;
          }
      }

      if (event.key === '+' || event.key === '>') {
          event.preventDefault(); 
          const symbol = event.key === '>' ? '→' : '+';
          
          let start = el.selectionStart;
          let end = el.selectionEnd;
          let text = el.value;
          
          if (start > 0 && start === end && text[start - 1] === ' ') start -= 1;
          if (end < text.length && start === end && text[end] === ' ') end += 1;
          
          const insertStr = ` ${symbol} `;
          el.value = text.slice(0, start) + insertStr + text.slice(end);
          el.setSelectionRange(start + insertStr.length, start + insertStr.length);
      }
    }

    function handleFRQInput(el) {
      const originalVal = el.value;
      const start = el.selectionStart;

      let newVal = "";
      const subMap = {'0':'₀', '1':'₁', '2':'₂', '3':'₃', '4':'₄', '5':'₅', '6':'₆', '7':'₇', '8':'₈', '9':'₉'};
      
      for (let i = 0; i < originalVal.length; i++) {
         let char = originalVal[i];
         if (char === '>') {
             newVal += '→';
         } else if (subMap[char]) {
             let prevChar = newVal.length > 0 ? newVal[newVal.length - 1] : '';
             if (/[A-Za-z₀-₉\)\]]/.test(prevChar)) {
                 newVal += subMap[char];
             } else {
                 newVal += char;
             }
         } else {
             newVal += char;
         }
      }

      if (originalVal !== newVal) {
          el.value = newVal;
          el.setSelectionRange(start, start);
      }
    }

    function saveTeacherComment(uid, qId) {
      const el = document.getElementById(`teacher-comment-input-q${qId}`);
      if (!el) return;
      const text = el.value;
      
      const payload = { 
        teacherComment: text, 
        commentUnread: true 
      };
      
      fetch(`${databaseURL}/classroomAssignments/${ASSIGNMENT_CODE}/${uid}/q${qId}.json?auth=${FIREBASE_SECRET}`, {
        method: 'PATCH',
        body: JSON.stringify(payload)
      });
    }

    function toggleStudentLock(uid, currentStatus) {
      const newStatus = !currentStatus;
      fetch(`${databaseURL}/classroomAssignments/${ASSIGNMENT_CODE}/${uid}.json?auth=${FIREBASE_SECRET}`, {
        method: 'PATCH',
        body: JSON.stringify({ isLocked: newStatus })
      });
    }

    function toggleAllLocks() {
      const filterVal = document.getElementById('period-filter').value;
      let visibleStudents = classRoster.slice();
      if (filterVal !== "ALL") visibleStudents = visibleStudents.filter(s => s.period.toString().trim() === filterVal);
      
      let anyUnlocked = false;
      visibleStudents.forEach(s => {
          const prog = currentLiveData[s.uid] || {};
          if (prog.isLocked !== true) anyUnlocked = true;
      });
      
      const newStatus = anyUnlocked;
      
      visibleStudents.forEach(s => {
          fetch(`${databaseURL}/classroomAssignments/${ASSIGNMENT_CODE}/${s.uid}.json?auth=${FIREBASE_SECRET}`, {
            method: 'PATCH',
            body: JSON.stringify({ isLocked: newStatus })
          });
      });
    }

    function bootDashboard() { 
      let headHtml = `<tr>
        <th class="student-name name-column-width">
          <div class="flex items-center justify-between pr-4">
            <span>Student Name</span>
            <button onclick="toggleAllLocks()" class="p-1 hover:bg-gray-200 rounded transition-colors text-gray-500" title="Toggle Lock for All Visible">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </button>
          </div>
        </th>
        <th class="score-col">Score</th>`;
      questions.forEach(q => { headHtml += `<th class="q-col">Q${q.id}</th>`; });
      headHtml += `</tr>`;
      document.getElementById('table-head').innerHTML = headHtml;
      document.getElementById('sync-msg').colSpan = questions.length + 2;

      google.script.run.withSuccessHandler(startLiveFeed).getDashboardRoster(); 
    }

    function startLiveFeed(rosterData) {
      classRoster = rosterData;
      const periods = [...new Set(classRoster.map(s => s.period.toString().trim()))].sort();
      const filterSelect = document.getElementById('period-filter');
      periods.forEach(p => { const opt = document.createElement('option'); opt.value = p; opt.innerText = `Period ${p}`; filterSelect.appendChild(opt); });
      showGridView(); 
      
      const indicator = document.getElementById('status-indicator');
      indicator.className = "bg-green-100 text-green-700 px-3 py-2 rounded-full text-xs font-bold uppercase tracking-wide flex items-center gap-2 whitespace-nowrap";
      indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> LIVE`;

      const url = `${databaseURL}/classroomAssignments/${ASSIGNMENT_CODE}.json?auth=${FIREBASE_SECRET}`;
      const eventSource = new EventSource(url);
      
      // THE FIX: Custom Deep-Merging Engine for Root PATCH compatibility
      function applyDeepValue(obj, pathArr, val) {
        let current = obj;
        for (let i = 0; i < pathArr.length - 1; i++) {
          if (typeof current[pathArr[i]] !== "object" || current[pathArr[i]] === null) {
            current[pathArr[i]] = {};
          }
          current = current[pathArr[i]];
        }
        const lastKey = pathArr[pathArr.length - 1];
        if (val === null) {
          delete current[lastKey];
        } else {
          current[lastKey] = val;
        }
      }

      function applyFirebaseUpdate(eventType, path, data) {
        if (path === "/") {
          if (eventType === "put") {
            currentLiveData = data || {};
          } else if (eventType === "patch") {
            for (let key in data) {
              applyDeepValue(currentLiveData, key.split("/").filter(p => p), data[key]);
            }
          }
        } else {
          const pathParts = path.split("/").filter(p => p);
          if (eventType === "put") {
            applyDeepValue(currentLiveData, pathParts, data);
          } else if (eventType === "patch") {
            for (let key in data) {
              applyDeepValue(currentLiveData, [...pathParts, ...key.split("/").filter(p => p)], data[key]);
            }
          }
        }
      }

      const handleFirebaseEvent = function(e) {
         if (!e.data || e.data === "null") return;
         const payload = JSON.parse(e.data);
         
         applyFirebaseUpdate(e.type, payload.path, payload.data);
         
         updateGrid(currentLiveData);
         if (activeStudentUid) renderStudentDetail(activeStudentUid);
      };

      eventSource.addEventListener('put', handleFirebaseEvent);
      eventSource.addEventListener('patch', handleFirebaseEvent);
    }

    function handlePeriodChange() {
      const filterVal = document.getElementById('period-filter').value;
      let filtered = classRoster.slice().sort((a, b) => a.name.localeCompare(b.name));
      if (filterVal !== "ALL") filtered = filtered.filter(s => s.period.toString().trim() === filterVal);
      if (activeStudentUid !== null) {
        if (filtered.length > 0) { activeStudentUid = filtered[0].uid; document.getElementById('detail-name').innerText = filtered[0].name; renderStudentDetail(activeStudentUid); } 
        else { showGridView(); }
      }
      renderSidebar();
      updateGrid(currentLiveData);
    }

    function toggleAssigned(uid, isChecked) {
      if (!currentLiveData[uid]) currentLiveData[uid] = {};
      currentLiveData[uid].assignedNext = isChecked;
      updateGrid(currentLiveData);
      fetch(`${databaseURL}/classroomAssignments/${ASSIGNMENT_CODE}/${uid}.json?auth=${FIREBASE_SECRET}`, {
          method: 'PATCH', body: JSON.stringify({ assignedNext: isChecked })
      });
    }

    function renderSidebar() {
      const filterVal = document.getElementById('period-filter').value;
      const listContainer = document.getElementById('student-list');
      listContainer.innerHTML = '';
      let filtered = classRoster.slice().sort((a, b) => a.name.localeCompare(b.name));
      if (filterVal !== "ALL") filtered = filtered.filter(s => s.period.toString().trim() === filterVal);
      filtered.forEach(student => {
        const isActive = (student.uid === activeStudentUid);
        const btn = document.createElement('button');
        btn.className = isActive ? "w-full text-left px-4 py-3 text-sm text-blue-800 bg-blue-100 font-bold border-l-4 border-blue-600 transition flex items-center gap-2" : "w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 border-l-4 border-transparent transition flex items-center gap-2";
        btn.innerHTML = `<svg class="w-4 h-4 ${isActive ? 'text-blue-600' : 'text-gray-400'} shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg><span class="truncate font-medium">${student.name}</span>`;
        btn.onclick = () => showStudentDetail(student.uid, student.name);
        listContainer.appendChild(btn);
      });
    }

    function updateGrid(liveData) {
      const filterVal = document.getElementById('period-filter').value;
      let html = '';
      let sortedRoster = classRoster.slice().sort((a, b) => a.name.localeCompare(b.name));
      
      sortedRoster.forEach(student => {
        if (filterVal !== "ALL" && student.period.toString().trim() !== filterVal) return;
        const studentProgress = liveData[student.uid] || {};
        const isAssigned = studentProgress.assignedNext === true;
        let allCleared = true; 
        let liveScore = 0;
        
        // STANDARD GRADING LOGIC: Number, Compare, Draw
        for (let i = 1; i <= questions.length; i++) {
          const qData = studentProgress[`q${i}`];
          let isCorrect = false;
          if (qData && qData.selection !== undefined && qData.selection !== null && qData.selection !== "") {
             // Directly compare raw selection to the master answer key
             isCorrect = (qData.selection == SECURE_ANSWER_KEY[i]);
          }
          if (!isCorrect) allCleared = false;
          if (isCorrect) liveScore++;
        }
        
        let rowClass = 'bg-white';
        if (allCleared) rowClass = 'cleared-row';
        if (IS_PRACTICE && isAssigned) rowClass = 'assigned-row';

        let hasUnreadComment = false;
        for (let i = 1; i <= questions.length; i++) {
          if (studentProgress[`q${i}`] && studentProgress[`q${i}`].commentUnread === true) {
            hasUnreadComment = true;
            break;
          }
        }
        
        const unreadDot = hasUnreadComment ? `<span class="w-2.5 h-2.5 bg-orange-500 rounded-full border-2 border-white shadow-sm shrink-0" title="Unread feedback"></span>` : "";
        const isLocked = studentProgress.isLocked === true;
        const lockIcon = `
          <button onclick="event.stopPropagation(); toggleStudentLock('${student.uid}', ${isLocked})" class="ml-1 p-1 rounded-full transition-colors shrink-0 ${isLocked ? 'text-red-500 hover:bg-red-50' : 'text-gray-300 hover:bg-gray-100'}" title="${isLocked ? 'Unlock student' : 'Lock student'}">
             <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${isLocked ? 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' : 'M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z'}"></path></svg>
          </button>
        `;

        let checkboxHtml = IS_PRACTICE ? `<input type="checkbox" ${isAssigned ? 'checked' : ''} onchange="toggleAssigned('${student.uid}', this.checked)" onclick="event.stopPropagation()" class="w-4 h-4 text-green-600 bg-gray-100 border-gray-300 rounded-full cursor-pointer shrink-0 focus:ring-green-500 mr-2 ml-4">` : `<div class="w-4 mr-2 ml-4 shrink-0"></div>`;
        let nameColumnInner = `<div class="flex items-center w-full h-full hover:bg-blue-50 transition cursor-pointer overflow-hidden" onclick="showStudentDetail('${student.uid}', '${student.name.replace(/'/g, "\\'")}')">${checkboxHtml}<div class="flex-1 min-w-0 text-left px-2 py-3 text-sm text-gray-700 flex items-center gap-1 overflow-hidden"><svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg><span class="truncate font-medium flex-1">${student.name}</span>${unreadDot}${lockIcon}</div></div>`;

        html += `<tr class="${rowClass} hover:bg-gray-50 transition-colors"><td class="student-name name-column-width h-full border-b-0 border-l-0 border-t-0">${nameColumnInner}</td>`;
        html += studentProgress.submitted === true ? `<td class="score-col font-bold text-gray-800 bg-inherit">${liveScore}/${questions.length}</td>` : `<td class="score-col empty bg-inherit">-</td>`;
        
        for(let i = 1; i <= questions.length; i++) {
          const qData = studentProgress[`q${i}`];
          let isCorrect = false;
          let isAnswered = false;
          
          if (qData && qData.selection !== undefined && qData.selection !== null && qData.selection !== "") {
             isAnswered = true;
             isCorrect = (qData.selection == SECURE_ANSWER_KEY[i]);
          }
          
          // DRAW LOGIC based strictly on the comparison
          if (!isAnswered) html += `<td class="q-col empty bg-inherit">-</td>`; 
          else if (isCorrect) html += `<td class="q-col correct bg-inherit">✔</td>`; 
          else html += `<td class="q-col incorrect bg-inherit">✘</td>`; 
        }
        html += `</tr>`;
      });
      document.getElementById('table-body').innerHTML = html;
    }

    function showGridView() {
      activeStudentUid = null;
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('sidebar-container').classList.add('hidden');
      document.getElementById('btn-return-grid').classList.add('hidden');
      document.getElementById('grid-view').classList.remove('hidden');
    }

    function showStudentDetail(uid, name) {
      activeStudentUid = uid; document.getElementById('detail-name').innerText = name;
      document.getElementById('grid-view').classList.add('hidden');
      document.getElementById('sidebar-container').classList.remove('hidden');
      document.getElementById('btn-return-grid').classList.remove('hidden');
      document.getElementById('detail-view').classList.remove('hidden');
      renderSidebar(); renderStudentDetail(uid);
    }

    function renderStudentDetail(uid) {
      const container = document.getElementById('detail-questions');
      
      const focusedEl = document.activeElement;
      const focusedId = focusedEl ? focusedEl.id : null;
      const selectionStart = focusedEl ? focusedEl.selectionStart : null;
      const selectionEnd = focusedEl ? focusedEl.selectionEnd : null;
      
      let preservedValue = null;
      let preservedQId = null;
      if (focusedId && focusedId.startsWith('teacher-comment-input-q')) {
          preservedValue = focusedEl.value;
          preservedQId = parseInt(focusedId.replace('teacher-comment-input-q', ''));
      }

      container.innerHTML = '';
      const studentData = currentLiveData[uid] || {};

      questions.forEach(q => {
        const qData = studentData[`q${q.id}`];
        const savedSelection = qData ? qData.selection : null;
        let isAnswered = (savedSelection !== null && savedSelection !== undefined && savedSelection !== "");

        let cardClass = "bg-white p-6 md:p-8 rounded-lg shadow-sm border border-gray-200 transition-colors mb-4";
        let statusIcon = `<span class="text-gray-400 italic text-sm">Not answered</span>`;
        let optionsHtml = '';
        
        if (isAnswered) {
          if (savedSelection == SECURE_ANSWER_KEY[q.id]) {
            cardClass = "bg-green-50 p-6 md:p-8 rounded-lg shadow-sm border-2 border-green-400 mb-4"; statusIcon = `<span class="text-green-600 font-bold ml-2">✓ Correct</span>`;
          } else {
            cardClass = "bg-red-50 p-6 md:p-8 rounded-lg shadow-sm border-2 border-red-400 mb-4"; statusIcon = `<span class="text-red-600 font-bold ml-2">✗ Incorrect</span>`;
          }
        }
        
        optionsHtml = q.options.map((opt, i) => {
          const isChecked = savedSelection === i ? 'checked' : '';
          let labelClass = "flex items-start gap-3 py-2 px-2 -ml-2 rounded opacity-80 cursor-not-allowed";
          if (i === SECURE_ANSWER_KEY[q.id]) labelClass += " border-l-4 border-green-500 bg-white font-medium shadow-sm";
          return `<label class="${labelClass}"><input type="radio" disabled ${isChecked} class="mt-1 w-4 h-4 text-gray-400 bg-gray-100 border-gray-300 flex-shrink-0"><span class="text-sm md:text-base leading-relaxed break-words">${opt}</span></label>`;
        }).join('');

        let currentComment = qData ? (qData.teacherComment || "") : "";
        if (q.id === preservedQId) {
            currentComment = preservedValue;
        }
        const isCommentUnread = qData ? (qData.commentUnread === true) : false;

        let commentIconColor = "text-gray-200 hover:text-gray-400"; 
        if (currentComment !== "") {
          if (isCommentUnread) commentIconColor = "text-orange-600 hover:text-orange-700 drop-shadow-sm"; 
          else commentIconColor = "text-green-600 hover:text-green-700"; 
        }
        
        const commentButton = `
          <button onclick="toggleTeacherCommentArea(${q.id})" class="ml-3 p-1 rounded-full transition-all transform hover:scale-110 active:scale-95 ${commentIconColor} focus:ring-2 focus:ring-purple-300" title="${currentComment !== "" ? (isCommentUnread ? 'Feedback Sent (Unread)' : 'Feedback Read') : 'Add Feedback'}">
            <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"></path></svg>
          </button>
        `;

        const isAreaOpen = openCommentAreas.has(q.id);
        const commentAreaHtml = `
          <div id="comment-area-q${q.id}" class="${isAreaOpen ? '' : 'hidden'} mt-4 pt-4 border-t border-gray-100">
             <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Teacher Comment:</label>
             <textarea id="teacher-comment-input-q${q.id}" onkeydown="handleFRQKeyDown(event, this)" oninput="handleFRQInput(this)" onblur="saveTeacherComment('${uid}', ${q.id})" rows="2" class="w-full p-2 border border-gray-300 rounded text-sm text-blue-700 font-bold focus:ring-2 focus:ring-purple-400 outline-none" placeholder="Type a hint or feedback here...">${currentComment}</textarea>
             <div class="mt-2 flex justify-end items-center">
               <span class="text-[10px] text-gray-400 italic">Saves on blur (clicking out)</span>
             </div>
          </div>
        `;

        container.innerHTML += `
          <div class="${cardClass}">
            <div class="mb-4 text-base font-normal leading-relaxed text-gray-900 flex justify-between items-start">
               <div class="flex-1"><span class="font-medium mr-1">${q.id}.</span> ${q.text}</div>
               <div class="shrink-0 flex items-center bg-white pl-2">
                 <div class="text-sm whitespace-nowrap">${statusIcon}</div>
                 ${commentButton}
               </div>
            </div>
            <div class="flex flex-col gap-2 pl-2">${optionsHtml}</div>
            ${commentAreaHtml}
          </div>
        `;
      });

      if (focusedId) {
        const el = document.getElementById(focusedId);
        if (el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT')) {
          el.focus();
          if (selectionStart !== null) {
            el.setSelectionRange(selectionStart, selectionEnd);
          }
        }
      }

      if (window.MathJax) MathJax.typesetPromise();
    }
    
    window.onload = bootDashboard;
  </script>
</body>
</html>

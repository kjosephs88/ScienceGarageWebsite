<script>
    const databaseURL = "https://scigarage-default-rtdb.firebaseio.com";
    const ASSIGNMENT_CODE = "<?= ASSIGNMENT_CODE ?>";
    const questions = <?!= QUESTIONS ?>; 

    const katexConfig = {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      throwOnError: false
    };

    let studentConfig = null;
    let localState = {};
    let activeDebounces = new Set();
    window.serverAnswerKey = null;
    window.alreadyUnlocked = false;
    window.hasCelebrated = false;
    let commentVisibility = {};

    function init() {
      google.script.run
        .withSuccessHandler(data => {
            studentConfig = data;
            const liveData = data.savedState || {};
            window.studentLocked = (liveData && liveData.isLocked === true);
            window.studentSubmitted = (liveData && liveData.submitted === true);
            
            questions.forEach(q => { localState[q.id] = liveData[`q${q.id}`] || { selection: null }; });
            
            if (liveData.unlocked) {
                window.serverAnswerKey = liveData.answerKey;
                window.alreadyUnlocked = true;
            }
            renderAllQuestions();
            startSSEListener();
            
            if (window.renderMathInElement) {
                const handoutEl = document.getElementById('handout-text');
                renderMathInElement(handoutEl, katexConfig);
                handoutEl.classList.remove('opacity-0');
            }
        })
        .withFailureHandler(err => {
            document.getElementById('loader').innerText = "Access Denied: " + err.message;
            document.getElementById('loader').className = "absolute top-4 right-4 text-xs font-bold text-red-600 bg-red-50 px-3 py-1 rounded-full border border-red-200";
        })
        .getStudentInitialData();
    }

    function startSSEListener() {
      const url = `${databaseURL}/${studentConfig.basePath}.json`;
      const eventSource = new EventSource(url);
      
      const handleUpdate = (e) => {
        const payload = JSON.parse(e.data);
        const path = payload.path || "";
        const data = payload.data || {};

        if (path === "/") {
            window.studentLocked = data.isLocked === true;
            window.studentSubmitted = data.submitted === true;
            questions.forEach(q => { if (!activeDebounces.has(q.id)) localState[q.id] = data[`q${q.id}`] || localState[q.id]; });
            if (data.unlocked) {
                window.serverAnswerKey = data.answerKey;
                window.alreadyUnlocked = true;
            }
        } else if (path === "/isLocked") {
            window.studentLocked = data;
        } else if (path === "/submitted") {
            window.studentSubmitted = data;
        } else if (path.startsWith("/q")) {
            const qId = parseInt(path.replace("/q", ""));
            if (!activeDebounces.has(qId)) localState[qId] = Object.assign({}, localState[qId], data);
        } else if (path === "/unlocked" && data === true) {
            fetch(url).then(r => r.json()).then(d => { 
                if (d.answerKey) { window.serverAnswerKey = d.answerKey; window.alreadyUnlocked = true; }
                renderAllQuestions(); 
            });
        }
        renderAllQuestions();
      };
      eventSource.addEventListener('put', handleUpdate);
      eventSource.addEventListener('patch', handleUpdate);
    }

    function saveAnswer(qId, selection, qType) {
      if (!localState[qId]) localState[qId] = {};
      localState[qId].selection = selection; 
      
      let patchPayload = {
        [`q${qId}/selection`]: selection,
        lastUpdated: Date.now()
      };

      // Live score calculation if unlocked
      if (window.alreadyUnlocked && window.serverAnswerKey) {
          let liveScore = 0;
          questions.forEach(q => {
             if (q.type === 'mc' && localState[q.id]?.selection == window.serverAnswerKey[q.id]) liveScore++;
             if (q.type === 'text' && localState[q.id]?.isCorrect === true) liveScore++;
          });
          patchPayload['score'] = liveScore;
      }

      fetch(`${databaseURL}/${studentConfig.basePath}.json`, {
        method: 'PATCH',
        body: JSON.stringify(patchPayload)
      });
    }

    function toggleStudentCommentArea(qId) {
      const area = document.getElementById(`student-comment-area-q${qId}`);
      if (!area) return;
      const isCurrentlyHidden = area.classList.toggle('hidden');
      commentVisibility[qId] = !isCurrentlyHidden; 
      
      if (!isCurrentlyHidden && localState[qId] && localState[qId].commentUnread === true) {
         localState[qId].commentUnread = false; 
         
         fetch(`${databaseURL}/${studentConfig.basePath}/q${qId}.json`, {
           method: 'PATCH', 
           body: JSON.stringify({ commentUnread: false }) 
         });
         
         const btn = document.getElementById(`student-comment-btn-${qId}`);
         if (btn) {
             btn.classList.remove('glow-effect', 'bg-orange-50', 'border-orange-500', 'text-orange-700');
             btn.classList.add('bg-white', 'border-gray-300', 'text-gray-600', 'opacity-75');
         }
      }
    }

    function checkLockStatus() {
       const isLocked = (window.studentLocked === true);
       if (isLocked) {
           document.getElementById('lock-message-container').classList.remove('hidden');
           document.getElementById('questions-container').classList.add('hidden');
           document.getElementById('submit-container').classList.add('hidden');
           return true; 
       } else {
           document.getElementById('lock-message-container').classList.add('hidden');
           document.getElementById('questions-container').classList.remove('hidden');
           document.getElementById('submit-container').classList.remove('hidden');
           return false;
       }
    }

    function show100PercentModal() {
      const modal = document.getElementById('submission-modal');
      const titleEl = document.getElementById('modal-title');
      const msgEl = document.getElementById('modal-message');
      titleEl.innerText = "🏆 100% PERFECT! 🏆";
      titleEl.className = "text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-500 mb-4 animate-bounce";
      msgEl.innerHTML = "Flawless victory! You have successfully mastered every multiple-choice question on this assignment. Incredible work!";
      modal.classList.remove('hidden');
    }

    function renderAllQuestions() {
      if (checkLockStatus()) return;
      
      const activeId = document.activeElement ? document.activeElement.id : null;
      const container = document.getElementById('questions-container');
      
      let currentCorrectCount = 0;
      let totalMCCount = 0;
      
      // Calculate overall score for shading condition
      let overallCorrect = 0;
      questions.forEach(q => {
        const qData = localState[q.id];
        if (q.type === 'mc') {
          if (window.serverAnswerKey && qData?.selection == window.serverAnswerKey[q.id]) overallCorrect++;
        } else {
          if (qData?.isCorrect === true) overallCorrect++;
        }
      });
      const meetsShadeCondition = (window.studentSubmitted === true && (overallCorrect / questions.length) >= 0.8);

      questions.forEach(q => {
        const cardId = `card-q${q.id}`;
        let card = document.getElementById(cardId);
        
        if (!card) { 
            card = document.createElement('div'); card.id = cardId; 
            card.innerHTML = `<div id="head-q${q.id}" class="flex justify-between mb-4 items-start gap-4"></div><div id="body-q${q.id}"></div>`;
            container.appendChild(card); 
        }

        const qData = localState[q.id];
        const selection = qData?.selection;
        let isAnswered = (selection !== null && selection !== undefined && selection !== "");

        let cardClass = "bg-white p-6 md:p-8 rounded-lg shadow-sm border border-gray-200 mb-4 transition-colors duration-300";
        let statusIcon = "";
        let inputHtml = "";

        if (q.type === 'mc') {
            totalMCCount++;
            if (window.serverAnswerKey && isAnswered) {
                 const hasKeyForQ = window.serverAnswerKey[q.id] !== undefined;
                 if (hasKeyForQ) {
                     let isCorrect = (selection == window.serverAnswerKey[q.id]);
                     if (isCorrect) currentCorrectCount++;
                     if (meetsShadeCondition) {
                         cardClass = isCorrect ? "bg-green-50 border-2 border-green-400 mb-4 p-6 rounded-lg shadow-sm" : "bg-red-50 border-2 border-red-400 mb-4 p-6 rounded-lg shadow-sm";
                         statusIcon = isCorrect ? `<span class="text-green-600 font-bold whitespace-nowrap">✓ Correct</span>` : `<span class="text-red-600 font-bold whitespace-nowrap">✗ Incorrect</span>`;
                     } else {
                         statusIcon = `<span class="text-blue-600 font-bold whitespace-nowrap">Answered</span>`;
                     }
                 } else {
                     statusIcon = `<span class="text-blue-600 font-bold whitespace-nowrap">Answered</span>`;
                 }
            }
            inputHtml = q.options.map((opt, i) => `<label class="flex items-start gap-3 py-2 cursor-pointer hover:bg-gray-50 rounded px-2"><input type="radio" name="q${q.id}" ${selection === i ? 'checked' : ''} onchange="saveAnswer(${q.id}, ${i}, 'mc')" class="w-5 h-5 text-purple-600 mt-1"><span class="text-sm md:text-base">${opt}</span></label>`).join('');
        } else if (q.type === 'text') {
            if (isAnswered) {
                if (meetsShadeCondition) {
                    if (qData.isCorrect === true) {
                        cardClass = "bg-green-50 border-2 border-green-400 mb-4 p-6 rounded-lg shadow-sm";
                        statusIcon = `<span class="text-green-600 font-bold whitespace-nowrap">✓ Marked Correct</span>`;
                    } else if (qData.isCorrect === false) {
                        cardClass = "bg-red-50 border-2 border-red-400 mb-4 p-6 rounded-lg shadow-sm";
                        statusIcon = `<span class="text-red-600 font-bold whitespace-nowrap">✗ Marked Incorrect</span>`;
                    } else {
                        statusIcon = `<span class="text-blue-600 font-bold whitespace-nowrap">Pending Review</span>`;
                    }
                } else {
                    statusIcon = `<span class="text-blue-600 font-bold whitespace-nowrap">Answered</span>`;
                }
            }
            inputHtml = `<textarea id="input-q${q.id}" rows="3" onblur="saveAnswer(${q.id}, this.value, 'text')" class="w-full p-3 border border-gray-300 rounded mt-2 text-blue-700 font-bold focus:ring-2 focus:ring-purple-500">${selection || ''}</textarea>`;
        }
        
        card.className = cardClass;
        
        let commentButtonHtml = ""; let commentPanelHtml = "";
        const currentComment = qData ? (qData.teacherComment || "") : "";
        const isCommentUnread = qData ? (qData.commentUnread === true) : false;

        if (currentComment !== "") {
            const btnClass = isCommentUnread ? "glow-effect bg-orange-50 border-orange-500 text-orange-700" : "bg-white border-gray-300 text-gray-600 opacity-75 hover:opacity-100";
            commentButtonHtml = `<button id="student-comment-btn-${q.id}" onclick="toggleStudentCommentArea(${q.id})" class="text-xs font-bold px-3 py-1 ml-3 border-2 rounded-full transition-all ${btnClass} flex items-center shadow-sm">💡 Teacher Comment</button>`;
            const isVisible = commentVisibility[q.id] === true;
            commentPanelHtml = `<div id="student-comment-area-q${q.id}" class="${isVisible ? '' : 'hidden'} mt-3 p-3 bg-blue-50 border border-blue-200 rounded-lg shadow-inner"><div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-500"></span> Note from Teacher:</div><div class="text-blue-900 font-bold whitespace-pre-wrap ml-3 leading-relaxed" style="font-size: 15px;">${String(currentComment).replace(/"/g, '&quot;')}</div></div>`;
        }

        document.getElementById(`head-q${q.id}`).innerHTML = `<div class="text-gray-900 leading-relaxed w-full"><strong>${q.id}.</strong> ${q.text}</div><div class="shrink-0 flex items-center mt-1"><div class="text-sm">${statusIcon}</div>${commentButtonHtml}</div>`;
        if (!(activeId === `input-q${q.id}` || activeDebounces.has(q.id))) {
            document.getElementById(`body-q${q.id}`).innerHTML = inputHtml + commentPanelHtml;
        }
      });
      
      document.getElementById('loader').classList.add('hidden');
      document.getElementById('submit-container').classList.remove('hidden');
      
      if (window.renderMathInElement) renderMathInElement(document.getElementById('questions-container'), katexConfig);
      if (window.serverAnswerKey && currentCorrectCount === totalMCCount && !window.hasCelebrated) { window.hasCelebrated = true; show100PercentModal(); }
    }

    async function submitWork() {
      const unanswered = questions.filter(q => { const data = localState[q.id]; return !data || data.selection === null || data.selection === undefined || String(data.selection).trim() === ""; });
      if (unanswered.length > 0) {
        const modal = document.getElementById('submission-modal'); const titleEl = document.getElementById('modal-title'); const msgEl = document.getElementById('modal-message');
        titleEl.innerText = "Assignment Incomplete"; titleEl.className = "text-2xl font-bold mb-4 text-orange-600";
        msgEl.innerHTML = `You have <strong>${unanswered.length}</strong> question(s) left to answer. Please complete the entire assignment before submitting for grading.`;
        modal.classList.remove('hidden'); return;
      }
      const btn = document.getElementById('submit-btn'); btn.innerText = "Grading..."; btn.disabled = true;
      google.script.run.withSuccessHandler(handleGradeResult).gradeSubmission(studentConfig);
    }

    function handleGradeResult(res) {
      document.getElementById('submit-btn').innerText = "Submit Work"; document.getElementById('submit-btn').disabled = false;
      const modal = document.getElementById('submission-modal'); const titleEl = document.getElementById('modal-title'); const msgEl = document.getElementById('modal-message');

      if (res.answerKey) window.serverAnswerKey = res.answerKey;

      if (res.totalCorrect === res.totalQuestions) {
          window.hasCelebrated = true; show100PercentModal(); return; 
      } else if (!res.isFullyGraded) {
          titleEl.className = "text-2xl font-bold mb-4 text-orange-600"; titleEl.innerText = "Review Pending";
          msgEl.innerHTML = `You have <strong>${res.mcCorrect} out of ${res.totalMC}</strong> multiple-choice correct. The final four written questions are currently pending your teacher's manual review. You will see your final colors and grade once the teacher finishes grading.`;
      } else if (res.status === 'unlocked') {
          titleEl.className = "text-2xl font-bold mb-4 text-purple-600"; titleEl.innerText = "🎊 Mastery Achieved! 🎊";
          if (window.alreadyUnlocked) {
              msgEl.innerHTML = `Excellent momentum! You have <strong>${res.totalCorrect} out of ${res.totalQuestions}</strong> total questions correct. All work has been graded!`;
          } else { 
              msgEl.innerHTML = `Fantastic work! You have <strong>${res.mcCorrect} out of ${res.totalMC}</strong> multiple-choice correct, officially mastering the content! 🌟 The answer key is now <strong>unlocked</strong>, and your worksheet will now give you live feedback as you finish.<br><br>All questions have been reviewed and graded!`; 
              window.alreadyUnlocked = true; 
          }
      } else {
          titleEl.className = "text-2xl font-bold mb-4 text-gray-800"; titleEl.innerText = "Keep Working!";
          msgEl.innerHTML = `You currently have <strong>${res.mcCorrect} multiple-choice correct out of ${res.totalMC}</strong>.<br><br>You must get <strong>${res.mcThreshold}/${res.totalMC}</strong> on the multiple-choice section to unlock the answer key.<br><br><em>Teacher Review: ${res.textGradedCount}/${res.totalText} written questions graded.</em>`;
      }
      modal.classList.remove('hidden'); renderAllQuestions();
    }

    function closeModal() { document.getElementById('submission-modal').classList.add('hidden'); }
    window.onload = init;
  </script>

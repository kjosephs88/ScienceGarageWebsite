  <style>

<body class="h-screen overflow-hidden flex flex-col">

  <div class="bg-white border-b-4 border-gray-800 px-6 py-6 shrink-0 z-30 relative shadow-sm">

            <?= HEADER_TYPE ?>

            class="bg-gray-100 text-gray-500 px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-wide flex items-center gap-2 border border-gray-300 whitespace-nowrap">Connecting...</span>
        </div>

        <?= ASSIGNMENT_TITLE ?>

  <div class="flex flex-1 overflow-hidden relative">
    <div id="sidebar-container"
      class="hidden name-column-width bg-white border-r border-gray-200 flex flex-col shrink-0 z-10 shadow-sm relative">
      <div id="student-list" class="flex-1 overflow-y-auto p-2"></div>
    </div>
    <div class="flex-1 overflow-hidden bg-gray-50 p-0 md:p-6 relative">
      <div id="grid-view"
        class="bg-white md:rounded-lg md:shadow border-y md:border border-gray-200 h-full overflow-hidden">
        <div class="table-container h-full overflow-auto">
          <table id="dashboard-table">
            <thead id="table-head"></thead>
            <tbody id="table-body">
              <tr>
                <td id="sync-msg" class="py-10 text-gray-500 bg-white text-center">Syncing roster...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div id="detail-view" class="hidden w-full h-full overflow-y-auto">
        <div class="max-w-3xl mx-auto p-6 md:p-10">
          <div class="mb-6 pb-4 border-b border-gray-300">
            <h2 id="detail-name" class="text-3xl font-bold text-gray-800">Student Name</h2>
            <p class="text-sm font-medium text-gray-500 mt-1 uppercase tracking-wide">Live Student Progress Feed</p>
          </div>
          <div id="detail-questions" class="space-y-4 pb-20"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const databaseURL = "https://scigarage-default-rtdb.firebaseio.com";
    const FIREBASE_SECRET = "<?= FIREBASE_SECRET ?>";
    const ASSIGNMENT_CODE = "<?= ASSIGNMENT_CODE ?>";
    const questions = <?!= QUESTIONS ?>;
    const NAME_MAP = <?!= NAME_MAP ?>;

    let SECURE_ANSWER_KEY = {}; // Fetched dynamically from Cloud

    const katexConfig = {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false },
        { left: '\\[', right: '\\]', display: true }
      ],
      throwOnError: false
    };

    let currentLiveData = {};
    let activeStudentUid = null;
    let activeStudentPeriod = null;
    let selectedClassFolder = null;
    let classAssignmentKeys = {};
    let activeEventSources = [];
    let openCommentAreas = new Set();
    let relevantClasses = [];

    function formatPeriodName(folder) {
      if (!folder || folder === 'ALL') return folder === 'ALL' ? 'All Classes' : folder;
      const match = folder.match(/_P(\d+)/i);
      return match ? `Period ${match[1]}` : folder;
    }

    function updateNestedData(root, path, value) {
      const parts = path.split('/').filter(p => p.trim() !== '');
      let current = root;
      for (let i = 0; i < parts.length - 1; i++) {
        if (!current[parts[i]]) current[parts[i]] = {};
        current = current[parts[i]];
      }
      if (parts.length > 0) {
        const lastPart = parts[parts.length - 1];
        if (value === null) {
          delete current[lastPart];
        } else {
          current[lastPart] = value;
        }
      }
    }

    async function init() {
      // Fetch Master Rubric from Cloud
      try {
        const res = await fetch(`${databaseURL}/rubrics/${ASSIGNMENT_CODE}.json?auth=${FIREBASE_SECRET}`);
        SECURE_ANSWER_KEY = await res.json() || {};
        console.log("Master Rubric Loaded from Cloud");
      } catch (e) {
        console.error("Failed to fetch Master Rubric:", e);
      }

      let headHtml = `<tr>
        <th class="student-name name-column-width">
          <div class="flex items-center justify-between pr-4">
            <span>Student Name</span>
            <button onclick="toggleAllLocks()" class="p-1 hover:bg-gray-200 rounded transition-colors text-gray-500" title="Toggle Lock for All Visible">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </button>
          </div>
        </th>
        <th class="score-col">Total Score</th>`;
      questions.forEach(q => { headHtml += `<th class="q-col">Q${q.id}</th>`; });
      headHtml += `</tr>`;
      document.getElementById('table-head').innerHTML = headHtml;

      document.getElementById('sync-msg').colSpan = questions.length + 2;
      document.getElementById('sync-msg').innerText = "Loading master class roster...";

      google.script.run.withSuccessHandler(initializeWithRoster).getDashboardRoster();
    }

    function initializeWithRoster(rosterData) {
      classRoster = rosterData;
      const targetPrefix = ASSIGNMENT_CODE.split('_')[0];
      relevantClasses = [...new Set(classRoster.map(s => s.period))].filter(c => c.startsWith(targetPrefix)).sort();

      const filterSelect = document.getElementById('class-filter');
      filterSelect.innerHTML = '';

      if (relevantClasses.length === 0) {
        document.getElementById('sync-msg').innerText = "No students found in the roster for this unit.";
        return;
      }

      if (relevantClasses.length > 1) {
        const allOpt = document.createElement('option');
        allOpt.value = 'ALL'; allOpt.innerText = 'All Classes';
        filterSelect.appendChild(allOpt);
        selectedClassFolder = 'ALL';
      }

      relevantClasses.forEach((c, idx) => {
        const opt = document.createElement('option');
        opt.value = c; opt.innerText = formatPeriodName(c);
        filterSelect.appendChild(opt);
        if (!selectedClassFolder && idx === 0) { selectedClassFolder = c; }
      });

      if (selectedClassFolder) filterSelect.value = selectedClassFolder;
      handleClassChange();
    }

    function handleClassChange() {
      const oldSelection = selectedClassFolder;
      selectedClassFolder = document.getElementById('class-filter').value;

      if (activeStudentUid && oldSelection !== selectedClassFolder) {
        const newSorted = getSortedStudents();
        if (newSorted.length > 0) {
          showStudentDetail(newSorted[0].uid, newSorted[0].name, newSorted[0].period);
        } else { showGridView(); }
      }

      currentLiveData = {};
      classAssignmentKeys = {};
      activeEventSources.forEach(es => es.close());
      activeEventSources = [];

      document.getElementById('table-body').innerHTML = `<tr><td colspan="${questions.length + 2}" class="py-10 text-gray-500 bg-white text-center">Fetching live assignment data...</td></tr>`;
      const foldersToFetch = selectedClassFolder === 'ALL' ? relevantClasses : [selectedClassFolder];

      let fetchCount = 0;
      foldersToFetch.forEach(folder => {
        const tgUrl = `${databaseURL}/teacherGradebook/${folder}.json?auth=${FIREBASE_SECRET}&shallow=true`;
        fetch(tgUrl).then(r => r.json()).then(keys => {
          const classroomId = folder.split('_').pop();
          const provisionalKey = `${ASSIGNMENT_CODE}_${classroomId}`;
          const key = Object.keys(keys || {}).find(k => k.startsWith(ASSIGNMENT_CODE) && k !== provisionalKey) || provisionalKey;

          classAssignmentKeys[folder] = key;
          startLiveDatabaseListener(folder, key);

          fetchCount++;
          if (fetchCount === foldersToFetch.length) {
            const indicator = document.getElementById('status-indicator');
            indicator.className = "bg-green-100 text-green-700 px-3 py-1.5 border border-green-300 rounded-full text-xs font-bold uppercase tracking-wide flex items-center gap-2 shadow-sm whitespace-nowrap";
            indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> LIVE (${formatPeriodName(selectedClassFolder)})`;
          }
        });
      });
    }

    function startLiveDatabaseListener(classFolder, assignmentKey) {
      const url = `${databaseURL}/teacherGradebook/${classFolder}/${assignmentKey}.json?auth=${FIREBASE_SECRET}`;
      const es = new EventSource(url);
      activeEventSources.push(es);

      if (!currentLiveData[classFolder]) currentLiveData[classFolder] = {};

      const handleFirebaseEvent = function (e) {
        const payload = JSON.parse(e.data);
        const path = payload.path || "";
        const data = payload.data;

        if (e.type === 'put') {
          if (path === "/") currentLiveData[classFolder] = data || {};
          else updateNestedData(currentLiveData[classFolder], path, data);
        } else if (e.type === 'patch') {
          for (let key in data) {
            const fullPath = path === '/' ? '/' + key : path + '/' + key;
            updateNestedData(currentLiveData[classFolder], fullPath, data[key]);
          }
        }

        updateGrid();
        if (activeStudentUid && activeStudentPeriod === classFolder) {
          if (path === "/") {
            renderStudentDetail(activeStudentUid, activeStudentPeriod);
          } else if (path.startsWith("/" + activeStudentUid)) {
            const subPath = path.replace("/" + activeStudentUid, "");
            if (subPath === "") {
              renderStudentDetail(activeStudentUid, activeStudentPeriod);
            } else {
              const parts = subPath.split('/').filter(p => p !== "");
              if (parts[0].startsWith("q")) {
                const qId = parseInt(parts[0].replace("q", ""));
                renderStudentQuestionCard(activeStudentUid, activeStudentPeriod, qId);
              } else {
                renderStudentDetail(activeStudentUid, activeStudentPeriod);
              }
            }
          }
        }
      };

      es.addEventListener('put', handleFirebaseEvent);
      es.addEventListener('patch', handleFirebaseEvent);
    }

    function toggleStudentLock(uid, period, currentStatus) {
      const newStatus = !currentStatus;
      const assignmentKey = classAssignmentKeys[period];
      if (!currentLiveData[period]) currentLiveData[period] = {};
      if (!currentLiveData[period][uid]) currentLiveData[period][uid] = {};
      currentLiveData[period][uid].isLocked = newStatus;
      updateGrid();
      if (activeStudentUid === uid && activeStudentPeriod === period) renderStudentDetail(uid, period);
      fetch(`${databaseURL}/teacherGradebook/${period}/${assignmentKey}/${uid}.json?auth=${FIREBASE_SECRET}`, {
        method: 'PATCH', body: JSON.stringify({ isLocked: newStatus })
      });
    }

    function gradeTextQuestion(uid, period, qId, isCorrect) {
      const assignmentKey = classAssignmentKeys[period];
      const qKey = String(qId).startsWith('q') ? qId : `q${qId}`;
      const studentData = (currentLiveData[period] || {})[uid] || {};

      // Update local state first for immediate feedback
      if (!studentData[qKey]) studentData[qKey] = {};
      studentData[qKey].isCorrect = isCorrect;

      // Recalculate score including this new grade
      let totalCorrect = 0;
      questions.forEach(q => {
        const qData = studentData[`q${q.id}`];
        if (q.type === 'mc') {
          if (qData && qData.selection !== undefined && qData.selection !== null && qData.selection !== "") {
            if (qData.selection == SECURE_ANSWER_KEY[q.id]) totalCorrect++;
          }
        } else {
          if (qData && qData.isCorrect === true) totalCorrect++;
        }
      });

      // Mastery threshold check
      const totalThreshold = Math.ceil(questions.length * 0.8);
      const isUnlocked = totalCorrect >= totalThreshold;

      updateGrid();
      if (activeStudentUid === uid && activeStudentPeriod === period) {
        renderStudentQuestionCard(uid, period, qId);
      }

      const patchPayload = {
        [`${qKey}/isCorrect`]: isCorrect,
        [`${qKey}/score`]: isCorrect ? 1 : 0, // Ensure granular score matches isCorrect
        score: totalCorrect,
        unlocked: isUnlocked
      };

      fetch(`${databaseURL}/teacherGradebook/${period}/${assignmentKey}/${uid}.json?auth=${FIREBASE_SECRET}`, {
        method: 'PATCH', body: JSON.stringify(patchPayload)
      });
    }

    function saveTeacherComment(el, uid, period, qId) {
      if (!el || !el.isConnected) return;
      const newText = el.value.trim();
      const assignmentKey = classAssignmentKeys[period];
      const qKey = String(qId).startsWith('q') ? qId : `q${qId}`;
      const studentData = (currentLiveData[period] || {})[uid] || {};
      const qData = studentData[qKey] || {};
      const oldText = (qData.teacherComment || "").trim();

      if (newText !== oldText) {
        fetch(`${databaseURL}/teacherGradebook/${period}/${assignmentKey}/${uid}/${qKey}.json?auth=${FIREBASE_SECRET}`, {
          method: 'PATCH', body: JSON.stringify({ teacherComment: newText, commentUnread: true })
        });
      }
    }

    function autoResize(el) {
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = (el.scrollHeight) + 'px';
    }

    /**
 * 🧪 CHEMISTRY LOGIC ENGINE
 * Handles: Combined Shortcuts (//) and Auto-Subscripts
 */
    function applyChemistryLogic(el) {
      const val = el.value;
      const start = el.selectionStart;

      let newVal = val;

      // 1. Combined Shortcuts (//) for States and Superscripts
      const chemMap = {
        's': '(𝑠)', 'l': '(ℓ)', 'g': '(𝑔)', 'a': '(𝑎𝑞)',
        '+': '⁺', '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³',
        '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹'
      };

      // This looks for // followed by any character in our map
      newVal = newVal.replace(/\/\/([slga+\-0-9])/gi, (match, char) => {
        return chemMap[char.toLowerCase()] || match;
      });

      // 2. Auto-Subscripts (Same as before)
      const subMap = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
      let subbedVal = "";
      for (let i = 0; i < newVal.length; i++) {
        let char = newVal[i];
        if (subMap[char]) {
          let prevChar = subbedVal.length > 0 ? subbedVal[subbedVal.length - 1] : '';
          if (/[A-Za-z\)\]₀-₉]/.test(prevChar)) {
            subbedVal += subMap[char];
          } else {
            subbedVal += char;
          }
        } else {
          subbedVal += char;
        }
      }
      newVal = subbedVal;

      if (val !== newVal) {
        el.value = newVal;
        const diff = newVal.length - val.length;
        el.setSelectionRange(start + diff, start + diff);
      }

      autoResize(el);
    }

    /**
  * Handles instant symbol expansion (+ and >) and smart backspacing
  * UPDATED: Ignores "+" if preceded by "//" to allow superscripts
  */
    function handleChemistryKeyDown(event, el) {
      const pos = el.selectionStart;
      const text = el.value;

      // 1. Smart Backspacing (Same as before)
      if (event.key === 'Backspace' && pos === el.selectionEnd) {
        const prev3 = text.slice(Math.max(0, pos - 3), pos);
        if (prev3 === ' + ' || prev3 === ' → ') {
          event.preventDefault();
          el.value = text.slice(0, pos - 3) + text.slice(pos);
          el.setSelectionRange(pos - 3, pos - 3);
          return;
        }
      }

      // 2. Smart Spacing for + and >
      if (event.key === '+' || event.key === '>') {
        // CHECK: Is there a "//" right before the cursor?
        const prev2 = text.slice(Math.max(0, pos - 2), pos);

        if (event.key === '+' && prev2 === '//') {
          // Do nothing! Let the "+" type normally so applyChemistryLogic can handle it.
          return;
        }

        // Otherwise, proceed with the auto-spacing logic
        event.preventDefault();
        const symbol = event.key === '>' ? '→' : '+';
        const insertStr = ` ${symbol} `;

        let start = el.selectionStart;
        let end = el.selectionEnd;
        let currentText = el.value;

        if (start > 0 && currentText[start - 1] === ' ') start -= 1;
        if (end < currentText.length && currentText[end] === ' ') end += 1;

        el.value = currentText.slice(0, start) + insertStr + currentText.slice(end);
        el.setSelectionRange(start + insertStr.length, start + insertStr.length);
      }
    }


    function toggleTeacherCommentArea(qId) {
      const area = document.getElementById(`comment-area-q${qId}`);
      if (!area) return;
      const isVisibleNow = !area.classList.toggle('hidden');

      if (isVisibleNow) {
        openCommentAreas.add(qId);
        const input = document.getElementById(`teacher-comment-input-q${qId}`);
        if (input) { input.focus(); const val = input.value; input.value = ''; input.value = val; }
      } else {
        openCommentAreas.delete(qId);
        const input = document.getElementById(`teacher-comment-input-q${qId}`);
        if (activeStudentUid && input) saveTeacherComment(input, activeStudentUid, activeStudentPeriod, qId);
      }
    }

    function getSortedStudents() {
      let filtered = selectedClassFolder === 'ALL' ? classRoster : classRoster.filter(s => s.period === selectedClassFolder);
      return filtered.sort((a, b) => {
        if (selectedClassFolder === 'ALL') {
          const periodCompare = a.period.localeCompare(b.period);
          if (periodCompare !== 0) return periodCompare;
        }
        return a.name.localeCompare(b.name);
      });
    }

    function renderSidebar() {
      const listContainer = document.getElementById('student-list');
      listContainer.innerHTML = '';
      const sortedStudents = getSortedStudents();

      sortedStudents.forEach(student => {
        const uid = student.uid;
        const period = student.period;
        const displayName = student.name;
        const isActive = (uid === activeStudentUid && period === activeStudentPeriod);

        const btn = document.createElement('button');
        btn.className = isActive ? "w-full text-left px-4 py-3 text-sm text-blue-800 bg-blue-100 font-bold border-l-4 border-blue-600 transition flex flex-col gap-1" : "w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 border-l-4 border-transparent transition flex flex-col gap-1";
        btn.innerHTML = `
            <div class="flex items-center gap-2">
                <svg class="w-4 h-4 ${isActive ? 'text-blue-600' : 'text-gray-400'} shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="truncate font-medium">${displayName}</span>
            </div>
            ${selectedClassFolder === 'ALL' ? `<span class="text-[10px] text-gray-400 uppercase tracking-tight ml-6">${formatPeriodName(period)}</span>` : ''}
        `;
        btn.onclick = () => showStudentDetail(uid, displayName, period);
        listContainer.appendChild(btn);
      });
    }

    function updateGrid() {
      let html = '';
      const sortedStudents = getSortedStudents();

      sortedStudents.forEach(student => {
        const uid = student.uid;
        const period = student.period;
        const displayName = student.name;
        const studentProgress = (currentLiveData[period] || {})[uid] || {};

        let allCleared = true;
        let liveScore = 0;
        let hasAnswers = false;

        for (let i = 1; i <= questions.length; i++) {
          const qObj = questions[i - 1];
          const qId = qObj.id;
          const qData = studentProgress[`q${qId}`];
          let isCorrect = false;

          if (qObj.type === 'mc') {
            if (qData && qData.selection !== undefined && qData.selection !== null && qData.selection !== "") {
              const hasKeyForQ = SECURE_ANSWER_KEY[qId] !== undefined;
              isCorrect = hasKeyForQ ? (qData.selection == SECURE_ANSWER_KEY[qId]) : true;
              hasAnswers = true;
            }
          } else {
            if (qData && qData.selection) hasAnswers = true;
            isCorrect = (qData && qData.isCorrect === true);
          }

          if (!isCorrect) allCleared = false;
          if (isCorrect) liveScore++;
        }

        let rowClass = 'bg-white';
        if (allCleared && hasAnswers) rowClass = 'cleared-row';

        let hasUnreadComment = false;
        for (let i = 1; i <= questions.length; i++) {
          const qId = questions[i - 1].id;
          if (studentProgress[`q${qId}`] && studentProgress[`q${qId}`].commentUnread === true) {
            hasUnreadComment = true; break;
          }
        }

        const unreadDot = hasUnreadComment ? `<span class="w-2.5 h-2.5 bg-orange-500 rounded-full border-2 border-white shadow-sm shrink-0" title="Unread feedback"></span>` : "";
        const isLocked = studentProgress.isLocked === true;
        const lockIcon = `<button onclick="event.stopPropagation(); toggleStudentLock('${uid}', '${period}', ${isLocked})" class="ml-1 p-1 rounded-full transition-colors shrink-0 ${isLocked ? 'text-red-500 hover:bg-red-50' : 'text-gray-300 hover:bg-gray-100'}"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${isLocked ? 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' : 'M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z'}"></path></svg></button>`;

        let nameColumnInner = `<div class="flex items-center w-full h-full transition cursor-pointer overflow-hidden" onclick="showStudentDetail('${uid}', '${displayName.replace(/'/g, "\\'")}', '${period}')"><div class="flex-1 min-w-0 text-left px-4 py-3 text-sm text-gray-700 flex items-center gap-1 overflow-hidden"><svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg><div class="flex flex-col min-w-0 flex-1"><span class="truncate font-medium">${displayName}</span>${selectedClassFolder === 'ALL' ? `<span class="text-[10px] text-gray-400 uppercase tracking-tighter">${formatPeriodName(period)}</span>` : ''}</div>${unreadDot}${lockIcon}</div></div>`;

        html += `<tr class="${rowClass} transition-colors"><td class="student-name name-column-width h-full border-b-0 border-l-0 border-t-0">${nameColumnInner}</td>`;
        html += studentProgress.submitted === true ? `<td class="score-col font-bold text-gray-800 bg-inherit">${liveScore}/${questions.length}</td>` : `<td class="score-col empty bg-inherit">-</td>`;

        for (let i = 1; i <= questions.length; i++) {
          const qObj = questions[i - 1];
          const qId = qObj.id;
          const qData = studentProgress[`q${qId}`];
          let isCorrect = false; let isAnswered = false;

          if (qObj.type === 'mc') {
            if (qData && qData.selection !== undefined && qData.selection !== null && qData.selection !== "") {
              isAnswered = true;
              const hasKeyForQ = SECURE_ANSWER_KEY[qId] !== undefined;
              isCorrect = hasKeyForQ ? (qData.selection == SECURE_ANSWER_KEY[qId]) : true;
            }
          } else {
            if (qData && qData.selection) isAnswered = true;
            isCorrect = (qData && qData.isCorrect === true);
          }

          let cellClass = "q-col bg-inherit cursor-pointer hover:bg-blue-50";
          let cellContent = "-";

          if (isAnswered) {
            if (qObj.type === 'mc') {
              const hasKeyForQ = SECURE_ANSWER_KEY[qId] !== undefined;
              if (hasKeyForQ) {
                cellClass = isCorrect ? "q-col correct bg-inherit cursor-pointer hover:bg-green-100" : "q-col incorrect bg-inherit cursor-pointer hover:bg-red-100";
                cellContent = isCorrect ? "✔" : "✘";
              } else {
                cellContent = `✎`;
              }
            } else {
              if (qData.isCorrect === true) {
                cellClass = "q-col correct bg-inherit cursor-pointer hover:bg-green-100"; cellContent = "✔";
              } else if (qData.isCorrect === false) {
                cellClass = "q-col incorrect bg-inherit cursor-pointer hover:bg-red-100"; cellContent = "✘";
              } else {
                cellClass = "q-col text-blue-600 font-bold bg-inherit cursor-pointer hover:bg-blue-50"; cellContent = `✎`;
              }
            }
          } else {
            cellClass = "q-col empty bg-inherit cursor-pointer hover:bg-blue-50";
          }

          html += `<td class="${cellClass}" onclick="showStudentDetail('${uid}', '${displayName.replace(/'/g, "\\'")}', '${period}', ${qId})">${cellContent}</td>`;
        }
        html += `</tr>`;
      });
      document.getElementById('table-body').innerHTML = html;

      if (window.renderMathInElement) renderMathInElement(document.getElementById('dashboard-table'), katexConfig);
    }

    function toggleAllLocks() {
      const sortedStudents = getSortedStudents();
      let anyUnlocked = false;

      sortedStudents.forEach(student => {
        const prog = (currentLiveData[student.period] || {})[student.uid] || {};
        if (prog.isLocked !== true) anyUnlocked = true;
      });

      const newStatus = anyUnlocked;

      sortedStudents.forEach(student => {
        const uid = student.uid;
        const period = student.period;
        const assignmentKey = classAssignmentKeys[period];

        if (!currentLiveData[period]) currentLiveData[period] = {};
        if (!currentLiveData[period][uid]) currentLiveData[period][uid] = {};
        currentLiveData[period][uid].isLocked = newStatus;

        fetch(`${databaseURL}/teacherGradebook/${period}/${assignmentKey}/${uid}.json?auth=${FIREBASE_SECRET}`, {
          method: 'PATCH', body: JSON.stringify({ isLocked: newStatus })
        });
      });
      updateGrid();
      if (activeStudentUid) renderStudentDetail(activeStudentUid, activeStudentPeriod);
    }

    function showGridView() {
      activeStudentUid = null;
      activeStudentPeriod = null;
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('sidebar-container').classList.add('hidden');
      document.getElementById('btn-return-grid').classList.add('hidden');
      document.getElementById('grid-view').classList.remove('hidden');
    }

    function showStudentDetail(uid, name, period, qId = null) {
      activeStudentUid = uid;
      activeStudentPeriod = period;
      document.getElementById('detail-name').innerText = name;
      document.getElementById('grid-view').classList.add('hidden');
      document.getElementById('sidebar-container').classList.remove('hidden');
      document.getElementById('btn-return-grid').classList.remove('hidden');
      document.getElementById('detail-view').classList.remove('hidden');
      renderSidebar(); renderStudentDetail(uid, period, qId);
    }

    function renderStudentDetail(uid, period, qIdToScroll = null) {
      const isSameStudent = (activeStudentUid === uid && activeStudentPeriod === period);
      activeStudentUid = uid;
      activeStudentPeriod = period;

      const container = document.getElementById('detail-questions');
      
      // Only clear if switching to a DIFFERENT student
      if (!isSameStudent) {
        container.innerHTML = '';
      }

      questions.forEach(q => {
        renderStudentQuestionCard(uid, period, q.id);
      });

      if (qIdToScroll) {
        setTimeout(() => {
          const target = document.getElementById(`q-card-${qIdToScroll}`);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.classList.add('ring-4', 'ring-blue-400', 'ring-opacity-50');
            setTimeout(() => target.classList.remove('ring-4', 'ring-blue-400', 'ring-opacity-50'), 2000);
          }
        }, 100);
      }
    }

    function renderStudentQuestionCard(uid, period, qId) {
      const q = questions.find(item => item.id === qId);
      if (!q) return;

      const container = document.getElementById('detail-questions');
      let card = document.getElementById(`q-card-${q.id}`);
      if (!card) {
        card = document.createElement('div');
        card.id = `q-card-${q.id}`;
        card.innerHTML = `
            <div id="q-head-${q.id}" class="mb-4 text-base font-normal leading-relaxed text-gray-900 flex justify-between items-start"></div>
            <div id="q-options-${q.id}" class="flex flex-col gap-2 pl-2"></div>
            <div id="comment-area-q${q.id}" class="hidden mt-4 pt-4 border-t border-gray-100"></div>
          `;
        container.appendChild(card);
      }

      const focusedEl = document.activeElement;
      const focusedId = focusedEl ? focusedEl.id : null;
      const isThisCommentFocused = (focusedId === `teacher-comment-input-q${q.id}`);

      const studentData = (currentLiveData[period] || {})[uid] || {};
      const qData = studentData[`q${q.id}`];
      const savedSelection = qData ? qData.selection : null;
      const isAnswered = (savedSelection !== null && savedSelection !== undefined && savedSelection !== "");
      const hasKeyForQ = SECURE_ANSWER_KEY[q.id] !== undefined;

      let cardClass = "bg-white p-6 md:p-8 rounded-lg shadow-sm border border-gray-200 transition-colors mb-4";
      let statusIcon = `<span class="text-gray-400 italic text-sm">Not answered</span>`;
      let optionsHtml = '';

      if (q.type === 'mc') {
        if (isAnswered) {
          if (hasKeyForQ) {
            if (savedSelection == SECURE_ANSWER_KEY[q.id]) {
              cardClass = "bg-green-50 p-6 md:p-8 rounded-lg shadow-sm border-2 border-green-400 mb-4"; statusIcon = `<span class="text-green-600 font-bold ml-2">✓ Correct</span>`;
            } else {
              cardClass = "bg-red-50 p-6 md:p-8 rounded-lg shadow-sm border-2 border-red-400 mb-4"; statusIcon = `<span class="text-red-600 font-bold ml-2">✗ Incorrect</span>`;
            }
          } else {
            cardClass = "bg-blue-50 p-6 md:p-8 rounded-lg shadow-sm border-2 border-blue-400 mb-4"; statusIcon = `<span class="text-blue-600 font-bold ml-2">Answered</span>`;
          }
        }
        optionsHtml = q.options.map((opt, i) => {
          const isChecked = savedSelection === i ? 'checked' : '';
          let labelClass = "flex items-start gap-3 py-2 px-2 -ml-2 rounded opacity-80 cursor-not-allowed";
          if (hasKeyForQ && i === SECURE_ANSWER_KEY[q.id]) labelClass += " border-l-4 border-green-500 bg-white font-medium shadow-sm";
          else if (!hasKeyForQ && isChecked) labelClass += " border-l-4 border-blue-500 bg-white font-medium shadow-sm";
          return `<label class="${labelClass}"><input type="radio" disabled ${isChecked} class="mt-1 w-4 h-4 text-gray-400 bg-gray-100 border-gray-300 flex-shrink-0"><span class="text-sm md:text-base leading-relaxed break-words">${opt}</span></label>`;
        }).join('');
      } else {
        if (isAnswered) {
          if (qData.isCorrect === true) {
            cardClass = "bg-green-50 p-6 md:p-8 rounded-lg shadow-sm border-2 border-green-400 mb-4"; statusIcon = `<span class="text-green-600 font-bold ml-2">✓ Marked Correct</span>`;
          } else if (qData.isCorrect === false) {
            cardClass = "bg-red-50 p-6 md:p-8 rounded-lg shadow-sm border-2 border-red-400 mb-4"; statusIcon = `<span class="text-red-600 font-bold ml-2">✗ Marked Incorrect</span>`;
          } else {
            cardClass = "bg-blue-50 p-6 md:p-8 rounded-lg shadow-sm border-2 border-blue-400 mb-4"; statusIcon = `<span class="text-blue-600 font-bold ml-2">Pending Review</span>`;
          }
        }
        const displayVal = (qData && qData.rawSelection !== undefined) ? qData.rawSelection : savedSelection;
        optionsHtml = `<div class="p-3 bg-gray-50 border border-gray-300 rounded font-bold text-blue-700 mt-2 whitespace-pre-wrap">${displayVal || '<span class="text-gray-400 font-normal italic">No answer provided</span>'}</div>`;
      }

      let currentComment = qData ? (qData.teacherComment || "") : "";
      const isCommentUnread = qData ? (qData.commentUnread === true) : false;
      let commentIconColor = (currentComment !== "") ? (isCommentUnread ? "text-orange-600 drop-shadow-sm" : "text-green-600 drop-shadow-sm") : "text-gray-300 hover:text-gray-400";

      let gradingControls = "";
      if (q.type === 'text') {
        const isCorr = qData && qData.isCorrect === true;
        const isIncorr = qData && qData.isCorrect === false;
        gradingControls = `
             <div class="flex gap-1 mt-1 justify-center">
               <button onclick="gradeTextQuestion('${uid}', '${period}', ${q.id}, true)" class="transition-all transform hover:scale-110 active:scale-95 ${isCorr ? 'text-green-600' : 'text-gray-300 hover:text-green-500'}" title="Mark Correct"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg></button>
               <button onclick="gradeTextQuestion('${uid}', '${period}', ${q.id}, false)" class="transition-all transform hover:scale-110 active:scale-95 ${isIncorr ? 'text-red-600' : 'text-gray-300 hover:text-red-500'}" title="Mark Incorrect"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg></button>
             </div>
           `;
      }

      const commentButton = `<div class="flex flex-col items-center ml-3"><button onclick="toggleTeacherCommentArea(${q.id})" class="p-1 rounded-full transition-all transform hover:scale-110 active:scale-95 ${commentIconColor} focus:ring-2 focus:ring-purple-300"><svg class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"></path></svg></button>${gradingControls}</div>`;

      card.className = cardClass;
      document.getElementById(`q-head-${q.id}`).innerHTML = `<div class="flex-1"><strong>${q.id}.</strong> ${q.text}</div><div class="shrink-0 flex items-center bg-white pl-2"><div class="text-sm whitespace-nowrap">${statusIcon}</div>${commentButton}</div>`;
      document.getElementById(`q-options-${q.id}`).innerHTML = optionsHtml;

      const commentArea = document.getElementById(`comment-area-q${q.id}`);
      const isAreaOpen = openCommentAreas.has(q.id);
      commentArea.className = isAreaOpen ? 'mt-4 pt-4 border-t border-gray-100' : 'hidden';

      if (!isThisCommentFocused) {
        commentArea.innerHTML = `<label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Teacher Comment:</label><textarea id="teacher-comment-input-q${q.id}" onkeydown="handleChemistryKeyDown(event, this)" oninput="applyChemistryLogic(this)" onblur="saveTeacherComment(this, '${uid}', '${period}', '${q.id}')" rows="4" class="w-full p-2 border border-gray-300 rounded text-sm text-blue-700 font-bold focus:ring-2 focus:ring-purple-400 outline-none min-h-[100px]" placeholder="Type a hint or feedback here...">${currentComment}</textarea><div class="mt-2 flex justify-end items-center"><span class="text-[10px] text-gray-400 italic">Saves on blur (clicking out)</span></div>`;
      }



      if (window.renderMathInElement) renderMathInElement(card, katexConfig);

      // Auto-resize the comment box if it exists
      autoResize(document.getElementById(`teacher-comment-input-q${q.id}`));
    }
    window.onload = init;
  </script>
</body>

</html>

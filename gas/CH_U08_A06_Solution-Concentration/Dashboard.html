<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
    .table-container { overflow-x: auto; background: white; max-width: 100%; height: 100%; }
    table#dashboard-table { width: max-content; border-collapse: collapse; }
    #dashboard-table th, #dashboard-table td { border: 1px solid #e5e7eb; padding: 10px; text-align: center; font-size: 13px; }
    .score-col { width: 75px; min-width: 75px; max-width: 75px; }
    .q-col { width: 55px; min-width: 55px; max-width: 55px; }
    #dashboard-table th { background-color: #f9fafb; font-weight: 600; color: #4b5563; position: sticky; top: 0; z-index: 10; }
    .name-column-width { width: 280px !important; min-width: 280px !important; max-width: 280px !important; }
    .student-name { position: sticky; left: 0; background-color: inherit; z-index: 15; text-align: left; padding: 0 !important; border-right: 3px solid #cbd5e1; box-shadow: 3px 0 6px -2px rgba(0,0,0,0.1); }
    #dashboard-table th.student-name { z-index: 25; background-color: #f9fafb; padding: 10px 0 10px 16px !important; }
    .correct { color: #16a34a; font-size: 1.2em; font-weight: bold; }
    .incorrect { color: #dc2626; font-size: 1.2em; font-weight: bold; }
    .empty { color: #9ca3af; font-weight: normal; }
    .cleared-row { background-color: #bbf7d0; }
  </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

  <div class="bg-white border-b-4 border-gray-800 px-6 py-6 shrink-0 z-30 relative shadow-sm">
    <div class="w-full max-w-6xl mx-auto relative">
      <div class="flex justify-between items-end border-b border-black pb-2 mb-6">
        <div>
          <div class="bg-gray-200 text-black text-sm font-bold px-2 py-1 inline-block border border-black mb-1 shadow-sm">Assignment Type: <?= HEADER_TYPE ?></div>
          <div class="text-lg font-semibold text-black tracking-wide mt-1"><?= HEADER_SUB ?></div>
        </div>
        
        <div class="flex items-center gap-3 shrink-0">
          <div class="flex items-center gap-2 bg-gray-50 border border-gray-300 rounded px-2 py-1 shadow-sm">
            <label class="text-xs font-bold text-gray-600 uppercase tracking-wider hidden md:block">Class:</label>
            <select id="class-filter" onchange="handleClassChange()" class="bg-transparent text-sm font-bold text-gray-800 focus:outline-none cursor-pointer">
              <option value="ALL">Loading...</option>
            </select>
          </div>
          <button id="btn-return-grid" onclick="showGridView()" class="hidden bg-gray-800 text-white hover:bg-black px-4 py-1.5 rounded font-bold text-sm transition whitespace-nowrap shadow-sm">Grid View</button>
          <span id="status-indicator" class="bg-gray-100 text-gray-500 px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-wide flex items-center gap-2 border border-gray-300 whitespace-nowrap">Connecting...</span>
        </div>
      </div>
      
      <h1 class="text-4xl md:text-5xl font-extrabold text-black text-center mb-2 tracking-tight"><?= ASSIGNMENT_TITLE ?></h1>
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden relative">
    <div id="sidebar-container" class="hidden name-column-width bg-white border-r border-gray-200 flex flex-col shrink-0 z-10 shadow-sm relative">
      <div id="student-list" class="flex-1 overflow-y-auto p-2"></div>
    </div>
    <div class="flex-1 overflow-y-auto bg-gray-50 p-0 md:p-6 relative">
      <div id="grid-view" class="bg-white md:rounded-lg md:shadow border-y md:border border-gray-200 h-full md:h-auto overflow-hidden">
        <div class="table-container md:rounded-lg h-full">
          <table id="dashboard-table">
            <thead id="table-head"></thead>
            <tbody id="table-body">
              <tr><td id="sync-msg" class="py-10 text-gray-500 bg-white text-center">Syncing roster...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div id="detail-view" class="hidden max-w-3xl mx-auto p-6 md:p-0">
        <div class="mb-6 pb-4 border-b border-gray-300">
          <h2 id="detail-name" class="text-3xl font-bold text-gray-800">Student Name</h2>
          <p class="text-sm font-medium text-gray-500 mt-1 uppercase tracking-wide">Live Student Progress Feed</p>
        </div>
        <div id="detail-questions" class="space-y-4 pb-20"></div>
      </div>
    </div>
  </div>

  <script>
    const databaseURL = "https://scigarage-default-rtdb.firebaseio.com";
    const FIREBASE_SECRET = "<?= FIREBASE_SECRET ?>";
    const ASSIGNMENT_CODE = "<?= ASSIGNMENT_CODE ?>";
    const SECURE_ANSWER_KEY = JSON.parse('<?= ANSWER_KEY ?>');
    const questions = JSON.parse('<?= QUESTIONS ?>'); 
    const NAME_MAP = JSON.parse('<?= NAME_MAP ?>');

    let currentLiveData = {};
    let activeStudentUid = null;
    let activeStudentPeriod = null; 
    let selectedClassFolder = null;
    let classAssignmentKeys = {}; 
    let activeEventSources = []; 
    let openCommentAreas = new Set();
    let relevantClasses = []; 

    function formatPeriodName(folder) {
        if (!folder || folder === 'ALL') return folder === 'ALL' ? 'All Classes' : folder;
        const match = folder.match(/_P(\d+)/i);
        return match ? `Period ${match[1]}` : folder;
    }

    function updateNestedData(root, path, value) {
        const parts = path.split('/').filter(p => p.trim() !== '');
        let current = root;
        for (let i = 0; i < parts.length - 1; i++) {
            if (!current[parts[i]]) current[parts[i]] = {};
            current = current[parts[i]];
        }
        if (parts.length > 0) {
            const lastPart = parts[parts.length - 1];
            if (value === null) {
                delete current[lastPart];
            } else {
                current[lastPart] = value;
            }
        }
    }

    function init() { 
      let headHtml = `<tr>
        <th class="student-name name-column-width">
          <div class="flex items-center justify-between pr-4">
            <span>Student Name</span>
            <button onclick="toggleAllLocks()" class="p-1 hover:bg-gray-200 rounded transition-colors text-gray-500" title="Toggle Lock for All Visible">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </button>
          </div>
        </th>
        <th class="score-col">Score</th>`;
      questions.forEach((q, idx) => { 
        const formattedId = String(q.id).replace(/^q/, 'Q');
        headHtml += `<th class="q-col">${formattedId}</th>`; 
      });
      headHtml += `</tr>`;
      document.getElementById('table-head').innerHTML = headHtml;
      
      document.getElementById('sync-msg').colSpan = questions.length + 2;
      document.getElementById('sync-msg').innerText = "Loading master class roster...";

      google.script.run.withSuccessHandler(initializeWithRoster).getDashboardRoster(); 
    }

    function initializeWithRoster(rosterData) {
      classRoster = rosterData;
      
      const targetPrefix = ASSIGNMENT_CODE.split('_')[0];
      relevantClasses = [...new Set(classRoster.map(s => s.period))].filter(c => c.startsWith(targetPrefix)).sort();
      
      const filterSelect = document.getElementById('class-filter');
      filterSelect.innerHTML = '';
      
      if (relevantClasses.length === 0) {
          document.getElementById('sync-msg').innerText = "No students found in the roster for this unit.";
          return;
      }

      if (relevantClasses.length > 1) {
          const allOpt = document.createElement('option');
          allOpt.value = 'ALL'; allOpt.innerText = 'All Classes';
          filterSelect.appendChild(allOpt);
          selectedClassFolder = 'ALL';
      }

      relevantClasses.forEach((c, idx) => {
          const opt = document.createElement('option');
          opt.value = c; opt.innerText = formatPeriodName(c);
          filterSelect.appendChild(opt);
          if (!selectedClassFolder && idx === 0) { selectedClassFolder = c; }
      });
      
      if (selectedClassFolder) filterSelect.value = selectedClassFolder;
      handleClassChange();
    }

    function handleClassChange() {
        const oldSelection = selectedClassFolder;
        selectedClassFolder = document.getElementById('class-filter').value;
        
        if (activeStudentUid && oldSelection !== selectedClassFolder) {
            const newSorted = getSortedStudents();
            if (newSorted.length > 0) {
                showStudentDetail(newSorted[0].uid, newSorted[0].name, newSorted[0].period);
            } else {
                showGridView();
            }
        }

        currentLiveData = {}; 
        classAssignmentKeys = {};
        activeEventSources.forEach(es => es.close());
        activeEventSources = [];
        
        document.getElementById('table-body').innerHTML = `<tr><td colspan="${questions.length + 2}" class="py-10 text-gray-500 bg-white text-center">Fetching live assignment data...</td></tr>`;
        
        const foldersToFetch = selectedClassFolder === 'ALL' ? relevantClasses : [selectedClassFolder];
        
        let fetchCount = 0;
        foldersToFetch.forEach(folder => {
            const tgUrl = `${databaseURL}/teacherGradebook/${folder}.json?auth=${FIREBASE_SECRET}&shallow=true`;
            fetch(tgUrl).then(r=>r.json()).then(keys => {
                const classroomId = folder.split('_').pop();
                const provisionalKey = `${ASSIGNMENT_CODE}_${classroomId}`;
                const key = Object.keys(keys || {}).find(k => k.startsWith(ASSIGNMENT_CODE) && k !== provisionalKey) || provisionalKey;
                
                classAssignmentKeys[folder] = key;
                startLiveDatabaseListener(folder, key);
                
                fetchCount++;
                if (fetchCount === foldersToFetch.length) {
                    const indicator = document.getElementById('status-indicator');
                    indicator.className = "bg-green-100 text-green-700 px-3 py-1.5 border border-green-300 rounded-full text-xs font-bold uppercase tracking-wide flex items-center gap-2 shadow-sm whitespace-nowrap";
                    indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> LIVE (${formatPeriodName(selectedClassFolder)})`;
                }
            });
        });
    }

    function startLiveDatabaseListener(classFolder, assignmentKey) {
        const url = `${databaseURL}/teacherGradebook/${classFolder}/${assignmentKey}.json?auth=${FIREBASE_SECRET}`;
        const es = new EventSource(url);
        activeEventSources.push(es);
        
        if (!currentLiveData[classFolder]) currentLiveData[classFolder] = {};

        const handleFirebaseEvent = function(e) {
           const payload = JSON.parse(e.data);
           const path = payload.path || "";
           const data = payload.data;

           if (e.type === 'put') {
               if (path === "/") {
                  currentLiveData[classFolder] = data || {};
               } else {
                  updateNestedData(currentLiveData[classFolder], path, data);
               }
           } else if (e.type === 'patch') {
               for (let key in data) {
                   const fullPath = path === '/' ? '/' + key : path + '/' + key;
                   updateNestedData(currentLiveData[classFolder], fullPath, data[key]);
               }
           }

           updateGrid();
           if (activeStudentUid && activeStudentPeriod === classFolder) {
               const path = payload.path || "";
               if (path === "/" || path.startsWith("/" + activeStudentUid)) {
                   renderStudentDetail(activeStudentUid, activeStudentPeriod);
               }
           }
        };

        es.addEventListener('put', handleFirebaseEvent);
        es.addEventListener('patch', handleFirebaseEvent);
    }

    function toggleStudentLock(uid, period, currentStatus) {
      const newStatus = !currentStatus;
      const assignmentKey = classAssignmentKeys[period];
      
      if (!currentLiveData[period]) currentLiveData[period] = {};
      if (!currentLiveData[period][uid]) currentLiveData[period][uid] = {};
      currentLiveData[period][uid].isLocked = newStatus;
      
      updateGrid(); 
      if (activeStudentUid === uid && activeStudentPeriod === period) renderStudentDetail(uid, period);

      fetch(`${databaseURL}/teacherGradebook/${period}/${assignmentKey}/${uid}.json?auth=${FIREBASE_SECRET}`, {
        method: 'PATCH', body: JSON.stringify({ isLocked: newStatus })
      });
    }

    function saveTeacherComment(el, uid, period, prefix) {
      if (!el || !el.isConnected) return;
      const newText = el.value.trim();
      const assignmentKey = classAssignmentKeys[period];
      const studentData = (currentLiveData[period] || {})[uid] || {};
      const qData = studentData[prefix] || {};
      const oldText = (qData.teacherComment || "").trim();
      
      if (newText !== oldText) {
        const payload = { teacherComment: newText, commentUnread: true };
        fetch(`${databaseURL}/teacherGradebook/${period}/${assignmentKey}/${uid}/${prefix}.json?auth=${FIREBASE_SECRET}`, {
          method: 'PATCH', body: JSON.stringify(payload)
        });
      }
    }

    function toggleTeacherCommentArea(prefix) {
      const area = document.getElementById(`comment-area-${prefix}`);
      if (!area) return;
      const isVisibleNow = !area.classList.toggle('hidden');
      if (isVisibleNow) {
        openCommentAreas.add(prefix);
        const input = document.getElementById(`teacher-comment-input-${prefix}`);
        if (input) { input.focus(); const val = input.value; input.value = ''; input.value = val; }
      } else {
        openCommentAreas.delete(prefix);
        const input = document.getElementById(`teacher-comment-input-${prefix}`);
        if (activeStudentUid && input) saveTeacherComment(input, activeStudentUid, activeStudentPeriod, prefix);
      }
    }

    function getSortedStudents() {
        let filtered = selectedClassFolder === 'ALL' ? classRoster : classRoster.filter(s => s.period === selectedClassFolder);
        return filtered.sort((a, b) => {
            if (selectedClassFolder === 'ALL') {
                const periodCompare = a.period.localeCompare(b.period);
                if (periodCompare !== 0) return periodCompare;
            }
            return a.name.localeCompare(b.name);
        });
    }

    function renderSidebar() {
      const listContainer = document.getElementById('student-list');
      listContainer.innerHTML = '';
      const sortedStudents = getSortedStudents();

      sortedStudents.forEach(student => {
        const uid = student.uid;
        const period = student.period;
        const displayName = student.name;
        const isActive = (uid === activeStudentUid && period === activeStudentPeriod);
        
        const btn = document.createElement('button');
        btn.className = isActive ? "w-full text-left px-4 py-3 text-sm text-blue-800 bg-blue-100 font-bold border-l-4 border-blue-600 transition flex flex-col gap-1" : "w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 border-l-4 border-transparent transition flex flex-col gap-1";
        btn.innerHTML = `
            <div class="flex items-center gap-2">
                <svg class="w-4 h-4 ${isActive ? 'text-blue-600' : 'text-gray-400'} shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="truncate font-medium">${displayName}</span>
            </div>
            ${selectedClassFolder === 'ALL' ? `<span class="text-[10px] text-gray-400 uppercase tracking-tight ml-6">${formatPeriodName(period)}</span>` : ''}
        `;
        btn.onclick = () => showStudentDetail(uid, displayName, period);
        listContainer.appendChild(btn);
      });
    }

    function updateGrid() {
      let html = '';
      const sortedStudents = getSortedStudents();
      const hasAnswerKey = Object.keys(SECURE_ANSWER_KEY).length > 0;
      
      sortedStudents.forEach(student => {
        const uid = student.uid;
        const period = student.period;
        const displayName = student.name;
        
        const studentProgress = (currentLiveData[period] || {})[uid] || {};
        
        let allCleared = true; 
        let liveScore = 0;
        let hasAnswers = false;
        
        questions.forEach(q => {
          const qKey = String(q.id).startsWith('q') ? q.id : `q${q.id}`;
          const qData = studentProgress[qKey];
          let isCorrect = false;
          if (qData && qData.selection !== undefined && qData.selection !== null && qData.selection !== "") {
             if (hasAnswerKey) {
                 isCorrect = (qData.selection == SECURE_ANSWER_KEY[q.id]);
             } else {
                 isCorrect = true; 
             }
             hasAnswers = true;
          }
          if (!isCorrect) allCleared = false;
          if (isCorrect) liveScore++;
        });
        
        let rowClass = 'bg-white';
        if (allCleared && hasAnswers) rowClass = 'cleared-row';

        let hasUnreadComment = false;
        questions.forEach(q => {
          const qKey = String(q.id).startsWith('q') ? q.id : `q${q.id}`;
          const prefix = qKey.split('_')[0];
          if ((studentProgress[qKey] && studentProgress[qKey].commentUnread === true) || 
              (studentProgress[prefix] && studentProgress[prefix].commentUnread === true)) {
            hasUnreadComment = true;
          }
        });
        
        const unreadDot = hasUnreadComment ? `<span class="w-2.5 h-2.5 bg-orange-500 rounded-full border-2 border-white shadow-sm shrink-0" title="Unread feedback"></span>` : "";
        const isLocked = studentProgress.isLocked === true;
        const lockIcon = `<button onclick="event.stopPropagation(); toggleStudentLock('${uid}', '${period}', ${isLocked})" class="ml-1 p-1 rounded-full transition-colors shrink-0 ${isLocked ? 'text-red-500 hover:bg-red-50' : 'text-gray-300 hover:bg-gray-100'}"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${isLocked ? 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' : 'M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z'}"></path></svg></button>`;

        let nameColumnInner = `<div class="flex items-center w-full h-full hover:bg-blue-50 transition cursor-pointer overflow-hidden" onclick="showStudentDetail('${uid}', '${displayName.replace(/'/g, "\\'")}', '${period}')"><div class="flex-1 min-w-0 text-left px-4 py-3 text-sm text-gray-700 flex items-center gap-1 overflow-hidden"><svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg><div class="flex flex-col min-w-0 flex-1"><span class="truncate font-medium">${displayName}</span>${selectedClassFolder === 'ALL' ? `<span class="text-[10px] text-gray-400 uppercase tracking-tighter">${formatPeriodName(period)}</span>` : ''}</div>${unreadDot}${lockIcon}</div></div>`;

        html += `<tr class="${rowClass} hover:bg-gray-50 transition-colors"><td class="student-name name-column-width h-full border-b-0 border-l-0 border-t-0">${nameColumnInner}</td>`;
        html += studentProgress.submitted === true ? `<td class="score-col font-bold text-gray-800 bg-inherit">${liveScore}/${questions.length}</td>` : `<td class="score-col empty bg-inherit">-</td>`;
        
        questions.forEach(q => {
          const qKey = String(q.id).startsWith('q') ? q.id : `q${q.id}`;
          const qData = studentProgress[qKey];
          let isCorrect = false; let isAnswered = false;
          
          if (qData && qData.selection !== undefined && qData.selection !== null && qData.selection !== "") {
             isAnswered = true; 
             if (hasAnswerKey) {
                 isCorrect = (qData.selection == SECURE_ANSWER_KEY[q.id]);
             } else {
                 isCorrect = true;
             }
          }
          
          const cellClass = !isAnswered ? "q-col empty bg-inherit cursor-pointer hover:bg-blue-50" : (isCorrect ? "q-col correct bg-inherit cursor-pointer hover:bg-green-100" : "q-col incorrect bg-inherit cursor-pointer hover:bg-red-100");
          let cellContent = "-";
          if (isAnswered) {
              if (hasAnswerKey) {
                  cellContent = isCorrect ? "✔" : "✘";
              } else {
                  cellContent = `<div class="flex justify-center"><span class="w-3 h-3 bg-blue-600 rounded-full shadow-sm"></span></div>`;
              }
          }
          html += `<td class="${cellClass}" onclick="showStudentDetail('${uid}', '${displayName.replace(/'/g, "\\'")}', '${period}', '${q.id}')">${cellContent}</td>`;
        });
        html += `</tr>`;
      });
      document.getElementById('table-body').innerHTML = html;
    }

    function toggleAllLocks() {
      const sortedStudents = getSortedStudents();
      let anyUnlocked = false;
      
      sortedStudents.forEach(student => {
        const prog = (currentLiveData[student.period] || {})[student.uid] || {};
        if (prog.isLocked !== true) anyUnlocked = true;
      });
      
      const newStatus = anyUnlocked;
      
      sortedStudents.forEach(student => {
          const uid = student.uid;
          const period = student.period;
          const assignmentKey = classAssignmentKeys[period];
          
          if (!currentLiveData[period]) currentLiveData[period] = {};
          if (!currentLiveData[period][uid]) currentLiveData[period][uid] = {};
          currentLiveData[period][uid].isLocked = newStatus;
          
          fetch(`${databaseURL}/teacherGradebook/${period}/${assignmentKey}/${uid}.json?auth=${FIREBASE_SECRET}`, {
            method: 'PATCH', body: JSON.stringify({ isLocked: newStatus })
          });
      });
      updateGrid();
      if (activeStudentUid) renderStudentDetail(activeStudentUid, activeStudentPeriod);
    }

    function showGridView() {
      activeStudentUid = null;
      activeStudentPeriod = null;
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('sidebar-container').classList.add('hidden');
      document.getElementById('btn-return-grid').classList.add('hidden');
      document.getElementById('grid-view').classList.remove('hidden');
    }

    function showStudentDetail(uid, name, period, qId = null) {
      activeStudentUid = uid; 
      activeStudentPeriod = period;
      document.getElementById('detail-name').innerText = name;
      document.getElementById('grid-view').classList.add('hidden');
      document.getElementById('sidebar-container').classList.remove('hidden');
      document.getElementById('btn-return-grid').classList.remove('hidden');
      document.getElementById('detail-view').classList.remove('hidden');
      renderSidebar(); renderStudentDetail(uid, period, qId);
    }

    function renderStudentDetail(uid, period, qIdToScroll = null) {
      const container = document.getElementById('detail-questions');
      const focusedEl = document.activeElement;
      const focusedId = focusedEl ? focusedEl.id : null;
      const selectionStart = focusedEl ? focusedEl.selectionStart : null;
      const selectionEnd = focusedEl ? focusedEl.selectionEnd : null;
      
      let preservedValue = null, preservedPrefix = null;
      if (focusedId && focusedId.startsWith('teacher-comment-input-')) {
          preservedValue = focusedEl.value; preservedPrefix = focusedId.replace('teacher-comment-input-', '');
      }

      container.innerHTML = '';
      const studentData = (currentLiveData[period] || {})[uid] || {};

      // Group questions by prefix
      const groups = [];
      const prefixMap = {};
      questions.forEach(q => {
        const prefix = q.id.split('_')[0];
        if (!prefixMap[prefix]) {
          prefixMap[prefix] = { prefix, items: [], title: q.text.split(':')[0] };
          groups.push(prefixMap[prefix]);
        }
        prefixMap[prefix].items.push(q);
      });

      groups.forEach(group => {
        const prefix = group.prefix;
        const qData = studentData[prefix] || {}; // Shared data for comments
        const isCommentUnread = qData.commentUnread === true;
        let currentComment = qData.teacherComment || "";
        if (prefix === preservedPrefix) currentComment = preservedValue;

        let answersHtml = '';
        let hasAnyAnswer = false;

        group.items.forEach(q => {
          const qKey = q.id;
          const studentQData = studentData[qKey] || {};
          const val = studentQData.selection;
          if (val !== undefined && val !== null && String(val).trim() !== "") hasAnyAnswer = true;
          
          answersHtml += `
            <div class="flex-1 min-w-[140px] p-2 bg-gray-50 border border-gray-200 rounded">
              <div class="text-[9px] text-gray-400 uppercase font-black mb-1 truncate" title="${q.text}">${q.text}</div>
              <div class="text-sm font-bold text-blue-700 whitespace-pre-wrap">${val || '<span class="text-gray-300 font-normal italic text-xs">Empty</span>'}</div>
            </div>
          `;
        });

        let cardClass = "bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-4 relative overflow-hidden";
        if (hasAnyAnswer) cardClass = "bg-blue-50 p-6 rounded-lg shadow-sm border-2 border-blue-200 mb-4 relative overflow-hidden";

        let commentIconColor = (currentComment !== "") ? (isCommentUnread ? "text-orange-500" : "text-green-500") : "text-gray-300";
        const commentButton = `<button onclick="toggleTeacherCommentArea('${prefix}')" class="p-1 rounded-full hover:scale-110 transition-transform ${commentIconColor}"><svg class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20"><path d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7z"></path></svg></button>`;

        const isAreaOpen = openCommentAreas.has(prefix);
        const commentAreaHtml = `
          <div id="comment-area-${prefix}" class="${isAreaOpen ? '' : 'hidden'} mt-4 pt-4 border-t border-gray-100">
            <textarea id="teacher-comment-input-${prefix}" onblur="saveTeacherComment(this, '${uid}', '${period}', '${prefix}')" rows="2" class="w-full p-2 border border-gray-300 rounded text-sm font-bold text-blue-800 outline-none focus:ring-2 focus:ring-blue-400" placeholder="Feedback...">${currentComment}</textarea>
          </div>
        `;

        container.innerHTML += `
          <div id="q-card-${prefix}" class="${cardClass}">
            <div class="flex justify-between items-center mb-4">
              <h3 class="font-bold text-gray-800 uppercase text-[10px] tracking-widest">${group.title}</h3>
              ${commentButton}
            </div>
            <div class="flex flex-wrap gap-2">${answersHtml}</div>
            ${commentAreaHtml}
          </div>
        `;
      });

      if (focusedId) {
        const el = document.getElementById(focusedId);
        if (el) { el.focus(); if (selectionStart !== null) el.setSelectionRange(selectionStart, selectionEnd); }
      }

      if (qIdToScroll) {
        const prefix = qIdToScroll.split('_')[0];
        setTimeout(() => {
          const target = document.getElementById(`q-card-${prefix}`);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.classList.add('ring-4', 'ring-blue-400', 'ring-opacity-50');
            setTimeout(() => target.classList.remove('ring-4', 'ring-blue-400', 'ring-opacity-50'), 2000);
          }
        }, 100);
      }
    }
    window.onload = init;
  </script>
</body>
</html>

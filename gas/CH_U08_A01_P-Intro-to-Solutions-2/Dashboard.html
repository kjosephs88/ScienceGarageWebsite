<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
    .table-container { overflow-x: auto; background: white; max-width: 100%; height: 100%; }
    table { width: max-content; border-collapse: collapse; }
    th, td { border: 1px solid #e5e7eb; padding: 10px; text-align: center; font-size: 13px; }
    .score-col { width: 75px; min-width: 75px; max-width: 75px; }
    .q-col { width: 55px; min-width: 55px; max-width: 55px; }
    th { background-color: #f9fafb; font-weight: 600; color: #4b5563; position: sticky; top: 0; z-index: 10; }
    .name-column-width { width: 280px !important; min-width: 280px !important; max-width: 280px !important; }
    .student-name { position: sticky; left: 0; background-color: inherit; z-index: 15; text-align: left; padding: 0 !important; border-right: 3px solid #cbd5e1; box-shadow: 3px 0 6px -2px rgba(0,0,0,0.1); }
    th.student-name { z-index: 25; background-color: #f9fafb; padding: 10px 0 10px 16px !important; }
    .correct { color: #16a34a; font-size: 1.2em; font-weight: bold; }
    .incorrect { color: #dc2626; font-size: 1.2em; font-weight: bold; }
    .empty { color: #9ca3af; font-weight: normal; }
    .cleared-row { background-color: #bbf7d0; }
  </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

  <div class="bg-white border-b-4 border-gray-800 px-6 py-6 shrink-0 z-30 relative shadow-sm">
    <div class="w-full max-w-6xl mx-auto relative">
      <div class="flex justify-between items-end border-b border-black pb-2 mb-6">
        <div>
          <div class="bg-gray-200 text-black text-sm font-bold px-2 py-1 inline-block border border-black mb-1 shadow-sm">Assignment Type: <?= HEADER_TYPE ?></div>
          <div class="text-lg font-semibold text-black tracking-wide mt-1"><?= HEADER_SUB ?></div>
        </div>
        
        <div class="flex items-center gap-3 shrink-0">
          <div class="flex items-center gap-2 bg-gray-50 border border-gray-300 rounded px-2 py-1 shadow-sm">
            <label class="text-xs font-bold text-gray-600 uppercase tracking-wider hidden md:block">Class:</label>
            <select id="class-filter" onchange="handleClassChange()" class="bg-transparent text-sm font-bold text-gray-800 focus:outline-none cursor-pointer">
              <option value="ALL">Loading...</option>
            </select>
          </div>
          <button id="btn-return-grid" onclick="showGridView()" class="hidden bg-gray-800 text-white hover:bg-black px-4 py-1.5 rounded font-bold text-sm transition whitespace-nowrap shadow-sm">Grid View</button>
          <span id="status-indicator" class="bg-gray-100 text-gray-500 px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-wide flex items-center gap-2 border border-gray-300 whitespace-nowrap">Connecting...</span>
        </div>
      </div>
      
      <h1 class="text-4xl md:text-5xl font-extrabold text-black text-center mb-2 tracking-tight"><?= ASSIGNMENT_TITLE ?></h1>
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden relative">
    <div id="sidebar-container" class="hidden name-column-width bg-white border-r border-gray-200 flex flex-col shrink-0 z-10 shadow-sm relative">
      <div id="student-list" class="flex-1 overflow-y-auto p-2"></div>
    </div>
    <div class="flex-1 overflow-y-auto bg-gray-50 p-0 md:p-6 relative">
      <div id="grid-view" class="bg-white md:rounded-lg md:shadow border-y md:border border-gray-200 h-full md:h-auto overflow-hidden">
        <div class="table-container md:rounded-lg h-full">
          <table id="dashboard-table">
            <thead id="table-head"></thead>
            <tbody id="table-body">
              <tr><td id="sync-msg" class="py-10 text-gray-500 bg-white text-center">Syncing roster...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div id="detail-view" class="hidden max-w-3xl mx-auto p-6 md:p-0">
        <div class="mb-6 pb-4 border-b border-gray-300">
          <h2 id="detail-name" class="text-3xl font-bold text-gray-800">Student Name</h2>
          <p class="text-sm font-medium text-gray-500 mt-1 uppercase tracking-wide">Live Student Progress Feed</p>
        </div>
        <div id="detail-questions" class="space-y-4 pb-20"></div>
      </div>
    </div>
  </div>

  <script>
    const databaseURL = "https://scigarage-default-rtdb.firebaseio.com";
    const FIREBASE_SECRET = "<?= FIREBASE_SECRET ?>";
    const ASSIGNMENT_CODE = "<?= ASSIGNMENT_CODE ?>";
    const SECURE_ANSWER_KEY = JSON.parse('<?= ANSWER_KEY ?>');
    const questions = JSON.parse('<?= QUESTIONS ?>'); 
    const NAME_MAP = JSON.parse('<?= NAME_MAP ?>');

    let currentLiveData = {};
    let activeStudentUid = null;
    let selectedClassFolder = null;
    let currentAssignmentKey = "";
    let activeEventSource = null;
    let openCommentAreas = new Set();

    // HELPER FUNCTION: Safely traverses and merges deep Firebase payload paths for true real-time SSE updates
    function updateNestedData(root, path, value) {
        const parts = path.split('/').filter(p => p.trim() !== '');
        let current = root;
        for (let i = 0; i < parts.length - 1; i++) {
            if (!current[parts[i]]) current[parts[i]] = {};
            current = current[parts[i]];
        }
        if (parts.length > 0) {
            const lastPart = parts[parts.length - 1];
            if (value === null) {
                delete current[lastPart];
            } else {
                current[lastPart] = value;
            }
        }
    }

    function init() { 
      let headHtml = `<tr>
        <th class="student-name name-column-width">
          <div class="flex items-center justify-between pr-4">
            <span>Student Name</span>
            <button onclick="toggleAllLocks()" class="p-1 hover:bg-gray-200 rounded transition-colors text-gray-500" title="Toggle Lock for All Visible">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </button>
          </div>
        </th>
        <th class="score-col">Score</th>`;
      questions.forEach(q => { headHtml += `<th class="q-col">Q${q.id}</th>`; });
      headHtml += `</tr>`;
      document.getElementById('table-head').innerHTML = headHtml;
      
      document.getElementById('sync-msg').colSpan = questions.length + 2;
      document.getElementById('sync-msg').innerText = "Loading master class roster...";

      // Fetch the roster BEFORE doing anything else
      google.script.run.withSuccessHandler(initializeWithRoster).getDashboardRoster(); 
    }

    function initializeWithRoster(rosterData) {
      classRoster = rosterData;
      
      // Look at the roster to figure out which classes exist for this unit (e.g., CH_P6, CH_P8)
      const targetPrefix = ASSIGNMENT_CODE.split('_')[0];
      const relevantClasses = [...new Set(classRoster.map(s => s.period))].filter(c => c.startsWith(targetPrefix)).sort();
      
      const filterSelect = document.getElementById('class-filter');
      filterSelect.innerHTML = '';
      
      if (relevantClasses.length === 0) {
          document.getElementById('sync-msg').innerText = "No students found in the roster for this unit.";
          return;
      }

      relevantClasses.forEach((c, idx) => {
          const opt = document.createElement('option');
          opt.value = c; opt.innerText = c;
          filterSelect.appendChild(opt);
          if (idx === 0) { selectedClassFolder = c; }
      });
      
      // Now that the roster is loaded and dropdown is built, connect to the gradebook
      handleClassChange();
    }

    function handleClassChange() {
        selectedClassFolder = document.getElementById('class-filter').value;
        currentLiveData = {}; // Clear old data so classes don't bleed together
        document.getElementById('table-body').innerHTML = `<tr><td colspan="${questions.length + 2}" class="py-10 text-gray-500 bg-white text-center">Fetching live assignment data...</td></tr>`;
        
        const tgUrl = `${databaseURL}/teacherGradebook/${selectedClassFolder}.json?auth=${FIREBASE_SECRET}&shallow=true`;
        
        fetch(tgUrl).then(r=>r.json()).then(keys => {
            const classroomId = selectedClassFolder.split('_').pop();
            const provisionalKey = `${ASSIGNMENT_CODE}_${classroomId}`;
            currentAssignmentKey = Object.keys(keys || {}).find(k => k.startsWith(ASSIGNMENT_CODE) && k !== provisionalKey) || provisionalKey;
            
            startLiveDatabaseListener();
        });
    }

    function startLiveDatabaseListener() {
        if (activeEventSource) activeEventSource.close();

        const indicator = document.getElementById('status-indicator');
        indicator.className = "bg-green-100 text-green-700 px-3 py-1.5 border border-green-300 rounded-full text-xs font-bold uppercase tracking-wide flex items-center gap-2 shadow-sm whitespace-nowrap";
        indicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> LIVE`;

        const url = `${databaseURL}/teacherGradebook/${selectedClassFolder}/${currentAssignmentKey}.json?auth=${FIREBASE_SECRET}`;
        activeEventSource = new EventSource(url);
        
        // DEEP MERGE EVENT LISTENER (Fix 1)
        const handleFirebaseEvent = function(e) {
           const payload = JSON.parse(e.data);
           const path = payload.path || "";
           const data = payload.data;

           if (e.type === 'put') {
               if (path === "/") {
                  currentLiveData = data || {};
               } else {
                  updateNestedData(currentLiveData, path, data);
               }
           } else if (e.type === 'patch') {
               for (let key in data) {
                   const fullPath = path === '/' ? '/' + key : path + '/' + key;
                   updateNestedData(currentLiveData, fullPath, data[key]);
               }
           }

           updateGrid();
           if (activeStudentUid) renderStudentDetail(activeStudentUid);
        };

        activeEventSource.addEventListener('put', handleFirebaseEvent);
        activeEventSource.addEventListener('patch', handleFirebaseEvent);
    }

    function toggleStudentLock(uid, currentStatus) {
      const newStatus = !currentStatus;
      
      // Update local state instantly for UI response (Fix 2)
      if (!currentLiveData[uid]) currentLiveData[uid] = {};
      currentLiveData[uid].isLocked = newStatus;
      updateGrid(); 
      if (activeStudentUid === uid) renderStudentDetail(uid);

      fetch(`${databaseURL}/teacherGradebook/${selectedClassFolder}/${currentAssignmentKey}/${uid}.json?auth=${FIREBASE_SECRET}`, {
        method: 'PATCH', body: JSON.stringify({ isLocked: newStatus })
      });
    }

 

function saveTeacherComment(uid, qId) {
      const el = document.getElementById(`teacher-comment-input-q${qId}`);
      if (!el) return;
      
      const newText = el.value.trim();
      
      // Grab the existing saved comment from our live data
      const studentData = currentLiveData[uid] || {};
      const qData = studentData[`q${qId}`] || {};
      const oldText = (qData.teacherComment || "").trim();
      
      // ONLY push to Firebase if the text was actually modified
      if (newText !== oldText) {
        const payload = { 
          teacherComment: newText, 
          commentUnread: true 
        };
        
        fetch(`${databaseURL}/teacherGradebook/${selectedClassFolder}/${currentAssignmentKey}/${uid}/q${qId}.json?auth=${FIREBASE_SECRET}`, {
          method: 'PATCH', 
          body: JSON.stringify(payload)
        });
      }
    }

    function toggleTeacherCommentArea(qId) {
      const area = document.getElementById(`comment-area-q${qId}`);
      if (!area) return;
      const isVisibleNow = !area.classList.toggle('hidden');
      
      if (isVisibleNow) {
        openCommentAreas.add(qId);
        const input = document.getElementById(`teacher-comment-input-q${qId}`);
        if (input) { input.focus(); const val = input.value; input.value = ''; input.value = val; }
      } else {
        openCommentAreas.delete(qId);
        if (activeStudentUid) saveTeacherComment(activeStudentUid, qId);
      }
    }

    
    function getSortedStudents() {
        // Filter the master roster for the currently selected class period
        let filtered = classRoster.filter(s => s.period === selectedClassFolder);
        // Sort them alphabetically by their real name
        return filtered.sort((a, b) => a.name.localeCompare(b.name));
    }

    function renderSidebar() {
      const listContainer = document.getElementById('student-list');
      listContainer.innerHTML = '';
      const sortedStudents = getSortedStudents();

      sortedStudents.forEach(student => {
        const uid = student.uid;
        const displayName = student.name;
        const isActive = (uid === activeStudentUid);
        
        const btn = document.createElement('button');
        btn.className = isActive ? "w-full text-left px-4 py-3 text-sm text-blue-800 bg-blue-100 font-bold border-l-4 border-blue-600 transition flex items-center gap-2" : "w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-700 border-l-4 border-transparent transition flex items-center gap-2";
        btn.innerHTML = `<svg class="w-4 h-4 ${isActive ? 'text-blue-600' : 'text-gray-400'} shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg><span class="truncate font-medium">${displayName}</span>`;
        btn.onclick = () => showStudentDetail(uid, displayName);
        listContainer.appendChild(btn);
      });
    }

    function updateGrid() {
      let html = '';
      const sortedStudents = getSortedStudents();
      
      sortedStudents.forEach(student => {
        const uid = student.uid;
        const displayName = student.name;
        
        // Grab progress if it exists, otherwise default to an empty object
        const studentProgress = currentLiveData[uid] || {};
        
        let allCleared = true; 
        let liveScore = 0;
        let hasAnswers = false;
        
        for (let i = 1; i <= questions.length; i++) {
          const qData = studentProgress[`q${i}`];
          let isCorrect = false;
          if (qData && qData.selection !== undefined && qData.selection !== null && qData.selection !== "") {
             isCorrect = (qData.selection == SECURE_ANSWER_KEY[i]);
             hasAnswers = true;
          }
          if (!isCorrect) allCleared = false;
          if (isCorrect) liveScore++;
        }
        
        let rowClass = 'bg-white';
        // Only turn it green if they have cleared it AND actually answered a question
        if (allCleared && hasAnswers) rowClass = 'cleared-row';

        let hasUnreadComment = false;
        for (let i = 1; i <= questions.length; i++) {
          if (studentProgress[`q${i}`] && studentProgress[`q${i}`].commentUnread === true) {
            hasUnreadComment = true; break;
          }
        }
        
        const unreadDot = hasUnreadComment ? `<span class="w-2.5 h-2.5 bg-orange-500 rounded-full border-2 border-white shadow-sm shrink-0" title="Unread feedback"></span>` : "";
        const isLocked = studentProgress.isLocked === true;
        const lockIcon = `<button onclick="event.stopPropagation(); toggleStudentLock('${uid}', ${isLocked})" class="ml-1 p-1 rounded-full transition-colors shrink-0 ${isLocked ? 'text-red-500 hover:bg-red-50' : 'text-gray-300 hover:bg-gray-100'}"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${isLocked ? 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z' : 'M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z'}"></path></svg></button>`;

        let nameColumnInner = `<div class="flex items-center w-full h-full hover:bg-blue-50 transition cursor-pointer overflow-hidden" onclick="showStudentDetail('${uid}', '${displayName.replace(/'/g, "\\'")}')"><div class="flex-1 min-w-0 text-left px-4 py-3 text-sm text-gray-700 flex items-center gap-1 overflow-hidden"><svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg><span class="truncate font-medium flex-1">${displayName}</span>${unreadDot}${lockIcon}</div></div>`;

        html += `<tr class="${rowClass} hover:bg-gray-50 transition-colors"><td class="student-name name-column-width h-full border-b-0 border-l-0 border-t-0">${nameColumnInner}</td>`;
        html += studentProgress.submitted === true ? `<td class="score-col font-bold text-gray-800 bg-inherit">${liveScore}/${questions.length}</td>` : `<td class="score-col empty bg-inherit">-</td>`;
        
        for(let i = 1; i <= questions.length; i++) {
          const qData = studentProgress[`q${i}`];
          let isCorrect = false; let isAnswered = false;
          
          if (qData && qData.selection !== undefined && qData.selection !== null && qData.selection !== "") {
             isAnswered = true; isCorrect = (qData.selection == SECURE_ANSWER_KEY[i]);
          }
          if (!isAnswered) html += `<td class="q-col empty bg-inherit">-</td>`; 
          else if (isCorrect) html += `<td class="q-col correct bg-inherit">✔</td>`; 
          else html += `<td class="q-col incorrect bg-inherit">✘</td>`; 
        }
        html += `</tr>`;
      });
      document.getElementById('table-body').innerHTML = html;
    }

    function toggleAllLocks() {
      const sortedStudents = getSortedStudents();
      let anyUnlocked = false;
      
      // Check if any visible student in the class roster is currently unlocked
      sortedStudents.forEach(student => {
        const prog = currentLiveData[student.uid] || {};
        if (prog.isLocked !== true) anyUnlocked = true;
      });
      
      const newStatus = anyUnlocked;
      
      // Apply the lock/unlock state to EVERY student in the roster
      sortedStudents.forEach(student => {
          const uid = student.uid;
          if (!currentLiveData[uid]) currentLiveData[uid] = {};
          currentLiveData[uid].isLocked = newStatus;
          
          fetch(`${databaseURL}/teacherGradebook/${selectedClassFolder}/${currentAssignmentKey}/${uid}.json?auth=${FIREBASE_SECRET}`, {
            method: 'PATCH', body: JSON.stringify({ isLocked: newStatus })
          });
      });
      updateGrid();
    }


    function showGridView() {
      activeStudentUid = null;
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('sidebar-container').classList.add('hidden');
      document.getElementById('btn-return-grid').classList.add('hidden');
      document.getElementById('grid-view').classList.remove('hidden');
    }

    function showStudentDetail(uid, name) {
      activeStudentUid = uid; document.getElementById('detail-name').innerText = name;
      document.getElementById('grid-view').classList.add('hidden');
      document.getElementById('sidebar-container').classList.remove('hidden');
      document.getElementById('btn-return-grid').classList.remove('hidden');
      document.getElementById('detail-view').classList.remove('hidden');
      renderSidebar(); renderStudentDetail(uid);
    }

    function renderStudentDetail(uid) {
      const container = document.getElementById('detail-questions');
      const focusedEl = document.activeElement;
      const focusedId = focusedEl ? focusedEl.id : null;
      const selectionStart = focusedEl ? focusedEl.selectionStart : null;
      const selectionEnd = focusedEl ? focusedEl.selectionEnd : null;
      
      let preservedValue = null; let preservedQId = null;
      if (focusedId && focusedId.startsWith('teacher-comment-input-q')) {
          preservedValue = focusedEl.value; preservedQId = parseInt(focusedId.replace('teacher-comment-input-q', ''));
      }

      container.innerHTML = '';
      const studentData = currentLiveData[uid] || {};

      questions.forEach(q => {
        const qData = studentData[`q${q.id}`];
        const savedSelection = qData ? qData.selection : null;
        let isAnswered = (savedSelection !== null && savedSelection !== undefined && savedSelection !== "");

        let cardClass = "bg-white p-6 md:p-8 rounded-lg shadow-sm border border-gray-200 transition-colors mb-4";
        let statusIcon = `<span class="text-gray-400 italic text-sm">Not answered</span>`;
        let optionsHtml = '';
        
        if (isAnswered) {
          if (savedSelection == SECURE_ANSWER_KEY[q.id]) {
            cardClass = "bg-green-50 p-6 md:p-8 rounded-lg shadow-sm border-2 border-green-400 mb-4"; statusIcon = `<span class="text-green-600 font-bold ml-2">✓ Correct</span>`;
          } else {
            cardClass = "bg-red-50 p-6 md:p-8 rounded-lg shadow-sm border-2 border-red-400 mb-4"; statusIcon = `<span class="text-red-600 font-bold ml-2">✗ Incorrect</span>`;
          }
        }
        
        optionsHtml = q.options.map((opt, i) => {
          const isChecked = savedSelection === i ? 'checked' : '';
          let labelClass = "flex items-start gap-3 py-2 px-2 -ml-2 rounded opacity-80 cursor-not-allowed";
          if (i === SECURE_ANSWER_KEY[q.id]) labelClass += " border-l-4 border-green-500 bg-white font-medium shadow-sm";
          return `<label class="${labelClass}"><input type="radio" disabled ${isChecked} class="mt-1 w-4 h-4 text-gray-400 bg-gray-100 border-gray-300 flex-shrink-0"><span class="text-sm md:text-base leading-relaxed break-words">${opt}</span></label>`;
        }).join('');

        let currentComment = qData ? (qData.teacherComment || "") : "";
        if (q.id === preservedQId) currentComment = preservedValue;
        const isCommentUnread = qData ? (qData.commentUnread === true) : false;

        let commentIconColor = "text-gray-300 hover:text-gray-400"; 
        if (currentComment !== "") {
          // GREEN SPEECH BUBBLE LOGIC (Fix 3)
          if (isCommentUnread) {
             commentIconColor = "text-orange-600 hover:text-orange-700 drop-shadow-sm"; 
          } else {
             commentIconColor = "text-green-600 hover:text-green-700 drop-shadow-sm"; 
          }
        }
        
        const commentButton = `<button onclick="toggleTeacherCommentArea(${q.id})" class="ml-3 p-1 rounded-full transition-all transform hover:scale-110 active:scale-95 ${commentIconColor} focus:ring-2 focus:ring-purple-300"><svg class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"></path></svg></button>`;

        const isAreaOpen = openCommentAreas.has(q.id);
        const commentAreaHtml = `<div id="comment-area-q${q.id}" class="${isAreaOpen ? '' : 'hidden'} mt-4 pt-4 border-t border-gray-100"><label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Teacher Comment:</label><textarea id="teacher-comment-input-q${q.id}" onblur="saveTeacherComment('${uid}', ${q.id})" rows="2" class="w-full p-2 border border-gray-300 rounded text-sm text-blue-700 font-bold focus:ring-2 focus:ring-purple-400 outline-none" placeholder="Type a hint or feedback here...">${currentComment}</textarea><div class="mt-2 flex justify-end items-center"><span class="text-[10px] text-gray-400 italic">Saves on blur (clicking out)</span></div></div>`;

        container.innerHTML += `<div class="${cardClass}"><div class="mb-4 text-base font-normal leading-relaxed text-gray-900 flex justify-between items-start"><div class="flex-1"><span class="font-medium mr-1">${q.id}.</span> ${q.text}</div><div class="shrink-0 flex items-center bg-white pl-2"><div class="text-sm whitespace-nowrap">${statusIcon}</div>${commentButton}</div></div><div class="flex flex-col gap-2 pl-2">${optionsHtml}</div>${commentAreaHtml}</div>`;
      });

      if (focusedId) {
        const el = document.getElementById(focusedId);
        if (el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT')) {
          el.focus(); if (selectionStart !== null) el.setSelectionRange(selectionStart, selectionEnd);
        }
      }
    }
    window.onload = init;
  </script>
</body>
</html>
